<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Painel Maison Beauty</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant:ital,wght@0,500;0,600;1,500&family=Figtree:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#FAF7F1; --panel:#FFFFFF; --ink:#262220; --muted:#8A7D6E; --line:#E9E1D2;
  --berry:#9C7A2E; --berry-soft:#F1E9D4; --flo:#6B5B45; --flo-soft:#EFE7D9; --mai:#9C7A2E; --mai-soft:#F1E9D4;
  --warn:#A8551C; --warn-soft:#FBEBDD; --ok:#3F7A57; --ok-soft:#E2F1E7;
  --serif:"Cormorant",Georgia,"Times New Roman",serif; --sans:"Figtree",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#1C1A16; --panel:#262320; --ink:#F3EFE6; --muted:#B5A98F; --line:#3B362C;
  --berry:#D4B45E; --berry-soft:#3A331F; --flo:#C9BB9C; --flo-soft:#2E2A20; --mai:#D4B45E; --mai-soft:#3A331F;
  --warn:#EDA46E; --warn-soft:#3A2618; --ok:#8CCBA4; --ok-soft:#1D3024;}}
:root[data-theme="dark"]{
  --bg:#1C1A16; --panel:#262320; --ink:#F3EFE6; --muted:#B5A98F; --line:#3B362C;
  --berry:#D4B45E; --berry-soft:#3A331F; --flo:#C9BB9C; --flo-soft:#2E2A20; --mai:#D4B45E; --mai-soft:#3A331F;
  --warn:#EDA46E; --warn-soft:#3A2618; --ok:#8CCBA4; --ok-soft:#1D3024;}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 var(--sans);min-height:100%}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
button:disabled{opacity:.45;cursor:not-allowed}
:focus-visible{outline:2px solid var(--berry);outline-offset:2px}
[hidden]{display:none!important}
.app{display:grid;grid-template-columns:230px 1fr;min-height:100vh}
.app>div{min-width:0}
aside{border-right:1px solid var(--line);padding:24px 16px;position:sticky;top:env(safe-area-inset-top,0px);height:100vh;display:flex;flex-direction:column;gap:20px}
.brandwrap{display:flex;align-items:center;gap:12px}
.logo{width:46px;height:46px;border-radius:10px;object-fit:cover;flex:none}
.logo.sm{width:34px;height:34px;border-radius:8px}
.brand{font-family:var(--serif);font-size:24px;line-height:1.05;font-weight:600;letter-spacing:.2px}
.brand small{display:block;font-family:var(--sans);font-size:11px;color:var(--muted);font-weight:500;margin-top:4px;letter-spacing:0}
nav{display:flex;flex-direction:column;gap:2px}
nav button{all:unset;cursor:pointer;padding:9px 12px;border-radius:8px;color:var(--muted);font-weight:500;display:flex;align-items:center;gap:10px}
nav button.on{background:var(--berry-soft);color:var(--berry)}
nav button .lock{margin-left:auto;font-size:11px;opacity:.7}
.who{margin-top:auto;font-size:13px;color:var(--muted)}
.who b{color:var(--ink)}
main{padding:28px clamp(16px,4vw,44px) 90px;max-width:1100px;width:100%}
.top{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:14px;margin-bottom:22px}
h1{font-family:var(--serif);font-weight:500;font-size:clamp(34px,5vw,48px);line-height:1;margin:0}
h2{font-family:var(--serif);font-weight:600;font-size:24px;margin:0 0 12px}
h3{font-size:15px;margin:0 0 8px;font-weight:600}
.sub{color:var(--muted);margin-top:8px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:999px;padding:3px;background:var(--panel)}
.seg button{border:0;background:none;padding:6px 14px;border-radius:999px;color:var(--muted);font-weight:500;font-size:14px}
.seg button.on{background:var(--ink);color:var(--bg)}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(auto-fit,minmax(300px,1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}
.box{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:18px}
.stat{font-family:var(--serif);font-size:32px;font-weight:600;line-height:1.1}
.lbl{color:var(--muted);font-size:13px}
.voucher{border:1.5px solid var(--berry);background:var(--berry-soft);border-radius:12px;padding:12px 14px;margin-bottom:12px}
.voucher.off,.voucher.semv{border-style:dashed;background:transparent;border-color:var(--line)}
.voucher .vt{font-weight:600;margin-bottom:6px}
.voucher .vl{display:flex;justify-content:space-between;padding:2px 0}
.voucher .vl.tot{border-top:1px solid var(--line);margin-top:4px;padding-top:6px;font-size:1.1em}
.row{display:flex;align-items:center;gap:12px;padding:11px 0;border-top:1px solid var(--line);flex-wrap:wrap}
.row>.grow{min-width:140px}
.row:first-of-type{border-top:0}
.row .grow{flex:1;min-width:0}
.row .t{font-weight:600;font-variant-numeric:tabular-nums;width:48px;flex:none}
.muted{color:var(--muted)}
.small{font-size:13px}
.tag{display:inline-block;font-size:12px;padding:2px 9px;border-radius:999px;font-weight:500;white-space:nowrap}
.tag.flo{background:var(--flo-soft);color:var(--flo)}
.tag.mai{background:var(--mai-soft);color:var(--mai)}
.tag.warn{background:var(--warn-soft);color:var(--warn)}
.tag.ok{background:var(--ok-soft);color:var(--ok)}
.btn{border:1px solid var(--line);background:var(--panel);padding:7px 14px;border-radius:999px;font-weight:500;font-size:14px}
.btn.p{background:var(--berry);border-color:var(--berry);color:#fff}
:root[data-theme="dark"] .btn.p{color:#1C1318}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .btn.p{color:#1C1318}}
.btn.sm{padding:4px 11px;font-size:13px}
.note{background:var(--warn-soft);color:var(--warn);padding:10px 14px;border-radius:10px;font-size:13px;margin-bottom:18px}
.note.err{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.cal{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:16px;max-width:460px}
.cal-top{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:8px}
.cal-top h3{margin:0;font-size:18px}
.cal-top .btn{padding:5px 12px}
.cal-g{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;text-align:center}
.cal-g .sem{font-size:11px;font-weight:600;color:var(--muted);padding:4px 0}
.cal-g button{border:0;background:transparent;border-radius:10px;min-height:42px;padding:4px 0;font-size:15px;color:var(--ink);cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px}
.cal-g button.fora{color:var(--muted);opacity:.55}
.cal-g button.hoje{background:var(--berry-soft);color:var(--berry);font-weight:600}
.cal-g button.sel{outline:2px solid var(--berry);outline-offset:-2px}
.cal-g button i{display:block;width:6px;height:6px;border-radius:50%;background:transparent}
.days{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;margin-bottom:16px}
.days button{flex:none;border:1px solid var(--line);background:var(--panel);border-radius:12px;padding:8px 12px;text-align:center;min-width:64px}
.days button b{display:block;font-family:var(--serif);font-size:22px;line-height:1}
.days button.on{border-color:var(--berry);background:var(--berry-soft);color:var(--berry)}
.days button i{display:block;width:6px;height:6px;border-radius:50%;margin:5px auto 0}
.cols{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(230px,1fr))}
.appt{border-left:3px solid var(--berry);padding:8px 10px;margin-top:8px;background:var(--bg);border-radius:0 8px 8px 0}
.appt.done{opacity:.55}
.search{width:100%;padding:10px 14px;border:1px solid var(--line);border-radius:10px;background:var(--panel);margin-bottom:14px}
.avatar img{width:100%;height:100%;border-radius:50%;object-fit:cover;display:block}
.avatar{overflow:hidden;width:38px;height:38px;border-radius:50%;background:var(--berry-soft);color:var(--berry);display:grid;place-items:center;font-family:var(--serif);font-weight:600;font-size:17px;flex:none}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{text-align:left;padding:9px 8px;border-top:1px solid var(--line);white-space:nowrap}
th{color:var(--muted);font-weight:500;border-top:0}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums}
.scroll{overflow-x:auto}
dialog{border:0;border-radius:18px;padding:0;background:var(--panel);color:var(--ink);width:min(640px,94vw);max-height:90vh}
dialog::backdrop{background:rgba(30,15,22,.45)}
.dh{display:flex;justify-content:space-between;align-items:center;padding:18px 22px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--panel);z-index:1}
.db{padding:18px 22px}
.x{border:0;background:none;font-size:22px;line-height:1;color:var(--muted)}
label.f{display:block;margin-bottom:12px;font-size:13px;color:var(--muted)}
label.f input,label.f select,label.f textarea{display:block;width:100%;margin-top:4px;padding:9px 11px;border:1px solid var(--line);border-radius:9px;background:var(--bg);color:var(--ink);font-size:15px}
.ck{display:flex;gap:10px;align-items:flex-start;padding:8px 0;border-top:1px solid var(--line);font-size:14px}
.ck input{margin-top:3px;accent-color:var(--berry)}
.alert{background:var(--warn-soft);color:var(--warn);border-radius:10px;padding:10px 12px;font-size:14px;margin:10px 0}
.photos{display:flex;gap:10px}
.ph{flex:1;aspect-ratio:4/3;border-radius:10px;background:linear-gradient(135deg,var(--berry-soft),var(--mai-soft));display:grid;place-items:center;color:var(--muted);font-size:13px;text-align:center;padding:6px}
canvas.sig{width:100%;height:130px;border:1px dashed var(--muted);border-radius:10px;background:var(--bg);touch-action:none}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:999px;font-size:14px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:50;max-width:90vw;text-align:center}
.toast.show{opacity:1}
.logo-wide{display:block;width:100%;max-width:190px;height:auto;background:#fff;border-radius:12px;padding:4px 8px}
.logo-wide.sm{width:auto;height:42px;max-width:none;padding:2px 8px;border-radius:8px}
.sub-brand{font-size:11px;color:var(--muted);margin-top:8px;line-height:1.35}
.sec{background:var(--berry-soft);color:var(--ink);padding:8px 12px;border-radius:8px;font-weight:600;margin:18px 0 10px}
.q{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:9px 0;border-top:1px solid var(--line);font-size:14px}
.q .sn{display:flex;gap:16px;flex:none}
.q .sn label,.svgrid label{display:inline-flex;gap:6px;align-items:center;cursor:pointer}
.q input[type=radio],.svgrid input,.fotor input{accent-color:var(--berry);width:18px;height:18px}
.svgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:8px 14px;font-size:14px;margin-bottom:10px}
.fotor{display:flex;gap:18px;flex-wrap:wrap;font-size:14px;margin:6px 0}
.fotor label{display:inline-flex;gap:6px;align-items:center;cursor:pointer}
.fgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:8px}
.fgrid figure{margin:0}
.fgrid img{width:100%;aspect-ratio:1/1;object-fit:cover;border-radius:10px;border:1px solid var(--line);cursor:pointer;display:block}
.fgrid figcaption{margin-top:3px}
.hero-unit{display:inline-flex;align-items:center;gap:8px;margin-top:10px;font-size:14px}
.hero-unit i{width:9px;height:9px;border-radius:50%}
.mob{display:none}
.entrar{min-height:100vh;display:grid;place-items:center;padding:20px}
.entrar .box{width:min(420px,100%)}
@media (max-width:820px){
  .app{grid-template-columns:1fr}
  aside{display:none}
  .mob{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:14px 16px 0}
  .mob .brand{font-size:22px}
  .bnav{position:fixed;left:0;right:0;bottom:0;background:var(--panel);border-top:1px solid var(--line);display:flex;overflow-x:auto;padding-bottom:env(safe-area-inset-bottom,0px);z-index:5}
  .bnav button{flex:1 0 auto;border:0;background:none;padding:12px 14px;font-size:13px;color:var(--muted);font-weight:500}
  .bnav button.on{color:var(--berry)}
  main{padding-top:14px}
}
@media (min-width:821px){.bnav{display:none}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div id="entrada"></div>
<div class="app" id="app" hidden>
  <aside>
    <div><img class="logo-wide" src="logo.png" alt="Maison Beauty"><div class="sub-brand">Tháriga Brito · Florença &amp; Maison Beauty · @mais.on.beauty</div></div>
    <nav id="nav"></nav>
    <div class="who" id="quem"></div>
    <button class="btn" id="ajuda1">Preciso de ajuda</button>
  </aside>
  <div>
    <div class="mob"><img class="logo-wide sm" src="logo.png" alt="Maison Beauty"><span><button class="btn sm" id="ajuda2">Ajuda</button> <button class="btn sm" id="sair2">Sair</button></span></div>
    <main id="main"></main>
  </div>
</div>
<div class="bnav" id="bnav" hidden></div>
<dialog id="dlg"></dialog>
<div class="toast" id="toast"></div>

<script type="module">
import { initializeApp } from 'https://www.gstatic.com/firebasejs/12.14.0/firebase-app.js';
import { getDatabase, ref, onValue, get, set, push, update, remove } from 'https://www.gstatic.com/firebasejs/12.14.0/firebase-database.js';
import { getAuth, signInWithEmailAndPassword, sendPasswordResetEmail, onAuthStateChanged, signOut } from 'https://www.gstatic.com/firebasejs/12.14.0/firebase-auth.js';

// ── O projeto Firebase do Maison Beauty (separado do cartório) ──
// Preencher com os dados do projeto novo (Configurações do projeto → Seus apps).
// Enquanto estiver em branco o painel abre em DEMONSTRAÇÃO: dados só na memória
// do navegador, nada é gravado. Passo a passo no FIREBASE.md.
const firebaseConfig = {
  apiKey: "AIzaSyD0p5Y0HDL2rcDLE6qFNSb4nyPe3yFjXos",
  authDomain: "maison-beauty-2e7da.firebaseapp.com",
  databaseURL: "https://maison-beauty-2e7da-default-rtdb.firebaseio.com",
  projectId: "maison-beauty-2e7da",
  storageBucket: "maison-beauty-2e7da.firebasestorage.app",
  messagingSenderId: "30042816821",
  appId: "1:30042816821:web:e0e5cbcfe596d3a1a40c7c"
};
const DEMO = !firebaseConfig.apiKey;
// Suporte: endereço do Apps Script que manda o e-mail (ver apps-script/suporte.js e FIREBASE.md). Em branco = só grava no banco.
const SUPORTE_URL='https://script.google.com/macros/s/AKfycbwoAlGyx8BElcl4Xf2rVknbdbAPvFuilPTDadFsZc-NnufV6g8bhYCp95O758FAOQNeMg/exec';
const SUPORTE_CHAVE='YeW0wL5MBpOcA1bkiv3KCz9xhpb_iSEV';
// Endereço que a CLIENTE vê nos links (ficha, horário, agendamento). Em branco = o endereço em que o painel foi aberto.
// Endereço sem "cartorio" (domínio criado na Vercel, projeto maison). Não use o endereço antigo em nada que a cliente veja.
const DOMINIO_PUBLICO='https://thariga-brito.vercel.app';
const origemPublica=()=>(DOMINIO_PUBLICO||location.origin).replace(/\/$/,'');
const AGENDA_URL='';
const AGENDA_CHAVE='EXiC2WouRkPbh2W8AjhCWhpx4lUZJxRB';

// ═══ Camada de dados ═══════════════════════════════════════════════════
// Duas portas com a mesma cara: o banco de verdade e a memória (demonstração).
// Toda gravação é esperada (await) e, se o banco disser não, a tela diz.
// Toda leitura que falha mostra o motivo, com "Tentar de novo" — o Firebase
// não tenta sozinho depois de um permission denied.
let fb=null,auth=null;
const mem={tree:{},subs:[]};
const memGet=p=>p.split('/').reduce((o,k)=>o==null?null:o[k],mem.tree)??null;
function memSet(p,v){const ks=p.split('/');let o=mem.tree;ks.slice(0,-1).forEach(k=>{o[k]=o[k]||{};o=o[k]});
  if(v==null)delete o[ks.at(-1)];else o[ks.at(-1)]=JSON.parse(JSON.stringify(v));
  mem.subs.forEach(s=>s.cb(memGet(s.p)))}
const DB={
  sub(p,cb,onErr){
    if(DEMO){const s={p,cb};mem.subs.push(s);setTimeout(()=>cb(memGet(p)),0);return()=>{mem.subs=mem.subs.filter(x=>x!==s)}}
    return onValue(ref(fb,p),sn=>cb(sn.val()),e=>onErr&&onErr(p,e))},
  async set(p,v){if(DEMO)return memSet(p,v);await set(ref(fb,p),v)},
  async push(p,v){if(DEMO){const id='d'+Date.now().toString(36)+Math.random().toString(36).slice(2,5);memSet(p+'/'+id,v);return id}
    const r=push(ref(fb,p));await set(r,v);return r.key},
  async upd(p,v){if(DEMO){Object.entries(v).forEach(([k,x])=>memSet(p+'/'+k,x));return}await update(ref(fb,p),v)},
  async del(p){if(DEMO)return memSet(p,null);await remove(ref(fb,p))},
  async get(p){if(DEMO)return memGet(p);return (await get(ref(fb,p))).val()}
};
// ── Cadastros repetidos: o painel pergunta antes de duplicar ──
const norm=t=>String(t||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().replace(/\s+/g,' ').trim();
const soDigitos=t=>String(t||'').replace(/\D/g,'');
// Devolve true se pode seguir: nada parecido, ou ela confirmou que quer duplicar.
const podeDuplicar=(existente,oque)=>!existente||confirm(`Já existe ${oque}: ${existente}.\n\nQuer cadastrar mesmo assim, duplicando?`);
function clienteParecida(n,tel,ignorarId){const nn=norm(n),td=soDigitos(tel).slice(-9);
  return cliVisiveis().find(c=>c.id!==ignorarId&&(norm(c.n)===nn||(td.length>=8&&soDigitos(c.tel).slice(-9)===td)))}
const descCli=c=>`"${c.n}"${isAdmin()?' ('+(c.unit==='ambas'?'nas duas unidades':U[c.unit]?.n||'')+')':''}${c.tel?' · '+c.tel:''}`;
// Foto pequena do cadastro (miniatura de 96 px guardada no próprio cliente); sem foto, a inicial do nome.
const avatarHtml=c=>c&&/^data:image\/jpeg;base64,[A-Za-z0-9+/=]+$/.test(c.avatar||'')?`<div class="avatar"><img src="${c.avatar}" alt=""></div>`:`<div class="avatar">${esc(((c&&c.n)||'?')[0])}</div>`;
function miniatura(dataUrl){return new Promise((res,rej)=>{const im=new Image();im.onload=()=>{const t=Math.min(im.width,im.height),cv=document.createElement('canvas');cv.width=cv.height=96;
  cv.getContext('2d').drawImage(im,(im.width-t)/2,(im.height-t)/2,t,t,0,0,96,96);res(cv.toDataURL('image/jpeg',.72))};im.onerror=()=>rej(new Error('Não consegui ler a foto.'));im.src=dataUrl})}
// Data em milissegundos (meia-noite UTC): as regras do banco usam para conferir o dia da semana da Laís.
const tsDe=d=>{const [y,m,x]=d.split('-').map(Number);return Date.UTC(y,m-1,x)};
// ── Confirmação do horário para a cliente (WhatsApp ou e-mail, sem precisar de script) ──
function msgConfirmacao(a,remarcado){
  const c=cli(a.cli),s=sv(a.serv,a.unit),u=U[a.unit],p=PEOPLE[a.pro]?.n;
  const dia=new Date(a.date+'T12:00').toLocaleDateString('pt-BR',{weekday:'long',day:'2-digit',month:'2-digit'});
  // Página própria (horario.html, atalho /h): na prévia do WhatsApp aparece a logo da Maison Beauty, e ela traz os botões de salvar na agenda.
  const link=origemPublica()+'/h?s='+encodeURIComponent(s.n)+'&d='+a.date+'&h='+a.hora+'&m='+(s.d||60)+'&u='+a.unit+(p?'&p='+encodeURIComponent(p):'');
  const nome=(c.n||'').split(' ')[0];
  const texto=`Oi, ${nome}! ${remarcado?'Seu horário foi remarcado':'Seu horário está confirmado'}: ${s.n}${p?' com '+p:''}, ${dia}, às ${a.hora}, no ${u.n} (${u.s}).\n\nVeja os detalhes e salve na sua agenda: ${link}\n\nQualquer imprevisto, é só avisar por aqui. Até lá! 🤍`;

const emailOk=e=>/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(e||'');
async function agendaChama(corpo){
  if(!AGENDA_URL)return {ok:false,erro:'sem-url'};
  try{const r=await fetch(AGENDA_URL,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({chave:AGENDA_CHAVE,...corpo})});return await r.json()}
  catch(e){guardaErro(e.message);return {ok:false,erro:e.message}}}
// O evento leva só serviço, unidade e horário: nada de ficha, anamnese ou valor.
function eventoDe(a){const s=sv(a.serv,a.unit),c=cli(a.cli);
  return {data:a.date,hora:a.hora,minutos:s.d||60,email:c.email,titulo:s.n+' · '+U[a.unit].n,local:U[a.unit].n,
    descricao:'Horário reservado com a equipe da Tháriga Brito. Para remarcar ou tirar dúvidas, responda por WhatsApp.'}}
// Convida (ou, se já existe evento, só atualiza o horário). Nunca deixa o agendamento sem dizer o que houve.
async function convidar(id,p,a){
  const ev=eventoDe(a);
  const r=a.evento?await agendaChama({acao:'atualizar',id:a.evento,data:ev.data,hora:ev.hora,minutos:ev.minutos}):await agendaChama({acao:'criar',...ev});
  if(r.ok){await grava(()=>DB.upd(p+'/agenda/'+id,{evento:a.evento||r.id,convite:'enviado',rsvp:'sem-resposta'}));return true}
  await grava(()=>DB.upd(p+'/agenda/'+id,{convite:a.evento?'desatualizado':'erro'}));return false}
async function respostasAgenda(avisar){
  const lista=agendaAtiva().filter(a=>a.evento&&a.st!=='Atendido'&&a.date>=iso(addD(TODAY,-1))&&emailOk(cli(a.cli).email));
  if(!lista.length){if(avisar)toast('Nenhum convite para conferir.');return}
  const r=await agendaChama({acao:'status',ids:lista.map(a=>({id:a.evento,email:cli(a.cli).email}))});
  if(!r.ok){if(avisar)toast('Não consegui consultar a Google Agenda agora.');return}
  let mudou=0;
  for(const a of lista){const novo=r.status[a.evento];if(novo&&novo!=='erro'&&novo!==a.rsvp){mudou++;await grava(()=>DB.upd(a._p+'/agenda/'+a.id,{rsvp:novo}))}}

const respTag=a=>{if(!a.evento&&!a.convite)return '';

// ── Brinde de aniversário como voucher ──
// O desconto só existe se a Tháriga liberou antes: um código por cliente, uso único, com prazo.
// Quem atende não digita desconto: aplica o voucher, e o painel calcula. Desconto sem voucher exige motivo e fica marcado.
// A regra é VIVA: quem muda aqui muda na hora para todos os códigos que ainda não foram usados (nada fica gravado no código além de quem é e quando saiu).
// pct = desconto padrão; limite > 0 = serviço até esse valor recebe pctAte (o mais barato); limite 0 = sem limite, todos recebem pct; dias 0 = sem prazo.
const BRINDE_REGRA_PADRAO={pct:10,limite:0,pctAte:5,dias:0};
const regraBrinde=()=>{const c=(C.mCfg&&C.mCfg.brindeRegra)||{};return {...BRINDE_REGRA_PADRAO,...(c.v===2?c:{})}};
const valeAteDe=(v,r)=>r.dias>0&&v.emitido?iso(addD(new Date(v.emitido+'T12:00'),r.dias)):'';
const vouchers=()=>{const r=regraBrinde();return [...arr(C.mVou).map(v=>({...v,_p:'maison'})),...(isAdmin()?arr(C.fVou).map(v=>({...v,_p:'florenca'})):[])].map(v=>({...v,valeAte:valeAteDe(v,r)}))};
const venceu=(v,data)=>!!v.valeAte&&v.valeAte<data;
const ateTxt=v=>v.valeAte?'até '+fd(v.valeAte):'sem prazo';
const pctBrinde=(preco,r)=>r.limite>0&&preco<=r.limite?r.pctAte:r.pct;
const centavos=v=>Math.round(v*100)/100;
const calcBrinde=(preco,r=regraBrinde())=>{const pct=pctBrinde(preco,r),desc=Math.round(preco*pct)/100;return{pct,desc,final:centavos(preco-desc)}};
const voucherAtivo=(cid,data)=>vouchers().filter(v=>v.cli===cid&&!v.usado&&!v.cancelado&&!venceu(v,data)).sort((a,b)=>(b.emitido||'').localeCompare(a.emitido||''))[0]||null;
const voucherRecente=cid=>vouchers().filter(v=>v.cli===cid&&!v.cancelado).sort((a,b)=>(b.emitido||'').localeCompare(a.emitido||''))[0]||null;
const MOTIVOS_DESC=['Cortesia autorizada pela Tháriga','Pacote ou combinado com a cliente','Correção de preço','Outro'];
function novoCodigo(){const al='ABCDEFGHJKLMNPQRSTUVWXYZ23456789',b=crypto.getRandomValues(new Uint8Array(6));return 'NIVER-'+[...b].map(x=>al[x%al.length]).join('')}
const textoVoucher=v=>{const r=regraBrinde(),l=brl(r.limite).replace(/,00$/,'');
  const regra=r.limite>0&&r.pctAte!==r.pct?`${r.pctAte}% de desconto nos serviços até ${l} e ${r.pct}% nos acima disso`:`${r.pct}% de desconto no seu próximo atendimento`;
  return `${regra}${v.valeAte?', válido até '+fd(v.valeAte,{day:'2-digit',month:'2-digit',year:'numeric'}):''}. Seu código: ${v.id}. É só falar o código na hora do atendimento.`};
async function liberarBrinde(cid){if(!isAdmin())return null;const c=cli(cid),ano=TODAY.getFullYear();
  const ja=vouchers().find(v=>v.cli===cid&&v.ano===ano&&!v.cancelado);
  if(ja){toast('Esta cliente já tem brinde neste ano.');return ja}
  const cod=novoCodigo(),base=c._p==='florenca'?'florenca':'maison';
  // valeAte/limite/pctAte/pctAcima ficam só como marcadores, para as regras do banco antigas continuarem aceitando; quem manda é a regra viva.
  const dado={cli:cid,nome:c.n,ano,emitido:iso(TODAY),emitidoPor:S.user.nome,valeAte:'-',limite:0,pctAte:0,pctAcima:0,usado:false};
  const ok=await grava(()=>DB.set(base+'/vouchers/'+cod,dado),'Brinde liberado para '+c.n.split(' ')[0]);
  return ok?{id:cod,...dado,valeAte:valeAteDe(dado,regraBrinde()),_p:base}:null}
const motivoHtml=()=>`<div id="cmot" class="alert" hidden style="margin-bottom:12px"><b>Valor abaixo da tabela.</b> Diga o motivo: a Tháriga vê este desconto em Financeiro.
  <label class="f" style="margin-top:8px">Motivo<select id="cm"><option value="">Escolha…</option>${MOTIVOS_DESC.map(x=>`<option>${x}</option>`).join('')}</select></label>
  <label class="f" style="margin-bottom:0">Detalhe (quem autorizou, o que combinou)<input id="cmd" maxlength="140"></label></div>`;
const lerMotivo=()=>{const m=document.getElementById('cm').value,d=document.getElementById('cmd').value.trim();
  if(!m){toast('Escolha o motivo do desconto');return null}
  if(!d){toast('Escreva o detalhe do desconto');return null}
  return{tipo:'manual',motivo:m,det:d,por:S.user.nome,em:iso(TODAY)}};
function brindeTag(cid){const v=voucherRecente(cid);
  if(!v)return isAdmin()?`<button class="btn sm" data-lib="${cid}">Liberar brinde</button>`:'';
  return v.usado?'<span class="tag">Brinde usado</span>':venceu(v,iso(TODAY))?'<span class="tag warn">Brinde venceu</span>':`<span class="tag ok" title="${esc(v.id)}">🎁 ${ateTxt(v)}</span>`}
function concluir(id,p){const a=agenda().find(x=>x.id===id&&x._p===p),s=sv(a.serv,a.unit);
  let vou=voucherAtivo(a.cli,a.date),aplicar=!!vou;
  openDlg('Concluir atendimento',`<p><b>${esc(cli(a.cli).n)}</b><br><span class="muted">${esc(s.n)} com ${esc(PEOPLE[a.pro]?.n)} · ${U[a.unit].n}</span></p>
  <div id="cvbox"></div>
  <label class="f">Valor cobrado<input type="number" step="0.01" id="cv" value="${s.p}"></label>
  ${motivoHtml()}
  <label class="f">Forma de pagamento<select id="cp">${PAG.map(x=>`<option>${x}</option>`).join('')}</select></label>
  <label class="f">Observações e produtos usados<textarea rows="2" id="co" placeholder="Ex.: henna castanho médio, fixação 8 min"></textarea></label>
  <button class="btn p" id="csave">Registrar atendimento</button>`);
  const cv=document.getElementById('cv'),box=document.getElementById('cvbox'),mot=document.getElementById('cmot');
  const atualiza=()=>{
    if(vou&&aplicar){const k=calcBrinde(s.p);cv.value=k.final.toFixed(2);cv.readOnly=true;mot.hidden=true;
      box.innerHTML=`<div class="voucher"><div class="vt">🎁 Brinde de aniversário</div><div class="vl"><span>Tabela</span><b>${brl(s.p)}</b></div><div class="vl"><span>Desconto de ${String(k.pct).replace('.',',')}%</span><b>− ${brl(k.desc)}</b></div><div class="vl tot"><span>A cobrar</span><b>${brl(k.final)}</b></div><div class="small muted" style="margin-top:6px">Código ${esc(vou.id)} · ${vou.valeAte?'vale até '+fd(vou.valeAte):'sem prazo'} · uso único. O valor está travado.</div><button type="button" class="btn sm" id="vno" style="margin-top:8px">Não aplicar o brinde</button></div>`;
      document.getElementById('vno').onclick=()=>{aplicar=false;cv.value=s.p;atualiza()}}
    else{cv.readOnly=false;
      box.innerHTML=vou?`<div class="voucher off"><div class="vt">🎁 Brinde disponível, não aplicado</div><button type="button" class="btn sm" id="vyes">Aplicar o brinde</button></div>`:`<div class="voucher semv"><div class="vt">Tem código de brinde?</div><div style="display:flex;gap:8px"><input id="vcod" placeholder="NIVER-XXXXXX" autocapitalize="characters" style="flex:1"><button type="button" class="btn sm" id="vcheck">Conferir</button></div><div class="small" id="vmsg" style="margin-top:6px"></div></div>`;
      const y=document.getElementById('vyes');if(y)y.onclick=()=>{aplicar=true;atualiza()};
      const ck=document.getElementById('vcheck');if(ck)ck.onclick=()=>{const cod=document.getElementById('vcod').value.trim().toUpperCase(),m=document.getElementById('vmsg'),v=vouchers().find(x=>x.id===cod);
        if(!cod){m.textContent='Digite o código.';return}
        if(!v||v.cancelado){m.textContent='Código não encontrado.';return}
        if(v.cli!==a.cli){m.textContent='Este código é de outra cliente. Não vale neste atendimento.';return}
        if(v.usado){m.textContent='Este código já foi usado.';return}
        if(venceu(v,a.date)){m.textContent='Este código venceu em '+fd(v.valeAte)+'.';return}
        vou=v;aplicar=true;atualiza()};
      mot.hidden=!(parseFloat(cv.value)<s.p-0.005)}};
  cv.oninput=()=>{if(!(vou&&aplicar))mot.hidden=!(parseFloat(cv.value)<s.p-0.005)};
  atualiza();
  document.getElementById('csave').onclick=async()=>{
    const btn=document.getElementById('csave');btn.disabled=true;
    const valor=parseFloat(cv.value);
    if(!(valor>=0)){toast('Digite o valor cobrado');btn.disabled=false;return}
    const usaV=vou&&aplicar;let desc=null,k=null;
    if(usaV){k=calcBrinde(s.p);if(Math.abs(valor-k.final)>0.005){toast('O valor do brinde não pode ser mudado.');btn.disabled=false;return}
      desc={tipo:'brinde',voucher:vou.id,pct:k.pct,valorDesc:k.desc,por:S.user.nome,em:iso(TODAY)}}
    else if(valor<s.p-0.005){desc=lerMotivo();if(!desc){btn.disabled=false;return}}
    const ok=await grava(async()=>{
      // O registro do atendimento não leva dinheiro; o valor vai para o caminho que a funcionária só cria e não lê.
      const hid=await DB.push(p+'/atendimentos',{date:a.date,cli:a.cli,serv:a.serv,pro:a.pro,unit:a.unit,obs:document.getElementById('co').value,agenda:a.id});
      // O voucher é marcado como usado primeiro, já ligado a este atendimento: é isso que autoriza o valor com brinde.
      if(usaV)await DB.upd(vou._p+'/vouchers/'+vou.id,{usado:true,usadoEm:iso(TODAY),usadoPor:S.user.nome,atend:hid});
      const reg={valor,pag:document.getElementById('cp').value,tabela:s.p};if(desc)reg.desc=desc;
      await DB.set('financeiro/valores/'+hid,reg);
      await DB.set(p+'/agenda/'+a.id+'/st','Atendido');
    },usaV?'Atendimento registrado com o brinde':'Atendimento registrado');
    if(ok)closeDlg();else btn.disabled=false}}
function remarcarAg(id,p){const a=agenda().find(x=>x.id===id&&x._p===p);if(!a)return;
  openDlg('Remarcar agendamento',`<p><b>${esc(cli(a.cli).n)}</b><br><span class="muted">${esc(sv(a.serv,a.unit).n)} com ${esc(PEOPLE[a.pro]?.n)} · ${U[a.unit].n}</span></p>
  <div style="display:flex;gap:10px"><label class="f" style="flex:1">Data<input type="date" id="rd" value="${a.date}"></label><label class="f" style="flex:1">Hora<input type="time" id="rh" value="${a.hora}"></label></div>
  <div id="ravisos"></div><button class="btn p" id="rsave">Salvar nova data</button>`);
  const rd=document.getElementById('rd'),rh=document.getElementById('rh'),rav=document.getElementById('ravisos'),rs=document.getElementById('rsave');
  const check=()=>{const d=rd.value;let ok=!!d&&!!rh.value;const msgs=[];
    if(d){
      if(a.pro==='tha'){if(unitFor(d)!==a.unit){ok=false;msgs.push(`Neste dia a Tháriga atende no ${U[unitFor(d)].n}. Cancele este agendamento e crie um novo.`)}}
      else{if(unitFor(d)!=='mai'){ok=false;msgs.push('Neste dia o Maison Beauty está fechado — é dia do Florença.')}
        if(a.pro==='lais'&&!laisDay(d)){ok=false;msgs.push('A Laís atende somente às segundas-feiras.')}}
      const choque=agendaAtiva().find(x=>x.id!==a.id&&x.pro===a.pro&&x.date===d&&x.hora===rh.value&&x.st!=='Atendido');
      if(choque)msgs.push(`${PEOPLE[a.pro].n} já tem ${cli(choque.cli).n} às ${rh.value}. Dá para remarcar mesmo assim.`);
    }
    rav.innerHTML=msgs.map(m=>`<div class="alert">${esc(m)}</div>`).join('');rs.disabled=!ok};
  [rd,rh].forEach(e=>e.onchange=check);check();
  rs.onclick=async()=>{if(rs.disabled)return;rs.disabled=true;
    const ok=await grava(()=>DB.upd(p+'/agenda/'+a.id,{date:rd.value,ts:tsDe(rd.value),hora:rh.value}),'Agendamento remarcado');
    if(!ok){rs.disabled=false;return}
    closeDlg();
    if(a.evento&&AGENDA_URL){const sent=await convidar(a.id,p,{...a,date:rd.value,hora:rh.value});
      toast(sent?'Convite atualizado: a cliente recebe o novo horário':'Remarcado, mas a Google Agenda não atualizou. Use "Reenviar convite".')}
    confirmarAg({...a,date:rd.value,hora:rh.value},true)}}
async function cancelarAg(id,p){const a=agenda().find(x=>x.id===id&&x._p===p);if(!a)return;
  if(!confirm(`Cancelar o agendamento de ${cli(a.cli).n} em ${fd(a.date)} às ${a.hora}?`))return;
  const ok=await grava(()=>DB.upd(p+'/agenda/'+id,{st:'Cancelado',canceladoPor:S.user.nome,canceladoEm:iso(TODAY)}),'Agendamento cancelado');
  if(ok&&a.evento&&AGENDA_URL){const r=await agendaChama({acao:'cancelar',id:a.evento});
    toast(r.ok?'A cliente recebeu o aviso de cancelamento':'Cancelado aqui, mas o convite continua na Google Agenda: apague o evento por lá.')}}


// ── Agenda online: a "secretária" ──
// A cliente marca sozinha na página pública /p, num horário que o painel diz estar livre.
//  • /publico/agenda/{u}/cfg   → liga/desliga e as regras (a Tháriga define)
//  • /publico/agenda/{u}/ocup  → só HORÁRIOS ocupados, sem nome nenhum (o painel mantém sempre igual à agenda)
//  • /{base}/reservas/{data}_{hhmm}_{n} → o que a cliente grava; o painel transforma em agendamento
// Quem cuida disso é qualquer pessoa com o painel aberto; nada exige servidor.
const AGON_PADRAO={mai:{ativo:false,ini:'07:30',fim:'19:00',paralelo:2},flo:{ativo:false,ini:'09:00',fim:'19:00',paralelo:1}};
const agonCfg=u=>({...AGON_PADRAO[u],passo:30,dias:21,antecH:3,fechados:[],...(((u==='flo'?C.pubFlo:C.pubMai)||{}).cfg||{})});
const durServ=a=>sv(a.serv,a.unit).d||30;
let secT=0;const convertendo=new Set();
function agendarSecretaria(){clearTimeout(secT);secT=setTimeout(()=>{sincronizarPublico().catch(e=>guardaErro(e.message));converterReservas().catch(e=>guardaErro(e.message))},1500)}
async function sincronizarPublico(){if(!S.user)return;
  const hoje=iso(TODAY),ate=iso(addD(TODAY,70));
  for(const u of (isAdmin()?['mai','flo']:['mai'])){
    const pub=(u==='flo'?C.pubFlo:C.pubMai)||{},ocup=pub.ocup||{},deseja={};
    const poe=(d,k,h,m)=>{(deseja[d]=deseja[d]||{})[k]={h,m}};
    agendaAtiva().filter(a=>a.unit===u&&a.date>=hoje&&a.date<=ate).forEach(a=>poe(a.date,a.res||a.id,a.hora,durServ(a)));
    arr(u==='flo'?C.fRes:C.mRes).filter(r=>!r.st&&r.data>=hoje).forEach(r=>poe(r.data,r.id,r.hora,r.m||30));
    const base='publico/agenda/'+u+'/ocup/';
    for(const d of new Set([...Object.keys(deseja),...Object.keys(ocup)])){
      const want=deseja[d]||{},have=ocup[d]||{};
      for(const k of Object.keys(want))if(!have[k]||have[k].h!==want[k].h||have[k].m!==want[k].m)await DB.set(base+d+'/'+k,want[k]);
      for(const k of Object.keys(have))if(!want[k])await DB.del(base+d+'/'+k)}}}
// Quem estiver livre naquele horário: Maison tem Rafael e Mariana (e a Laís às segundas); o Florença é só a Tháriga.
function proLivre(u,data,hora,dur){const lista=u==='flo'?['tha']:['rafael','mariana',...(laisDay(data)?['lais']:[])];
  const i0=minDe(hora),f0=i0+dur;
  const ocupado=p=>agendaAtiva().some(a=>a.unit===u&&a.pro===p&&a.date===data&&minDe(a.hora)<f0&&minDe(a.hora)+durServ(a)>i0);
  const livre=lista.find(p=>!ocupado(p));return{pro:livre||lista[0],conflito:!livre}}
const minDe=h=>{const [a,b]=String(h).split(':').map(Number);return a*60+(b||0)};
async function converterReservas(){if(!S.user)return;
  for(const u of (isAdmin()?['mai','flo']:['mai'])){const base=u==='flo'?'florenca':'maison';
    for(const r of arr(u==='flo'?C.fRes:C.mRes).filter(x=>!x.st)){const ch=base+'/'+r.id;if(convertendo.has(ch))continue;convertendo.add(ch);
      try{
        const aid='lk_'+r.id,dig=soDigitos(r.tel).slice(-8);
        let c=dig.length<8?null:clientes().find(x=>x._p===base&&soDigitos(x.tel).slice(-8)===dig),cid=c&&c.id;
        if(!c){cid='lk_'+soDigitos(r.tel).slice(-11);await DB.set(base+'/clientes/'+cid,{n:r.nome,tel:r.tel,email:'',niver:'',nasc:'',unit:u==='flo'?'flo':'mai',origem:'link'})}
        const s0=servicosDe(u,false).find(x=>x.n===r.serv),sid=s0?s0.id:r.serv,{pro,conflito}=proLivre(u,r.data,r.hora,r.m||30);
        if(!agenda().some(a=>a.id===aid&&a._p===base)){
          const reg={date:r.data,ts:tsDe(r.data),hora:r.hora,cli:cid,serv:sid,pro,unit:u,st:'Agendado',origem:'link',res:r.id,visto:false,pedidoEm:r.em||0};if(conflito)reg.conflito=true;if(r.obs)reg.obsLink=r.obs;
          await DB.set(base+'/agenda/'+aid,reg)}
        await DB.upd(base+'/reservas/'+r.id,{st:'convertida',agenda:aid});
      }catch(e){guardaErro('reserva '+r.id+': '+e.message)}finally{convertendo.delete(ch)}}}}
const marcadosPeloLink=()=>agendaAtiva().filter(a=>a.origem==='link'&&!a.visto&&a.date>=iso(TODAY)).sort((a,b)=>(a.pedidoEm||0)-(b.pedidoEm||0));
const diaLongo=d=>{const x=new Date(d+'T12:00');return prim1(x.toLocaleDateString('pt-BR',{weekday:'long'}))+', '+fd(d)};

const lkVisto=(id,p)=>DB.upd(p+'/agenda/'+id,{visto:true}).catch(e=>guardaErro(e.message));
function lkRecusar(id,p){const a=agenda().find(x=>x.id===id&&x._p===p);if(!a)return;const c=cli(a.cli),u=U[a.unit];

    const ok=await grava(()=>DB.upd(p+'/agenda/'+id,{st:'Cancelado',visto:true,canceladoPor:S.user.nome,canceladoEm:iso(TODAY),motivo:'recusado'}),'Horário cancelado');
    if(ok){closeDlg();window.open(zapLink(c.tel,t),'_blank','noopener')}}}

  <label class="f">Serviço<select id="ns"></select></label>

  const nc=document.getElementById('nc'),ns=document.getElementById('ns'),np=document.getElementById('np'),nd=document.getElementById('nd'),nh=document.getElementById('nh'),navisos=document.getElementById('navisos'),nsave=document.getElementById('nsave');

    else{u='mai';if(d&&unitFor(d)!=='mai'){ok=false;msgs.push(`Neste dia o Maison Beauty está fechado — é dia do Florença.`)}}
    if(p==='lais'&&d&&!laisDay(d)){ok=false;msgs.push('A Laís atende somente às segundas-feiras.')}
    const choque=agendaAtiva().find(a=>a.pro===p&&a.date===d&&a.hora===nh.value&&a.st!=='Atendido');
    if(choque)msgs.push(`${PEOPLE[p].n} já tem ${cli(choque.cli).n} às ${nh.value}. Dá para agendar mesmo assim.`);

    if(ns.innerHTML!==opts){const cur=ns.value;ns.innerHTML=opts;if([...ns.options].some(o=>o.value===cur))ns.value=cur}
    if(p==='tha')msgs.unshift(`Neste dia a Tháriga atende no ${U[u].n}.`);
    const an=anamDe(c.id);
    if(c&&anamVencida(c))msgs.push(`${c.n} precisa preencher ou atualizar a anamnese antes deste procedimento.`);
    if(an&&an.flags&&an.flags.length)msgs.push(`Atenção na ficha: ${an.flags.join(', ')}.`);

      enviarLinkAnamnese(c.id,()=>novoAg(est))};
    nsave.disabled=!ok;return u};
  [nc,np,nd,nh].forEach(e=>e.onchange=check);check();

  document.getElementById('nnc').onclick=e=>{e.preventDefault();const est={pro:np.value,data:nd.value,hora:nh.value,serv:ns.value};novoCliente({voltar:id=>novoAg({...est,cli:id})})};
  nsave.onclick=async()=>{const u=check();if(nsave.disabled)return;nsave.disabled=true;
    const base=u==='flo'?'florenca':'maison',novo={date:nd.value,ts:tsDe(nd.value),hora:nh.value,cli:nc.value,serv:ns.value,pro:np.value,unit:u,st:'Agendado'};let nid;
    const ok=await grava(async()=>{nid=await DB.push(base+'/agenda',novo)},'Agendado');
    if(!ok){nsave.disabled=false;return}
    closeDlg();
    const em=cli(novo.cli).email;
    if(AGENDA_URL&&emailOk(em)){toast('Enviando o convite…');
      const sent=await convidar(nid,base,novo);
      toast(sent?'Convite enviado para '+em:'Agendado, mas o convite não saiu. Use "Reenviar convite" na agenda.')}
    confirmarAg(novo,false)}
}

// ── Fotos: reduzidas no aparelho e guardadas no próprio banco ──
// Ficam em /{unidade}/fotos/{cliente}/{foto}. Só se envia foto de quem autorizou na anamnese.
function podeFoto(cid){const an=anamDe(cid);
  if(!an)return 'Preencha a anamnese antes de tirar fotos.';
  if(an.fotoOk!==true)return 'Esta cliente não autorizou fotos na anamnese.';
  return null}
function reduzirFoto(file){return new Promise((res,rej)=>{
  const url=URL.createObjectURL(file),im=new Image();
  im.onload=()=>{URL.revokeObjectURL(url);const r=Math.min(1,1280/Math.max(im.width,im.height));
    const cv=document.createElement('canvas');cv.width=Math.round(im.width*r);cv.height=Math.round(im.height*r);
    cv.getContext('2d').drawImage(im,0,0,cv.width,cv.height);
    for(const q of [.72,.6,.5,.4]){const d=cv.toDataURL('image/jpeg',q);if(d.length<=600000||q===.4)return res(d)}};
  im.onerror=()=>{URL.revokeObjectURL(url);rej(new Error('Não foi possível ler essa imagem.'))};im.src=url})}
function escolherFoto(cid,tipo,atendId,depois){const msg=podeFoto(cid);if(msg){toast(msg);return}
  const inp=document.createElement('input');inp.type='file';inp.accept='image/*';
  inp.onchange=async()=>{const f=inp.files[0];if(!f)return;toast('Enviando a foto…');
    try{const img=await reduzirFoto(f),c=cli(cid),base=c._p==='florenca'?'florenca':'maison';
      const reg={tipo,data:iso(TODAY),img,por:S.user.nome};if(atendId)reg.atend=atendId;
      const salvou=await grava(async()=>{await DB.push(base+'/fotos/'+cid,reg);
        // A primeira foto inicial vira também a foto pequena do cadastro (aparece nas listas).
        if(tipo==='inicial'&&!c.avatar){try{await DB.upd(base+'/clientes/'+cid,{avatar:await miniatura(img)})}catch(e){guardaErro(e.message)}}},'Foto salva');
      if(salvou&&depois)depois()}
    catch(e){toast(e.message)}};
  inp.click()}
async function carregarFotos(cid,boxId,atendId){const box=document.getElementById(boxId);if(!box)return;
  const c=cli(cid),base=c._p==='florenca'?'florenca':'maison';let v;
  try{v=await DB.get(base+'/fotos/'+cid)}catch(e){box.textContent='Não foi possível carregar as fotos: '+e.message;return}
  let fs=Object.entries(v||{}).map(([id,f])=>({id,...f})).sort((a,b)=>a.data.localeCompare(b.data));
  if(atendId)fs=fs.filter(f=>f.atend===atendId);
  box.innerHTML=fs.length?`<div class="fgrid">${fs.map(f=>`<figure><img src="${esc(f.img)}" data-foto="${f.id}" alt="Foto ${f.tipo==='inicial'?'inicial':'de acompanhamento'}"><figcaption class="small muted">${f.tipo==='inicial'?'Inicial':'Acompanhamento'} · ${fd(f.data)}</figcaption></figure>`).join('')}</div>`:'Nenhuma foto ainda.';
  box.querySelectorAll('[data-foto]').forEach(i=>i.onclick=()=>mostrarFoto(cid,fs.find(f=>f.id===i.dataset.foto),boxId,atendId))}
// A foto ampliada abre no próprio lugar, sem trocar a janela: o que já foi digitado no registro não se perde.
function mostrarFoto(cid,f,boxId,atendId){const c=cli(cid),base=c._p==='florenca'?'florenca':'maison',vw=document.getElementById(boxId+'-v');if(!vw)return;
  vw.innerHTML=`<div class="box" style="margin-top:10px;padding:12px"><img src="${esc(f.img)}" alt="" style="width:100%;border-radius:10px;display:block">
  <p class="small muted" style="margin:8px 0">${f.tipo==='inicial'?'Foto inicial':'Foto de acompanhamento'} · ${fd(f.data,{day:'2-digit',month:'2-digit',year:'numeric'})} · enviada por ${esc(f.por||'')}</p>
  <div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn sm" id="fv-v">Fechar foto</button><button class="btn sm" id="fv-av">Usar como foto do cadastro</button>${isAdmin()?'<button class="btn sm" id="fv-d" style="margin-left:auto;color:var(--warn);border-color:var(--warn)">Excluir foto</button>':''}</div></div>`;
  vw.scrollIntoView({block:'nearest'});
  document.getElementById('fv-v').onclick=()=>{vw.innerHTML=''};
  document.getElementById('fv-av').onclick=async()=>{try{const m=await miniatura(f.img);await grava(()=>DB.upd(base+'/clientes/'+cid,{avatar:m}),'Foto do cadastro atualizada')}catch(e){toast(e.message)}};
  const d=document.getElementById('fv-d');if(d)d.onclick=async()=>{if(!confirm('Excluir esta foto?'))return;
    if(await grava(()=>DB.del(base+'/fotos/'+cid+'/'+f.id),'Foto excluída')){vw.innerHTML='';carregarFotos(cid,boxId,atendId)}}}

function editarServico(u,id){const novo=!id,x=novo?{n:'',p:0,d:0,obs:'',ativo:true,base:false}:servicosDe(u).find(y=>y.id===id);if(!x)return;

const cursoDias=c=>c.data?[...Array(Math.max(1,c.dias||1))].map((_,i)=>iso(addD(new Date(c.data+'T12:00'),i))):[];
function cursosPorDia(ate){const hoje=iso(TODAY),m={};
  arr(C.cursos).filter(c=>c.status!=='Concluído').forEach(c=>{const ds=cursoDias(c);ds.forEach((d,i)=>{if(d>=hoje&&d<=ate)(m[d]=m[d]||[]).push({c,i:i+1,n:ds.length})})});return m}
const cursoLinha=(x,btn)=>`<div class="row"><div class="avatar">${esc(x.c.aluna[0])}</div><div class="grow"><b>${esc(x.c.aluna)}</b><div class="small muted">${esc(x.c.tecnica)} · dia ${x.i} de ${x.n}</div></div><span class="tag ${x.c.status==='Confirmado'?'':'warn'}">${esc(x.c.status)}</span>${btn?`<button class="btn sm" data-ecu="${x.c.id}">Editar</button>`:''}</div>`;
const nAlunas=n=>n===1?'1 aluna':n+' alunas';
function cursosHojeHtml(){const hoje=iso(TODAY),amanha=iso(addD(TODAY,1)),m=cursosPorDia(amanha);
  if(!m[hoje]&&!m[amanha])return '';
  const bloco=(rot,d)=>m[d]?`<h3 style="margin:10px 0 2px">${rot} · ${nAlunas(m[d].length)}</h3>${m[d].map(x=>cursoLinha(x,false)).join('')}`:'';
  return `<div class="box" style="margin-bottom:16px"><h2>Cursos</h2>${bloco('Hoje',hoje)}${bloco('Amanhã',amanha)}</div>`}
function cursosAgendaHtml(){const hoje=iso(TODAY),ate=iso(addD(TODAY,60)),m=cursosPorDia(ate),dias=Object.keys(m).sort();
  const ativos=arr(C.cursos).filter(c=>c.status!=='Concluído'),semData=ativos.filter(c=>!c.data);
  const passou=ativos.filter(c=>c.data&&cursoDias(c).every(d=>d<hoje));
  const n7=Object.entries(m).filter(([d])=>d<=iso(addD(TODAY,6))).reduce((a,[,v])=>a+v.length,0);
  const dia=d=>{const x=new Date(d+'T12:00'),r=d===hoje?'Hoje':d===iso(addD(TODAY,1))?'Amanhã':x.toLocaleDateString('pt-BR',{weekday:'long'});return r.charAt(0).toUpperCase()+r.slice(1)+' · '+fd(d)};
  return `<div class="box" style="margin-bottom:16px"><h2>Agenda dos cursos</h2>
   <div class="grid g3" style="margin-bottom:6px"><div><div class="lbl">Hoje</div><div class="stat">${(m[hoje]||[]).length}</div></div><div><div class="lbl">Próximos 7 dias</div><div class="stat">${n7}</div></div><div><div class="lbl">Sem data ainda</div><div class="stat">${semData.length}</div></div></div>
   ${passou.length?`<div class="alert" style="margin:10px 0">Já passou a data de ${passou.map(c=>esc(c.aluna)).join(', ')}. Abra o curso e marque como Concluído, ou ajuste a data.</div>`:''}
   ${dias.length?dias.map(d=>`<h3 style="margin:14px 0 2px">${esc(dia(d))} · ${nAlunas(m[d].length)}</h3>${m[d].map(x=>cursoLinha(x,true)).join('')}`).join(''):'<p class="muted" style="margin:10px 0 0">Nenhuma aula marcada para os próximos 60 dias.</p>'}
   ${semData.length?`<h3 style="margin:16px 0 2px">Aguardando data</h3>${semData.map(c=>`<div class="row"><div class="avatar">${esc(c.aluna[0])}</div><div class="grow"><b>${esc(c.aluna)}</b><div class="small muted">${esc(c.tecnica)} · ${c.dias} dia(s)</div></div><button class="btn sm" data-ecu="${c.id}">Marcar data</button></div>`).join('')}`:''}
   <p class="small muted" style="margin:12px 0 0">Os dias de cada curso contam em sequência a partir da data inicial.</p></div>`}

   refs:[['Fotos do tema',aulaBusca(a.tema)],['Estúdio e bancada','beauty studio workstation']],fotografar:['O resultado final do tema, em boa luz.','A bancada pronta antes da aula.','Um passo a passo em 3 fotos, para o material de apoio.']};
  const link=(t,q)=>`<a class="btn sm" style="color:inherit;text-decoration:none" target="_blank" rel="noopener" href="https://www.pexels.com/pt-br/procurar/${encodeURIComponent(q)}/">${esc(t)}</a>`;
  return `<div class="box" style="margin:12px 0;background:var(--berry-soft)"><h3 style="margin-top:0">Ideias para esta aula</h3><ul style="margin:0 0 12px;padding-left:18px">${d.ideias.map(i=>`<li class="small" style="margin-bottom:4px">${esc(i)}</li>`).join('')}</ul>
   <h3>O que fotografar para o seu material</h3><ul style="margin:0 0 12px;padding-left:18px">${d.fotografar.map(i=>`<li class="small" style="margin-bottom:4px">${esc(i)}</li>`).join('')}</ul>
   <h3>Fotos de referência</h3><div style="display:flex;gap:6px;flex-wrap:wrap">${d.refs.map(r=>link('Pexels: '+r[0],r[1])).join('')}${d.refs.map(r=>`<a class="btn sm" style="color:inherit;text-decoration:none" target="_blank" rel="noopener" href="https://unsplash.com/s/photos/${encodeURIComponent(r[1])}">Unsplash: ${esc(r[0])}</a>`).join('')}</div>
   <p class="small muted" style="margin:8px 0 0">São buscas em bancos de imagens gratuitos. Confira a licença de cada foto antes de usar no material. Foto de aluna ou cliente só com autorização.</p></div>`}
function verAula(id){const a=arr(C.aulas).find(x=>x.id===id);if(!a)return;
  openDlg(esc(a.tema),`<label class="f">Duração<input id="adur" value="${esc(a.dur)}" style="max-width:120px"></label>
  <label class="f">Resumo curto (aparece na lista de temas)<input id="ares" value="${esc(a.resumo)}"></label>
  <label class="f">Roteiro da aula<textarea id="acont" rows="14">${esc(a.conteudo)}</textarea></label>
  <p class="small muted">Este roteiro é uma sugestão de partida. Ajuste a ordem, os exemplos e o material de apoio do jeito que você dá a aula, e o painel guarda a sua versão.</p>

  document.getElementById('asalvar').onclick=async()=>{const novo={dur:document.getElementById('adur').value,resumo:document.getElementById('ares').value,conteudo:document.getElementById('acont').value,editado:true,original:a.original||a.conteudo};

  document.getElementById('aexcluir').onclick=async()=>{if(!confirm('Excluir este tema de aula?'))return;if(await grava(()=>DB.del('admin/aulas/'+id),'Tema excluído'))closeDlg()};

   <div class="box"><div class="lbl">Pendentes ou vencidas</div><div class="stat" style="color:var(--warn)">${pend.length}</div></div>
   <div class="box"><div class="lbl">Em dia</div><div class="stat" style="color:var(--ok)">${ok.length}</div></div>
   <div class="box"><div class="lbl">Com alerta de saúde</div><div class="stat">${em.length}</div></div>

  <input class="search" id="q" placeholder="Buscar cliente pelo nome" value="${esc(S.q)}">
  <div class="box">
   ${pend.length?`<h3>Pendentes ou vencidas</h3>${pend.map(rowAnam).join('')}`:''}

}
function rowAnam(c){const an=anamDe(c.id);
  return `<div class="row">${avatarHtml(c)}<div class="grow"><b>${esc(c.n)}</b><div class="small muted">${an?'Assinada em '+fd(an.data,{day:'2-digit',month:'2-digit',year:'numeric'}):'Nunca preenchida'}${an&&an.flags&&an.flags.length?' · '+esc(an.flags.join(', ')):''}</div></div>

}

// Um tema por dia da semana: ela abre e vê só "o que posto hoje". ★ = o mínimo, se a semana apertar.
const IG_SEMANA={1:{t:'dica',e:1,r:'Dica'},2:{t:'bast',r:'Bastidores'},3:{t:'conv',e:1,r:'Conversa'},4:{t:'cuid',r:'Cuidados'},5:{t:'auto',e:1,r:'Autocuidado'},6:{t:'conv',r:'Horários e conversa',s:1},0:{t:'auto',r:'Descanso (opcional)',s:1}};
const DIAS_PT=['Domingo','Segunda','Terça','Quarta','Quinta','Sexta','Sábado'];
const igSemanaDe=off=>{const h=new Date(iso(TODAY)+'T12:00');h.setDate(h.getDate()-((h.getDay()+6)%7)+7*(off||0));return [...Array(7)].map((_,i)=>{const x=new Date(h);x.setDate(h.getDate()+i);return iso(x)})};
// Ideia sugerida para uma data: gira dentro do tema do dia, sem repetir na semana seguinte; a troca dela fica guardada.
function igIdeiaDe(data){const pl=(C.instagram||{}).plano||{};const ja=IG_IDEIAS.find(x=>x.id===pl[data]);if(ja)return ja;
  const dow=new Date(data+'T12:00').getDay(),cfg=IG_SEMANA[dow],pool=IG_IDEIAS.filter(x=>x.t===cfg.t),n=pool.length;
  const w=Math.floor(new Date(data+'T12:00').getTime()/6048e5),slot=cfg.s?1:0;return pool[(w+slot*Math.floor(n/2))%n]}

function vInstagram(){

  const sel=dias.includes(S.igDia)?S.igDia:(dias.includes(hoje)?hoje:dias[0]);

    return `<button class="row" data-igdia="${d}" style="width:100%;text-align:left;cursor:pointer;background:transparent;border:0;border-bottom:1px solid var(--line);padding:10px 4px">
     <div style="min-width:78px"><b>${DIAS_PT[dow].slice(0,3)}</b> ${esc(fd(d))}${d===hoje?' <span class="tag">hoje</span>':''}</div>
     <div class="grow"><b>${esc(x.n)}</b><div class="small muted">${esc(cfg.r)} · ${esc(x.f)}${cfg.e?' · ★ essencial':cfg.s?' · se der tempo':''}</div></div>
     ${feito?'<span class="tag ok">Postado</span>':''}</button>`}).join('');
  const t=S.igTema||'todos',lista=IG_IDEIAS.filter(x=>t==='todos'||x.t===t);
  return `<div class="top"><div><h1>Instagram</h1><div class="sub">Toque em um dia para abrir a sugestão. Você copia, ajusta e posta; nada é publicado daqui.</div></div></div>
  <div class="note" style="margin-bottom:14px">Sem tempo? Faça só os dias com <b>★</b> (segunda, quarta e sexta). Foto de cliente só com autorização específica de divulgação: a ficha de anamnese <b>não</b> dá essa autorização.</div>
  <div style="display:flex;gap:8px;align-items:center;margin-bottom:8px;flex-wrap:wrap"><button class="btn sm" data-igsem="${off-1}">‹ Semana anterior</button><b>${esc(fd(dias[0]))} a ${esc(fd(dias[6]))}</b><button class="btn sm" data-igsem="${off+1}">Semana seguinte ›</button>${off?`<button class="btn sm" data-igsem="0">Esta semana</button>`:''}</div>
  <div class="box" style="margin-bottom:14px;padding:6px 12px">${lin}</div>
  <details style="margin-top:6px"><summary style="cursor:pointer;font-weight:600;margin-bottom:10px">Ver todas as ideias (${IG_IDEIAS.length})</summary>
   <div style="display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px"><button class="btn sm ${t==='todos'?'p':''}" data-igtema="todos">Todas</button>${Object.entries(IG_TEMAS).map(([k,v])=>`<button class="btn sm ${t===k?'p':''}" data-igtema="${k}">${v}</button>`).join('')}</div>
   ${lista.map(x=>igCard(x,false)).join('')}</details>`}
// Pop-up do dia: a sugestão aparece por cima da tela, com ‹ › para passar pelas ideias do mesmo tema. A escolha fica guardada para aquele dia.
function igAbrir(date,idx){
  const dow=new Date(date+'T12:00').getDay(),cfg=IG_SEMANA[dow],pool=IG_IDEIAS.filter(x=>x.t===cfg.t);
  if(idx==null)idx=Math.max(0,pool.findIndex(x=>x.id===igIdeiaDe(date).id));
  idx=((idx%pool.length)+pool.length)%pool.length;const x=pool[idx];
  openDlg(esc(DIAS_PT[dow]+', '+fd(date)+' · '+cfg.r),`<div style="display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:10px"><button class="btn sm" id="igp">‹ Anterior</button><span class="small muted">Sugestão ${idx+1} de ${pool.length}</span><button class="btn sm" id="ign">Próxima ›</button></div>${igCard(x,false)}`);
  const ir=async passo=>{const ta=dlg.querySelector('textarea'),r=(C.instagram||{})[x.id]||{},atual=r.legenda!=null?r.legenda:x.l;
    if(ta&&ta.value!==atual&&!confirm('Você mudou a legenda e não guardou. Trocar de sugestão perde essa mudança. Continuar?'))return;
    const novoIdx=((idx+passo)%pool.length+pool.length)%pool.length;
    await grava(()=>DB.upd('admin/instagram/plano',{[date]:pool[novoIdx].id}));igAbrir(date,novoIdx)};
  document.getElementById('igp').onclick=()=>ir(-1);document.getElementById('ign').onclick=()=>ir(1);
  dlg.querySelectorAll('[data-igcopy]').forEach(b=>b.onclick=()=>igCopiar(b.dataset.igcopy,b));
  dlg.querySelectorAll('[data-igsave]').forEach(b=>b.onclick=async()=>{await igSalvar(b.dataset.igsave,b)});
  dlg.querySelectorAll('[data-igpost]').forEach(b=>b.onclick=async()=>{await igPostado(b.dataset.igpost);setTimeout(()=>igAbrir(date,idx),200)})}
async function igCopiar(id,b){const x=IG_IDEIAS.find(y=>y.id===id),ta=b?b.closest('.box').querySelector('textarea'):document.getElementById('igl-'+id);
  const txt=ta.value.trim()+'\n\n'+x.h+' '+IG_BASE;
  try{await navigator.clipboard.writeText(txt);toast('Copiado. É só colar no Instagram.')}
  catch(e){ta.focus();ta.select();toast('Selecione o texto e copie (Ctrl+C).')}}
async function igSalvar(id,b){const ta=b?b.closest('.box').querySelector('textarea'):document.getElementById('igl-'+id);await grava(()=>DB.upd('admin/instagram/'+id,{legenda:ta.value}),'Sua versão foi guardada')}
async function igPostado(id){const r=(C.instagram||{})[id]||{};
  await grava(()=>DB.upd('admin/instagram/'+id,{postadoEm:r.postadoEm?null:iso(TODAY)}),r.postadoEm?'Desmarcado':'Marcado como postado')}

function render(){
  if(!S.user)return;
  renderChrome();
  const V={hoje:vHoje,agenda:vAgenda,clientes:vClientes,anamnese:vAnamnese,financeiro:vFinanceiro,comissoes:vComissoes,servicos:vServicos,fornecedores:vFornecedores,cursos:vCursos,aulas:vAulas,instagram:vInstagram};
  const main=document.getElementById('main');
  const erros=Object.entries(S.erros);
  const aviso=erros.length?`<div class="note err"><span>Não foi possível ler parte dos dados (${erros.map(([p,m])=>esc(p+': '+m)).join('; ')}). A tela pode estar incompleta.</span><button class="btn sm" id="retry">Tentar de novo</button></div>`:'';
  main.innerHTML=aviso+(DEMO?'<div class="note">Demonstração: os dados ficam só na memória deste navegador e somem ao recarregar.</div>':'')+V[S.tab]();
  bindSeg();
  const rt=document.getElementById('retry');if(rt)rt.onclick=()=>{S.erros={};comecarLeituras()};
  main.querySelectorAll('[data-agdia]').forEach(b=>b.onclick=()=>{S.agData=b.dataset.agdia;S.agMes=b.dataset.agdia.slice(0,7);render()});
  main.querySelectorAll('[data-agmes]').forEach(b=>b.onclick=()=>{const n=+b.dataset.agmes;
    if(n===0){S.agData=iso(TODAY);S.agMes=null}
    else{const [y,m]=(S.agMes||(S.agData||iso(TODAY)).slice(0,7)).split('-').map(Number),x=new Date(y,m-1+n,1,12);S.agMes=iso(x).slice(0,7)}
    render()});
  main.querySelectorAll('[data-done]').forEach(b=>b.onclick=()=>concluir(b.dataset.done,b.dataset.p));
  main.querySelectorAll('[data-lkok]').forEach(b=>b.onclick=()=>lkVisto(b.dataset.lkok,b.dataset.pp));
  main.querySelectorAll('[data-lkrem]').forEach(b=>b.onclick=()=>{lkVisto(b.dataset.lkrem,b.dataset.pp);remarcarAg(b.dataset.lkrem,b.dataset.pp)});
  main.querySelectorAll('[data-lkrec]').forEach(b=>b.onclick=()=>lkRecusar(b.dataset.lkrec,b.dataset.pp));
  main.querySelectorAll('[data-lkfi]').forEach(b=>b.onclick=()=>enviarLinkAnamnese(b.dataset.lkfi));
  const agc=document.getElementById('ag-copy');if(agc)agc.onclick=async()=>{try{await navigator.clipboard.writeText(origemPublica()+'/p');toast('Link copiado')}catch(e){toast('Não foi possível copiar')}};
  const ags=document.getElementById('ag-save');if(ags)ags.onclick=async()=>{ags.disabled=true;let ok=true;
    for(const u of ['mai','flo']){const g=id=>document.getElementById('ag-'+u+'-'+id),ini=g('i').value,fim=g('f').value,par=Math.max(1,Math.min(6,parseInt(g('p').value)||1));
      if(!ini||!fim||minDe(fim)<=minDe(ini)){toast(`${U[u].n}: confira o horário de abrir e fechar`);ags.disabled=false;return}
      const fech=g('x').value.split(/[,;\s]+/).filter(Boolean);if(fech.some(d=>!/^\d{4}-\d{2}-\d{2}$/.test(d))){toast(`${U[u].n}: as datas sem atendimento precisam estar como AAAA-MM-DD`);ags.disabled=false;return}
      const cfg={ativo:g('on').checked,ini,fim,paralelo:par,passo:30,dias:21,antecH:3};if(fech.length)cfg.fechados=fech;
      ok=await grava(()=>DB.set('publico/agenda/'+u+'/cfg',cfg))&&ok}
    if(ok)toast('Agenda online salva');ags.disabled=false};
  main.querySelectorAll('[data-nvok]').forEach(b=>b.onclick=()=>grava(()=>DB.upd(b.dataset.nvp+'/clientes/'+b.dataset.nvok,{niverFeito:TODAY.getFullYear()}),'Aniversário dispensado da lista'));
  main.querySelectorAll('[data-lib]').forEach(b=>b.onclick=async()=>{b.disabled=true;await liberarBrinde(b.dataset.lib);b.disabled=false});
  main.querySelectorAll('[data-dper]').forEach(b=>b.onclick=()=>{S.descPer=b.dataset.dper;render()});
  main.querySelectorAll('[data-msg]').forEach(b=>b.onclick=()=>msgDlg(b.dataset.msg,b.dataset.c));
  main.querySelectorAll('[data-cli]').forEach(b=>b.onclick=()=>ficha(b.dataset.cli));
  main.querySelectorAll('[data-pay]').forEach(b=>b.onclick=()=>grava(()=>DB.set('admin/pagamentos/'+qzChave(b.dataset.pay),true),'Comissão marcada como paga'));
  main.querySelectorAll('[data-payrent]').forEach(b=>b.onclick=()=>grava(()=>DB.set('admin/pagamentos/'+qzChave('lais_aluguel'),true),'Aluguel marcado como pago'));
  main.querySelectorAll('[data-det]').forEach(b=>b.onclick=()=>detCom(b.dataset.det));
  main.querySelectorAll('[data-pc]').forEach(b=>b.onclick=()=>grava(()=>DB.set('admin/contas/'+b.dataset.pc+'/pago',true),'Conta marcada como paga'));
  main.querySelectorAll('[data-regat]').forEach(b=>b.onclick=()=>abrirRegistro(b.dataset.regat,b.dataset.p,null));
  main.querySelectorAll('[data-remarcar]').forEach(b=>b.onclick=()=>remarcarAg(b.dataset.remarcar,b.dataset.p));
  main.querySelectorAll('[data-confirma]').forEach(b=>b.onclick=()=>{const a=agenda().find(x=>x.id===b.dataset.confirma&&x._p===b.dataset.p);if(a)confirmarAg(a,false)});
  main.querySelectorAll('[data-reconvite]').forEach(b=>b.onclick=async()=>{const a=agenda().find(x=>x.id===b.dataset.reconvite&&x._p===b.dataset.p);if(!a)return;b.disabled=true;
    const sent=await convidar(a.id,a._p,a);toast(sent?'Convite enviado':'Ainda não consegui enviar. Tente de novo em instantes.')});
  const rb=document.getElementById('resp');if(rb)rb.onclick=()=>respostasAgenda(true);
  if(S.tab==='agenda'&&AGENDA_URL&&(!S.respEm||Date.now()-S.respEm>300000)){S.respEm=Date.now();setTimeout(()=>respostasAgenda(false),0)}
  main.querySelectorAll('[data-cancelag]').forEach(b=>b.onclick=()=>cancelarAg(b.dataset.cancelag,b.dataset.p));
  main.querySelectorAll('[data-ec]').forEach(b=>b.onclick=()=>editarConta(b.dataset.ec));
  main.querySelectorAll('[data-ef]').forEach(b=>b.onclick=()=>editarFornecedor(b.dataset.ef));
  main.querySelectorAll('[data-ecu]').forEach(b=>b.onclick=()=>editarCurso(b.dataset.ecu));
  const bs=document.getElementById('brindesalvar');if(bs)bs.onclick=async()=>{const v=document.getElementById('brinde').value.trim();bs.disabled=true;
    await grava(()=>DB.set('maison/config/brinde',v||null),v?'Brinde guardado':'Brinde voltou ao texto padrão');bs.disabled=false};
  const rs=document.getElementById('regrasalvar');if(rs){
    const clamp=(v,d)=>{v=parseFloat(v);return isNaN(v)?d:Math.max(0,Math.min(100,v))};
    const lerRegra=()=>({v:2,pct:clamp(document.getElementById('bp').value,10),limite:Math.max(0,+document.getElementById('bl').value||0),pctAte:clamp(document.getElementById('bpa').value,5),dias:Math.max(0,Math.min(365,parseInt(document.getElementById('bd').value)||0))});
    const prev=()=>{const r=lerRegra(),ord=servicosDe('mai').filter(x=>x.ativo!==false&&x.p>0).sort((a,b)=>a.p-b.p);
      document.getElementById('bprev').innerHTML=(ord.length>4?[...ord.slice(0,2),...ord.slice(-2)]:ord).map(x=>{const k=calcBrinde(x.p,r);return `<div>${esc(x.n)}: ${brl(x.p)} → <b>${String(k.pct).replace('.',',')}%</b> → <b>${brl(k.final)}</b></div>`}).join('')||'Cadastre serviços para ver o exemplo.'};
    ['bp','bl','bpa','bd'].forEach(i=>document.getElementById(i).oninput=prev);prev();
    rs.onclick=async()=>{rs.disabled=true;await grava(()=>DB.set('maison/config/brindeRegra',lerRegra()),'Regra do brinde salva. Vale na hora para os códigos ainda não usados.');rs.disabled=false}}
  main.querySelectorAll('[data-es]').forEach(b=>{const [u,i]=b.dataset.es.split('|');b.onclick=()=>editarServico(u,i)});
  main.querySelectorAll('[data-ns]').forEach(b=>b.onclick=()=>editarServico(b.dataset.ns,null));
  main.querySelectorAll('[data-igdia]').forEach(b=>b.onclick=()=>igAbrir(b.dataset.igdia));
  main.querySelectorAll('[data-igsem]').forEach(b=>b.onclick=()=>{S.igSem=+b.dataset.igsem;S.igDia=null;render()});
  main.querySelectorAll('[data-igtema]').forEach(b=>b.onclick=()=>{S.igTema=b.dataset.igtema;render()});
  main.querySelectorAll('[data-igcopy]').forEach(b=>b.onclick=()=>igCopiar(b.dataset.igcopy,b));
  main.querySelectorAll('[data-igsave]').forEach(b=>b.onclick=()=>igSalvar(b.dataset.igsave,b));
  main.querySelectorAll('[data-igpost]').forEach(b=>b.onclick=()=>igPostado(b.dataset.igpost));
  main.querySelectorAll('[data-pend]').forEach(b=>b.onclick=()=>revisarPendente(b.dataset.pend,b.dataset.pb));
  const nv=document.getElementById('novo');if(nv)nv.onclick=novoAg;
  const q=document.getElementById('q');if(q){q.oninput=e=>{S.q=e.target.value;const pos=e.target.selectionStart;render();const n=document.getElementById('q');n.focus();n.setSelectionRange(pos,pos)}}
  const rp=document.getElementById('rep');if(rp)rp.onchange=e=>grava(()=>DB.set('admin/config/repasse',Math.min(100,Math.max(0,+e.target.value||0))));
  const ex=document.getElementById('extr');if(ex)ex.onclick=extrato;
  main.querySelectorAll('[data-aula]').forEach(b=>b.onclick=()=>verAula(b.dataset.aula));
  const nt=document.getElementById('novatema');if(nt)nt.onclick=novoTema;
  main.querySelectorAll('[data-anamform]').forEach(b=>b.onclick=()=>anamnese(b.dataset.anamform));
  const ncb=document.getElementById('novacli');if(ncb)ncb.onclick=novoCliente;
  const nfb=document.getElementById('novofor');if(nfb)nfb.onclick=novoFornecedor;
  const nqb=document.getElementById('novaconta');if(nqb)nqb.onclick=novaConta;
  const nkb=document.getElementById('novocurso');if(nkb)nkb.onclick=novoCurso;
}
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
