<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Painel Maison Beauty</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
:root{
  --bg:#FAF7F1; --panel:#FFFFFF; --ink:#262220; --muted:#8A7D6E; --line:#E9E1D2;
  --berry:#9C7A2E; --berry-soft:#F1E9D4; --flo:#6B5B45; --flo-soft:#EFE7D9; --mai:#9C7A2E; --mai-soft:#F1E9D4;
  --warn:#A8551C; --warn-soft:#FBEBDD; --ok:#3F7A57; --ok-soft:#E2F1E7;
  --serif:"Cormorant",Georgia,"Times New Roman",serif; --sans:"Figtree",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#1C1A16; --panel:#262320; --ink:#F3EFE6; --muted:#B5A98F; --line:#3B362C;
  --berry:#D4B45E; --berry-soft:#3A331F; --flo:#C9BB9C; --flo-soft:#2E2A20; --mai:#D4B45E; --mai-soft:#3A331F;
  --warn:#EDA46E; --warn-soft:#3A2618; --ok:#8CCBA4; --ok-soft:#1D3024;}}
:root[data-theme="dark"]{
  --bg:#1C1A16; --panel:#262320; --ink:#F3EFE6; --muted:#B5A98F; --line:#3B362C;
  --berry:#D4B45E; --berry-soft:#3A331F; --flo:#C9BB9C; --flo-soft:#2E2A20; --mai:#D4B45E; --mai-soft:#3A331F;
  --warn:#EDA46E; --warn-soft:#3A2618; --ok:#8CCBA4; --ok-soft:#1D3024;}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 var(--sans);min-height:100%}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
button:disabled{opacity:.45;cursor:not-allowed}
:focus-visible{outline:2px solid var(--berry);outline-offset:2px}
[hidden]{display:none!important}
.app{display:grid;grid-template-columns:230px 1fr;min-height:100vh}
aside{border-right:1px solid var(--line);padding:24px 16px;position:sticky;top:env(safe-area-inset-top,0px);height:100vh;display:flex;flex-direction:column;gap:20px}
.brandwrap{display:flex;align-items:center;gap:12px}
.logo{width:46px;height:46px;border-radius:10px;object-fit:cover;flex:none}
.logo.sm{width:34px;height:34px;border-radius:8px}
.brand{font-family:var(--serif);font-size:24px;line-height:1.05;font-weight:600;letter-spacing:.2px}
.brand small{display:block;font-family:var(--sans);font-size:11px;color:var(--muted);font-weight:500;margin-top:4px;letter-spacing:0}
nav{display:flex;flex-direction:column;gap:2px}
nav button{all:unset;cursor:pointer;padding:9px 12px;border-radius:8px;color:var(--muted);font-weight:500;display:flex;align-items:center;gap:10px}
nav button.on{background:var(--berry-soft);color:var(--berry)}
nav button .lock{margin-left:auto;font-size:11px;opacity:.7}
.who{margin-top:auto;font-size:13px;color:var(--muted)}
.who b{color:var(--ink)}
main{padding:28px clamp(16px,4vw,44px) 90px;max-width:1100px;width:100%}
.top{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:14px;margin-bottom:22px}
h1{font-family:var(--serif);font-weight:500;font-size:clamp(34px,5vw,48px);line-height:1;margin:0}
h2{font-family:var(--serif);font-weight:600;font-size:24px;margin:0 0 12px}
h3{font-size:15px;margin:0 0 8px;font-weight:600}
.sub{color:var(--muted);margin-top:8px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:999px;padding:3px;background:var(--panel)}
.seg button{border:0;background:none;padding:6px 14px;border-radius:999px;color:var(--muted);font-weight:500;font-size:14px}
.seg button.on{background:var(--ink);color:var(--bg)}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(auto-fit,minmax(300px,1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}
.box{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:18px}
.stat{font-family:var(--serif);font-size:32px;font-weight:600;line-height:1.1}
.lbl{color:var(--muted);font-size:13px}
.row{display:flex;align-items:center;gap:12px;padding:11px 0;border-top:1px solid var(--line)}
.row:first-of-type{border-top:0}
.row .grow{flex:1;min-width:0}
.row .t{font-weight:600;font-variant-numeric:tabular-nums;width:48px;flex:none}
.muted{color:var(--muted)}
.small{font-size:13px}
.tag{display:inline-block;font-size:12px;padding:2px 9px;border-radius:999px;font-weight:500;white-space:nowrap}
.tag.flo{background:var(--flo-soft);color:var(--flo)}
.tag.mai{background:var(--mai-soft);color:var(--mai)}
.tag.warn{background:var(--warn-soft);color:var(--warn)}
.tag.ok{background:var(--ok-soft);color:var(--ok)}
.btn{border:1px solid var(--line);background:var(--panel);padding:7px 14px;border-radius:999px;font-weight:500;font-size:14px}
.btn.p{background:var(--berry);border-color:var(--berry);color:#fff}
:root[data-theme="dark"] .btn.p{color:#1C1318}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .btn.p{color:#1C1318}}
.btn.sm{padding:4px 11px;font-size:13px}
.note{background:var(--warn-soft);color:var(--warn);padding:10px 14px;border-radius:10px;font-size:13px;margin-bottom:18px}
.note.err{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.days{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;margin-bottom:16px}
.days button{flex:none;border:1px solid var(--line);background:var(--panel);border-radius:12px;padding:8px 12px;text-align:center;min-width:64px}
.days button b{display:block;font-family:var(--serif);font-size:22px;line-height:1}
.days button.on{border-color:var(--berry);background:var(--berry-soft);color:var(--berry)}
.days button i{display:block;width:6px;height:6px;border-radius:50%;margin:5px auto 0}
.cols{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(230px,1fr))}
.appt{border-left:3px solid var(--berry);padding:8px 10px;margin-top:8px;background:var(--bg);border-radius:0 8px 8px 0}
.appt.done{opacity:.55}
.search{width:100%;padding:10px 14px;border:1px solid var(--line);border-radius:10px;background:var(--panel);margin-bottom:14px}
.avatar{width:38px;height:38px;border-radius:50%;background:var(--berry-soft);color:var(--berry);display:grid;place-items:center;font-family:var(--serif);font-weight:600;font-size:17px;flex:none}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{text-align:left;padding:9px 8px;border-top:1px solid var(--line);white-space:nowrap}
th{color:var(--muted);font-weight:500;border-top:0}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums}
.scroll{overflow-x:auto}
dialog{border:0;border-radius:18px;padding:0;background:var(--panel);color:var(--ink);width:min(640px,94vw);max-height:90vh}
dialog::backdrop{background:rgba(30,15,22,.45)}
.dh{display:flex;justify-content:space-between;align-items:center;padding:18px 22px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--panel);z-index:1}
.db{padding:18px 22px}
.x{border:0;background:none;font-size:22px;line-height:1;color:var(--muted)}
label.f{display:block;margin-bottom:12px;font-size:13px;color:var(--muted)}
label.f input,label.f select,label.f textarea{display:block;width:100%;margin-top:4px;padding:9px 11px;border:1px solid var(--line);border-radius:9px;background:var(--bg);color:var(--ink);font-size:15px}
.ck{display:flex;gap:10px;align-items:flex-start;padding:8px 0;border-top:1px solid var(--line);font-size:14px}
.ck input{margin-top:3px;accent-color:var(--berry)}
.alert{background:var(--warn-soft);color:var(--warn);border-radius:10px;padding:10px 12px;font-size:14px;margin:10px 0}
.photos{display:flex;gap:10px}
.ph{flex:1;aspect-ratio:4/3;border-radius:10px;background:linear-gradient(135deg,var(--berry-soft),var(--mai-soft));display:grid;place-items:center;color:var(--muted);font-size:13px;text-align:center;padding:6px}
canvas.sig{width:100%;height:130px;border:1px dashed var(--muted);border-radius:10px;background:var(--bg);touch-action:none}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:999px;font-size:14px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:50;max-width:90vw;text-align:center}
.toast.show{opacity:1}
.logo-wide{display:block;width:100%;max-width:190px;height:auto;background:#fff;border-radius:12px;padding:4px 8px}
.logo-wide.sm{width:auto;height:42px;max-width:none;padding:2px 8px;border-radius:8px}
.sub-brand{font-size:11px;color:var(--muted);margin-top:8px;line-height:1.35}
.sec{background:var(--berry-soft);color:var(--ink);padding:8px 12px;border-radius:8px;font-weight:600;margin:18px 0 10px}
.q{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:9px 0;border-top:1px solid var(--line);font-size:14px}
.q .sn{display:flex;gap:16px;flex:none}
.q .sn label,.svgrid label{display:inline-flex;gap:6px;align-items:center;cursor:pointer}
.q input[type=radio],.svgrid input,.fotor input{accent-color:var(--berry);width:18px;height:18px}
.svgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:8px 14px;font-size:14px;margin-bottom:10px}
.fotor{display:flex;gap:18px;flex-wrap:wrap;font-size:14px;margin:6px 0}
.fotor label{display:inline-flex;gap:6px;align-items:center;cursor:pointer}
.fgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:8px}
.fgrid figure{margin:0}
.fgrid img{width:100%;aspect-ratio:1/1;object-fit:cover;border-radius:10px;border:1px solid var(--line);cursor:pointer;display:block}
.fgrid figcaption{margin-top:3px}
.hero-unit{display:inline-flex;align-items:center;gap:8px;margin-top:10px;font-size:14px}
.hero-unit i{width:9px;height:9px;border-radius:50%}
.mob{display:none}
.entrar{min-height:100vh;display:grid;place-items:center;padding:20px}
.entrar .box{width:min(420px,100%)}
@media (max-width:820px){
  .app{grid-template-columns:1fr}
  aside{display:none}
  .mob{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:14px 16px 0}
  .mob .brand{font-size:22px}
  .bnav{position:fixed;left:0;right:0;bottom:0;background:var(--panel);border-top:1px solid var(--line);display:flex;overflow-x:auto;padding-bottom:env(safe-area-inset-bottom,0px);z-index:5}
  .bnav button{flex:1 0 auto;border:0;background:none;padding:12px 14px;font-size:13px;color:var(--muted);font-weight:500}
  .bnav button.on{color:var(--berry)}
  main{padding-top:14px}
}
@media (min-width:821px){.bnav{display:none}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<body>
<div id="entrada"></div>
<div class="app" id="app" hidden>
  <aside>
    <div><img class="logo-wide" src="logo.png" alt="Maison Beauty"><div class="sub-brand">Tháriga Brito · Florença &amp; Maison Beauty · @mais.on.beauty</div></div>

  <div>

    <main id="main"></main>
  </div>
</div>
<div class="bnav" id="bnav" hidden></div>
<dialog id="dlg"></dialog>
<div class="toast" id="toast"></div>

<script type="module">
import { initializeApp } from 'https://www.gstatic.com/firebasejs/12.14.0/firebase-app.js';
import { getDatabase, ref, onValue, get, set, push, update, remove } from 'https://www.gstatic.com/firebasejs/12.14.0/firebase-database.js';
import { getAuth, signInWithEmailAndPassword, sendPasswordResetEmail, onAuthStateChanged, signOut } from 'https://www.gstatic.com/firebasejs/12.14.0/firebase-auth.js';

// ── O projeto Firebase do Maison Beauty (separado do cartório) ──
// Preencher com os dados do projeto novo (Configurações do projeto → Seus apps).
// Enquanto estiver em branco o painel abre em DEMONSTRAÇÃO: dados só na memória
// do navegador, nada é gravado. Passo a passo no FIREBASE.md.
const firebaseConfig = {
  apiKey: "AIzaSyD0p5Y0HDL2rcDLE6qFNSb4nyPe3yFjXos",
  authDomain: "maison-beauty-2e7da.firebaseapp.com",
  databaseURL: "https://maison-beauty-2e7da-default-rtdb.firebaseio.com",
  projectId: "maison-beauty-2e7da",
  storageBucket: "maison-beauty-2e7da.firebasestorage.app",
  messagingSenderId: "30042816821",
  appId: "1:30042816821:web:e0e5cbcfe596d3a1a40c7c"
};
const DEMO = !firebaseConfig.apiKey;
// Suporte: endereço do Apps Script que manda o e-mail (ver apps-script/suporte.js e FIREBASE.md). Em branco = só grava no banco.
const SUPORTE_URL='https://script.google.com/macros/s/AKfycbwoAlGyx8BElcl4Xf2rVknbdbAPvFuilPTDadFsZc-NnufV6g8bhYCp95O758FAOQNeMg/exec';
const SUPORTE_CHAVE='YeW0wL5MBpOcA1bkiv3KCz9xhpb_iSEV';
const AGENDA_URL='';
const AGENDA_CHAVE='EXiC2WouRkPbh2W8AjhCWhpx4lUZJxRB';

// ═══ Camada de dados ═══════════════════════════════════════════════════
// Duas portas com a mesma cara: o banco de verdade e a memória (demonstração).
// Toda gravação é esperada (await) e, se o banco disser não, a tela diz.
// Toda leitura que falha mostra o motivo, com "Tentar de novo" — o Firebase
// não tenta sozinho depois de um permission denied.
let fb=null,auth=null;
const mem={tree:{},subs:[]};
const memGet=p=>p.split('/').reduce((o,k)=>o==null?null:o[k],mem.tree)??null;
function memSet(p,v){const ks=p.split('/');let o=mem.tree;ks.slice(0,-1).forEach(k=>{o[k]=o[k]||{};o=o[k]});
  if(v==null)delete o[ks.at(-1)];else o[ks.at(-1)]=JSON.parse(JSON.stringify(v));
  mem.subs.forEach(s=>s.cb(memGet(s.p)))}
const DB={
  sub(p,cb,onErr){
    if(DEMO){const s={p,cb};mem.subs.push(s);setTimeout(()=>cb(memGet(p)),0);return()=>{mem.subs=mem.subs.filter(x=>x!==s)}}
    return onValue(ref(fb,p),sn=>cb(sn.val()),e=>onErr&&onErr(p,e))},
  async set(p,v){if(DEMO)return memSet(p,v);await set(ref(fb,p),v)},
  async push(p,v){if(DEMO){const id='d'+Date.now().toString(36)+Math.random().toString(36).slice(2,5);memSet(p+'/'+id,v);return id}
    const r=push(ref(fb,p));await set(r,v);return r.key},
  async upd(p,v){if(DEMO){Object.entries(v).forEach(([k,x])=>memSet(p+'/'+k,x));return}await update(ref(fb,p),v)},
  async del(p){if(DEMO)return memSet(p,null);await remove(ref(fb,p))},
  async get(p){if(DEMO)return memGet(p);return (await get(ref(fb,p))).val()}
};
// Data em milissegundos (meia-noite UTC): as regras do banco usam para conferir o dia da semana da Laís.
const tsDe=d=>{const [y,m,x]=d.split('-').map(Number);return Date.UTC(y,m-1,x)};
// ── Convites pela Google Agenda (Apps Script rodando na conta da Tháriga) ──
const emailOk=e=>/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(e||'');
async function agendaChama(corpo){
  if(!AGENDA_URL)return {ok:false,erro:'sem-url'};
  try{const r=await fetch(AGENDA_URL,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({chave:AGENDA_CHAVE,...corpo})});return await r.json()}
  catch(e){guardaErro(e.message);return {ok:false,erro:e.message}}}
// O evento leva só serviço, unidade e horário: nada de ficha, anamnese ou valor.
function eventoDe(a){const s=sv(a.serv,a.unit),c=cli(a.cli);
  return {data:a.date,hora:a.hora,minutos:s.d||60,email:c.email,titulo:s.n+' · '+U[a.unit].n,local:U[a.unit].n,
    descricao:'Horário reservado com a equipe da Tháriga Brito. Para remarcar ou tirar dúvidas, responda por WhatsApp.'}}
// Convida (ou, se já existe evento, só atualiza o horário). Nunca deixa o agendamento sem dizer o que houve.
async function convidar(id,p,a){
  const ev=eventoDe(a);
  const r=a.evento?await agendaChama({acao:'atualizar',id:a.evento,data:ev.data,hora:ev.hora,minutos:ev.minutos}):await agendaChama({acao:'criar',...ev});
  if(r.ok){await grava(()=>DB.upd(p+'/agenda/'+id,{evento:a.evento||r.id,convite:'enviado',rsvp:'sem-resposta'}));return true}
  await grava(()=>DB.upd(p+'/agenda/'+id,{convite:a.evento?'desatualizado':'erro'}));return false}
async function respostasAgenda(avisar){
  const lista=agendaAtiva().filter(a=>a.evento&&a.st!=='Atendido'&&a.date>=iso(addD(TODAY,-1))&&emailOk(cli(a.cli).email));
  if(!lista.length){if(avisar)toast('Nenhum convite para conferir.');return}
  const r=await agendaChama({acao:'status',ids:lista.map(a=>({id:a.evento,email:cli(a.cli).email}))});
  if(!r.ok){if(avisar)toast('Não consegui consultar a Google Agenda agora.');return}
  let mudou=0;
  for(const a of lista){const novo=r.status[a.evento];if(novo&&novo!=='erro'&&novo!==a.rsvp){mudou++;await grava(()=>DB.upd(a._p+'/agenda/'+a.id,{rsvp:novo}))}}
  if(avisar)toast(mudou?'Respostas atualizadas':'Sem novidades')}
const respTag=a=>{if(!a.evento&&!a.convite)return '';
  if(a.convite==='erro'||a.convite==='desatualizado')return '<span class="tag warn">Convite não enviado</span><button class="btn sm" data-reconvite="'+a.id+'" data-p="'+a._p+'">Reenviar convite</button>';
  const m={aceitou:['ok','Aceitou o convite'],recusou:['warn','Recusou o convite'],talvez:['','Talvez'],'sem-resposta':['','Convite enviado · sem resposta']}[a.rsvp||'sem-resposta']||['','Convite enviado'];
  return '<span class="tag '+m[0]+'">'+m[1]+'</span>'};
// Grava e avisa: devolve true/false; nunca diz "salvo" sem ter salvo.
const ERROS_RECENTES=[];
const guardaErro=m=>{ERROS_RECENTES.push(new Date().toISOString().slice(11,19)+' '+String(m).slice(0,300));if(ERROS_RECENTES.length>5)ERROS_RECENTES.shift()};
window.addEventListener('error',e=>guardaErro(e.message));
window.addEventListener('unhandledrejection',e=>guardaErro(e.reason&&e.reason.message||e.reason));
async function grava(fn,ok){try{await fn();if(ok)toast(ok);return true}catch(e){console.error(e);guardaErro(e.message);
  toast('Não foi possível salvar: '+(/permission/i.test(e.message)?'o banco recusou (permissão)':e.message));return false}}

if(DEMO)setTimeout(()=>{window.__DB=DB},0);
// ═══ Dados do negócio ══════════════════════════════════════════════════
const U={
 flo:{n:'Estúdio Florença',s:'Itaim Bibi',dias:'Quinta, sexta e sábado',hora:'09:00–19:00'},
 mai:{n:'Maison Beauty',s:'Itaquera',dias:'Domingo, segunda, terça e quarta',hora:'07:30–19:00'}};
const PEOPLE={tha:{n:'Tháriga'},rafael:{n:'Rafael'},lais:{n:'Laís'},mariana:{n:'Mariana'}};
const STAFF=['rafael','lais','mariana'];
// Valores e tempos informados por Tháriga em 30/09/2026. Todos os serviços exigem anamnese. Retorno padrão: 20 dias.
const SERV={
 flo:[
  {id:'design',n:'Design de sobrancelhas',p:85,d:30},
  {id:'henna',n:'Design + henna',p:120,d:60},
  {id:'buco',n:'Buço',p:50,d:10},
  {id:'depfacial',n:'Depilação facial',p:150,d:30},
  {id:'lashlift',n:'Lash lifting',p:200,d:60},
  {id:'browlam',n:'Brow lamination',p:200,d:60},
  {id:'micro',n:'Micropigmentação',p:1500,d:120},
  {id:'cilios',n:'Alongamento de cílios',p:200,d:120},
  {id:'ciliosmanut',n:'Manutenção de cílios',p:180,d:90},
 ],
 mai:[

// ── Fotos: reduzidas no aparelho e guardadas no próprio banco ──
// Ficam em /{unidade}/fotos/{cliente}/{foto}. Só se envia foto de quem autorizou na anamnese.
function podeFoto(cid){const an=anamDe(cid);
  if(!an)return 'Preencha a anamnese antes de tirar fotos.';
  if(an.fotoOk!==true)return 'Esta cliente não autorizou fotos na anamnese.';
  return null}
function reduzirFoto(file){return new Promise((res,rej)=>{
  const url=URL.createObjectURL(file),im=new Image();
  im.onload=()=>{URL.revokeObjectURL(url);const r=Math.min(1,1280/Math.max(im.width,im.height));
    const cv=document.createElement('canvas');cv.width=Math.round(im.width*r);cv.height=Math.round(im.height*r);
    cv.getContext('2d').drawImage(im,0,0,cv.width,cv.height);
    for(const q of [.72,.6,.5,.4]){const d=cv.toDataURL('image/jpeg',q);if(d.length<=600000||q===.4)return res(d)}};
  im.onerror=()=>{URL.revokeObjectURL(url);rej(new Error('Não foi possível ler essa imagem.'))};im.src=url})}
function escolherFoto(cid,tipo,atendId,depois){const msg=podeFoto(cid);if(msg){toast(msg);return}
  const inp=document.createElement('input');inp.type='file';inp.accept='image/*';
  inp.onchange=async()=>{const f=inp.files[0];if(!f)return;toast('Enviando a foto…');
    try{const img=await reduzirFoto(f),c=cli(cid),base=c._p==='florenca'?'florenca':'maison';
      const reg={tipo,data:iso(TODAY),img,por:S.user.nome};if(atendId)reg.atend=atendId;
      if(await grava(()=>DB.push(base+'/fotos/'+cid,reg),'Foto salva')&&depois)depois()}
    catch(e){toast(e.message)}};
  inp.click()}
async function carregarFotos(cid,boxId,atendId){const box=document.getElementById(boxId);if(!box)return;
  const c=cli(cid),base=c._p==='florenca'?'florenca':'maison';let v;
  try{v=await DB.get(base+'/fotos/'+cid)}catch(e){box.textContent='Não foi possível carregar as fotos: '+e.message;return}
  let fs=Object.entries(v||{}).map(([id,f])=>({id,...f})).sort((a,b)=>a.data.localeCompare(b.data));
  if(atendId)fs=fs.filter(f=>f.atend===atendId);
  box.innerHTML=fs.length?`<div class="fgrid">${fs.map(f=>`<figure><img src="${esc(f.img)}" data-foto="${f.id}" alt="Foto ${f.tipo==='inicial'?'inicial':'de acompanhamento'}"><figcaption class="small muted">${f.tipo==='inicial'?'Inicial':'Acompanhamento'} · ${fd(f.data)}</figcaption></figure>`).join('')}</div>`:'Nenhuma foto ainda.';
  box.querySelectorAll('[data-foto]').forEach(i=>i.onclick=()=>mostrarFoto(cid,fs.find(f=>f.id===i.dataset.foto),boxId,atendId))}
// A foto ampliada abre no próprio lugar, sem trocar a janela: o que já foi digitado no registro não se perde.
function mostrarFoto(cid,f,boxId,atendId){const c=cli(cid),base=c._p==='florenca'?'florenca':'maison',vw=document.getElementById(boxId+'-v');if(!vw)return;
  vw.innerHTML=`<div class="box" style="margin-top:10px;padding:12px"><img src="${esc(f.img)}" alt="" style="width:100%;border-radius:10px;display:block">
  <p class="small muted" style="margin:8px 0">${f.tipo==='inicial'?'Foto inicial':'Foto de acompanhamento'} · ${fd(f.data,{day:'2-digit',month:'2-digit',year:'numeric'})} · enviada por ${esc(f.por||'')}</p>
  <div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn sm" id="fv-v">Fechar foto</button>${isAdmin()?'<button class="btn sm" id="fv-d" style="margin-left:auto;color:var(--warn);border-color:var(--warn)">Excluir foto</button>':''}</div></div>`;
  vw.scrollIntoView({block:'nearest'});
  document.getElementById('fv-v').onclick=()=>{vw.innerHTML=''};
  const d=document.getElementById('fv-d');if(d)d.onclick=async()=>{if(!confirm('Excluir esta foto?'))return;
    if(await grava(()=>DB.del(base+'/fotos/'+cid+'/'+f.id),'Foto excluída')){vw.innerHTML='';carregarFotos(cid,boxId,atendId)}}}

// ── Anamnese pelo link: a cliente preenche no celular e a equipe confere e integra ──
const LINK_VALE_DIAS=7;
function novoToken(){const b=crypto.getRandomValues(new Uint8Array(24));return btoa(String.fromCharCode(...b)).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'')}
async function enviarLinkAnamnese(cid){const c=cli(cid);
  // Reaproveita o link de quem ainda não usou e não venceu; senão cria um novo.
  let token=Object.entries(C.mConv||{}).find(([t,v])=>v.cli===cid&&!v.usado&&v.exp>Date.now())?.[0];
  if(!token){token=novoToken();
    const ok=await grava(()=>DB.set('maison/convites/'+token,{cli:cid,nome:c.n.split(' ')[0],exp:Date.now()+LINK_VALE_DIAS*864e5,usado:false,por:S.user.nome,em:iso(TODAY)}));
    if(!ok)return}
  const link=new URL('anamnese.html',location.href).href.replace(/[?#].*$/,'')+'?t='+token;
  const msg=`Oi, ${c.n.split(' ')[0]}! Para agilizar o seu atendimento na Maison Beauty, preencha a sua ficha de anamnese pelo celular, é rapidinho: ${link} (o link vale ${LINK_VALE_DIAS} dias). Obrigada!`;
  openDlg('Anamnese por link',`<p class="small muted">Envie este link para ${esc(c.n)}. Ela preenche e assina no próprio celular. Quando ela enviar, aparece em <b>Anamnese</b>, em "Recebidas pelo link", para a equipe conferir e integrar à ficha.</p>
  <label class="f">Mensagem pronta<textarea rows="5" id="lk-m">${esc(msg)}</textarea></label>
  <div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn p" id="lk-w" ${c.tel?'':'disabled'}>Enviar pelo WhatsApp</button><button class="btn" id="lk-c">Copiar mensagem</button><button class="btn" id="lk-f">Fechar</button></div>
  <p class="small muted" style="margin-top:10px">O link vale ${LINK_VALE_DIAS} dias e só pode ser usado uma vez.${c.tel?'':' Cadastre o telefone da cliente para enviar pelo WhatsApp.'}</p>`);
  document.getElementById('lk-w').onclick=()=>{window.open(zapLink(c.tel,document.getElementById('lk-m').value),'_blank','noopener')};
  document.getElementById('lk-c').onclick=async()=>{try{await navigator.clipboard.writeText(document.getElementById('lk-m').value);toast('Mensagem copiada')}catch(e){toast('Não foi possível copiar')}};
  document.getElementById('lk-f').onclick=()=>ficha(cid)}

  document.getElementById('pd-d').onclick=async()=>{if(!confirm('Descartar esta anamnese? O link volta a valer para ela preencher de novo.'))return;

async function excluirCliente(id){const c=cli(id);
  // Quem já tem atendimento (mesmo cancelado) ou agendamento aberto fica: apagar levaria o histórico junto.
  if(histAll(true).some(h=>h.cli===id)){toast('Esta cliente tem atendimentos no histórico e não pode ser excluída.');return}
  if(agendaAtiva().some(a=>a.cli===id)){toast('Cancele os agendamentos desta cliente antes de excluí-la.');return}
  if(!confirm(`Excluir ${c.n} e a anamnese dela? Isso não pode ser desfeito.`))return;
  const base=c._p;
  const ok=await grava(async()=>{await DB.del(base+'/clientes/'+id);await DB.del(base+'/anamneses/'+id)},'Cliente excluída');
  if(ok)closeDlg()}

  const cv=document.getElementById('sig'),ctx=cv.getContext('2d');let dr=false,signed=false;
  const fit=()=>{const r=cv.getBoundingClientRect();cv.width=r.width*2;cv.height=r.height*2;ctx.scale(2,2);ctx.lineWidth=2;ctx.lineCap='round';ctx.strokeStyle='#262220'};fit();
  const pos=e=>{const r=cv.getBoundingClientRect();return[e.clientX-r.left,e.clientY-r.top]};
  cv.onpointerdown=e=>{dr=true;signed=true;ctx.beginPath();ctx.moveTo(...pos(e));cv.setPointerCapture(e.pointerId)};cv.onpointermove=e=>{if(dr){ctx.lineTo(...pos(e));ctx.stroke()}};cv.onpointerup=cv.onpointerleave=()=>dr=false;
  document.getElementById('limpa').onclick=()=>{ctx.clearRect(0,0,cv.width,cv.height);signed=false};
  document.getElementById('asave').onclick=async()=>{
    // Saúde: toda pergunta precisa de Sim ou Não — pergunta em branco não pode valer como "não".
    const respostas={};let falta=-1;
    PERGUNTAS.forEach((q,i)=>{const r=document.querySelector(`input[name=q${i}]:checked`);if(r)respostas['q'+i]=r.value;else if(falta<0)falta=i});
    if(falta>=0){toast('Falta responder Sim ou Não em todas as perguntas de saúde');document.querySelector(`[data-qrow="${falta}"]`).scrollIntoView({block:'center'});return}
    const servicos=[...document.querySelectorAll('[data-sv]:checked')].map(i=>SERVICOS_ANAM[+i.dataset.sv]);
    const outro=document.getElementById('an-outro').value.trim();
    if(!servicos.length&&!outro){toast('Marque o serviço solicitado');return}
    const foto=document.querySelector('input[name=foto]:checked');
    if(!foto){toast('Marque se autoriza ou não as fotos');return}
    if(!signed){toast('Falta a assinatura da cliente');return}
    const btn=document.getElementById('asave');btn.disabled=true;
    // A assinatura sai sobre fundo branco, para continuar legível em qualquer tema.
    const out=document.createElement('canvas');out.width=cv.width/2;out.height=cv.height/2;const o=out.getContext('2d');o.fillStyle='#fff';o.fillRect(0,0,out.width,out.height);o.drawImage(cv,0,0,out.width,out.height);
    const nasc=document.getElementById('an-nasc').value,tel=document.getElementById('an-tel').value.trim();
    const reg={data:iso(TODAY),nascimento:nasc,telefone:tel,emergencia:document.getElementById('an-em').value.trim(),responsavel:document.getElementById('an-resp').value.trim(),
      unidade:document.getElementById('an-un').value,servicos,outro,area:document.getElementById('an-area').value.trim(),respostas,
      flags:PERGUNTAS.filter((q,i)=>respostas['q'+i]==='sim').map(q=>q[1]),obs:document.getElementById('aobs').value.trim(),
      fotoOk:foto.value==='sim',assinatura:out.toDataURL('image/png'),por:S.user.nome};
    const base=c._p==='florenca'?'florenca':'maison';
    const ok=await grava(async()=>{
      await DB.set(base+'/anamneses/'+id,reg);
      // O que a ficha trouxe e o cadastro ainda não tinha, o cadastro aproveita.
      const cad={};if(nasc&&!c.niver)cad.niver=nasc.slice(5,10);if(tel&&!c.tel)cad.tel=tel;
      if(Object.keys(cad).length)await DB.upd(base+'/clientes/'+id,cad);
    },'Anamnese salva');
    if(ok){closeDlg();ficha(id)}else btn.disabled=false}}

// Ideia sugerida para uma data: gira dentro do tema do dia, sem repetir na semana seguinte; a troca dela fica guardada.
function igIdeiaDe(data){const pl=(C.instagram||{}).plano||{};const ja=IG_IDEIAS.find(x=>x.id===pl[data]);if(ja)return ja;
  const dow=new Date(data+'T12:00').getDay(),cfg=IG_SEMANA[dow],pool=IG_IDEIAS.filter(x=>x.t===cfg.t),n=pool.length;
  const w=Math.floor(new Date(data+'T12:00').getTime()/6048e5),slot=cfg.s?1:0;return pool[(w+slot*Math.floor(n/2))%n]}
function igCard(x,destaque){const r=(C.instagram||{})[x.id]||{};const leg=(r.legenda!=null?r.legenda:x.l);
  const q=encodeURIComponent(x.q);
  return `<div class="box" style="margin-bottom:12px${destaque?';border-color:var(--rose,#c9a0a0)':''}"><div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center"><h3 style="margin:0">${esc(x.n)}</h3><span class="tag">${esc(x.f)}</span><span class="tag">${esc(IG_TEMAS[x.t])}</span>${r.postadoEm?`<span class="tag ok">Postado em ${esc(fd(r.postadoEm,{day:'2-digit',month:'2-digit'}))}</span>`:''}</div>
  <label class="f" style="margin-top:8px">Legenda (edite à vontade)<textarea rows="5" id="igl-${x.id}">${esc(leg)}</textarea></label>
  <div class="small muted" style="margin-bottom:6px">Hashtags: ${esc(x.h)} ${esc(IG_BASE)}</div>
  <div class="small" style="margin-bottom:8px"><b>O que fotografar:</b> ${esc(x.foto)}</div>
  <div style="display:flex;gap:6px;flex-wrap:wrap"><button class="btn p sm" data-igcopy="${x.id}">Copiar legenda e hashtags</button><button class="btn sm" data-igsave="${x.id}">Guardar minha versão</button>
   <a class="btn sm" style="color:inherit;text-decoration:none" target="_blank" rel="noopener" href="https://www.pexels.com/pt-br/procurar/${q}/">Fotos no Pexels</a><a class="btn sm" style="color:inherit;text-decoration:none" target="_blank" rel="noopener" href="https://unsplash.com/s/photos/${q}">Fotos no Unsplash</a>
   <button class="btn sm" data-igpost="${x.id}">${r.postadoEm?'Desmarcar postado':'Marcar como postado'}</button></div></div>`}
function vInstagram(){
  const off=S.igSem||0,dias=igSemanaDe(off),hoje=iso(TODAY);
  const sel=dias.includes(S.igDia)?S.igDia:(dias.includes(hoje)?hoje:dias[0]);
  const lin=dias.map(d=>{const dow=new Date(d+'T12:00').getDay(),cfg=IG_SEMANA[dow],x=igIdeiaDe(d),r=(C.instagram||{})[x.id]||{},feito=r.postadoEm;
    return `<button class="row" data-igdia="${d}" style="width:100%;text-align:left;cursor:pointer;background:${d===sel?'var(--panel2,#f3ece0)':'transparent'};border:0;border-bottom:1px solid var(--line);padding:10px 4px">
     <div style="min-width:78px"><b>${DIAS_PT[dow].slice(0,3)}</b> ${esc(fd(d))}${d===hoje?' <span class="tag">hoje</span>':''}</div>
     <div class="grow"><b>${esc(x.n)}</b><div class="small muted">${esc(cfg.r)} · ${esc(x.f)}${cfg.e?' · ★ essencial':cfg.s?' · se der tempo':''}</div></div>
     ${feito?'<span class="tag ok">Postado</span>':''}</button>`}).join('');
  const dsel=sel,xsel=igIdeiaDe(dsel);
  const t=S.igTema||'todos',lista=IG_IDEIAS.filter(x=>t==='todos'||x.t===t);
  return `<div class="top"><div><h1>Instagram</h1><div class="sub">O que postar em cada dia da semana. Você copia, ajusta e posta; nada é publicado daqui.</div></div></div>
  <div class="note" style="margin-bottom:14px">Sem tempo? Faça só os dias com <b>★</b> (segunda, quarta e sexta). Foto de cliente só com autorização específica de divulgação: a ficha de anamnese <b>não</b> dá essa autorização.</div>
  <div style="display:flex;gap:8px;align-items:center;margin-bottom:8px;flex-wrap:wrap"><button class="btn sm" data-igsem="${off-1}">‹ Semana anterior</button><b>${esc(fd(dias[0]))} a ${esc(fd(dias[6]))}</b><button class="btn sm" data-igsem="${off+1}">Semana seguinte ›</button>${off?`<button class="btn sm" data-igsem="0">Esta semana</button>`:''}</div>
  <div class="box" style="margin-bottom:14px;padding:6px 12px">${lin}</div>
  <h2>${DIAS_PT[new Date(dsel+'T12:00').getDay()]}, ${esc(fd(dsel))}</h2>${igCard(xsel,true)}
  <div style="margin:-4px 0 14px"><button class="btn sm" data-igtroca="${dsel}">Trocar por outra ideia do mesmo tema</button></div>
  <details style="margin-top:6px"><summary style="cursor:pointer;font-weight:600;margin-bottom:10px">Ver todas as ideias (${IG_IDEIAS.length})</summary>
   <div style="display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px"><button class="btn sm ${t==='todos'?'p':''}" data-igtema="todos">Todas</button>${Object.entries(IG_TEMAS).map(([k,v])=>`<button class="btn sm ${t===k?'p':''}" data-igtema="${k}">${v}</button>`).join('')}</div>
   ${lista.map(x=>igCard(x,false)).join('')}</details>`}
async function igTrocar(data){const dow=new Date(data+'T12:00').getDay(),pool=IG_IDEIAS.filter(x=>x.t===IG_SEMANA[dow].t),at=igIdeiaDe(data);
  const prox=pool[(pool.findIndex(x=>x.id===at.id)+1)%pool.length];await grava(()=>DB.upd('admin/instagram/plano',{[data]:prox.id}),'Ideia trocada')}
async function igCopiar(id){const x=IG_IDEIAS.find(y=>y.id===id),ta=document.getElementById('igl-'+id);
  const txt=ta.value.trim()+'\n\n'+x.h+' '+IG_BASE;
  try{await navigator.clipboard.writeText(txt);toast('Copiado. É só colar no Instagram.')}
  catch(e){ta.focus();ta.select();toast('Selecione o texto e copie (Ctrl+C).')}}
async function igSalvar(id){const ta=document.getElementById('igl-'+id);await grava(()=>DB.upd('admin/instagram/'+id,{legenda:ta.value}),'Sua versão foi guardada')}
async function igPostado(id){const r=(C.instagram||{})[id]||{};
  await grava(()=>DB.upd('admin/instagram/'+id,{postadoEm:r.postadoEm?null:iso(TODAY)}),r.postadoEm?'Desmarcado':'Marcado como postado')}

function render(){
  if(!S.user)return;
  renderChrome();
  const V={hoje:vHoje,agenda:vAgenda,clientes:vClientes,anamnese:vAnamnese,financeiro:vFinanceiro,comissoes:vComissoes,servicos:vServicos,fornecedores:vFornecedores,cursos:vCursos,aulas:vAulas,instagram:vInstagram};
  const main=document.getElementById('main');
  const erros=Object.entries(S.erros);
  const aviso=erros.length?`<div class="note err"><span>Não foi possível ler parte dos dados (${erros.map(([p,m])=>esc(p+': '+m)).join('; ')}). A tela pode estar incompleta.</span><button class="btn sm" id="retry">Tentar de novo</button></div>`:'';
  main.innerHTML=aviso+(DEMO?'<div class="note">Demonstração: os dados ficam só na memória deste navegador e somem ao recarregar.</div>':'')+V[S.tab]();
  bindSeg();
  const rt=document.getElementById('retry');if(rt)rt.onclick=()=>{S.erros={};comecarLeituras()};
  main.querySelectorAll('[data-day]').forEach(b=>b.onclick=()=>{S.day=+b.dataset.day;render()});
  main.querySelectorAll('[data-done]').forEach(b=>b.onclick=()=>concluir(b.dataset.done,b.dataset.p));
  main.querySelectorAll('[data-msg]').forEach(b=>b.onclick=()=>msgDlg(b.dataset.msg,b.dataset.c));
  main.querySelectorAll('[data-cli]').forEach(b=>b.onclick=()=>ficha(b.dataset.cli));
  main.querySelectorAll('[data-pay]').forEach(b=>b.onclick=()=>grava(()=>DB.set('admin/pagamentos/'+qzChave(b.dataset.pay),true),'Comissão marcada como paga'));
  main.querySelectorAll('[data-payrent]').forEach(b=>b.onclick=()=>grava(()=>DB.set('admin/pagamentos/'+qzChave('lais_aluguel'),true),'Aluguel marcado como pago'));
  main.querySelectorAll('[data-det]').forEach(b=>b.onclick=()=>detCom(b.dataset.det));
  main.querySelectorAll('[data-pc]').forEach(b=>b.onclick=()=>grava(()=>DB.set('admin/contas/'+b.dataset.pc+'/pago',true),'Conta marcada como paga'));
  main.querySelectorAll('[data-regat]').forEach(b=>b.onclick=()=>abrirRegistro(b.dataset.regat,b.dataset.p,null));
  main.querySelectorAll('[data-remarcar]').forEach(b=>b.onclick=()=>remarcarAg(b.dataset.remarcar,b.dataset.p));
  main.querySelectorAll('[data-reconvite]').forEach(b=>b.onclick=async()=>{const a=agenda().find(x=>x.id===b.dataset.reconvite&&x._p===b.dataset.p);if(!a)return;b.disabled=true;
    const sent=await convidar(a.id,a._p,a);toast(sent?'Convite enviado':'Ainda não consegui enviar. Tente de novo em instantes.')});
  const rb=document.getElementById('resp');if(rb)rb.onclick=()=>respostasAgenda(true);
  if(S.tab==='agenda'&&AGENDA_URL&&(!S.respEm||Date.now()-S.respEm>300000)){S.respEm=Date.now();setTimeout(()=>respostasAgenda(false),0)}
  main.querySelectorAll('[data-cancelag]').forEach(b=>b.onclick=()=>cancelarAg(b.dataset.cancelag,b.dataset.p));
  main.querySelectorAll('[data-ec]').forEach(b=>b.onclick=()=>editarConta(b.dataset.ec));
  main.querySelectorAll('[data-ef]').forEach(b=>b.onclick=()=>editarFornecedor(b.dataset.ef));
  main.querySelectorAll('[data-ecu]').forEach(b=>b.onclick=()=>editarCurso(b.dataset.ecu));
  main.querySelectorAll('[data-es]').forEach(b=>{const [u,i]=b.dataset.es.split('|');b.onclick=()=>editarServico(u,i)});
  main.querySelectorAll('[data-ns]').forEach(b=>b.onclick=()=>editarServico(b.dataset.ns,null));
  main.querySelectorAll('[data-igdia]').forEach(b=>b.onclick=()=>{S.igDia=b.dataset.igdia;render()});
  main.querySelectorAll('[data-igsem]').forEach(b=>b.onclick=()=>{S.igSem=+b.dataset.igsem;S.igDia=null;render()});
  main.querySelectorAll('[data-igtroca]').forEach(b=>b.onclick=()=>igTrocar(b.dataset.igtroca));
  main.querySelectorAll('[data-igtema]').forEach(b=>b.onclick=()=>{S.igTema=b.dataset.igtema;render()});
  main.querySelectorAll('[data-igcopy]').forEach(b=>b.onclick=()=>igCopiar(b.dataset.igcopy));
  main.querySelectorAll('[data-igsave]').forEach(b=>b.onclick=()=>igSalvar(b.dataset.igsave));
  main.querySelectorAll('[data-igpost]').forEach(b=>b.onclick=()=>igPostado(b.dataset.igpost));
  main.querySelectorAll('[data-pend]').forEach(b=>b.onclick=()=>revisarPendente(b.dataset.pend));
  const nv=document.getElementById('novo');if(nv)nv.onclick=novoAg;
  const q=document.getElementById('q');if(q){q.oninput=e=>{S.q=e.target.value;const pos=e.target.selectionStart;render();const n=document.getElementById('q');n.focus();n.setSelectionRange(pos,pos)}}
  const rp=document.getElementById('rep');if(rp)rp.onchange=e=>grava(()=>DB.set('admin/config/repasse',Math.min(100,Math.max(0,+e.target.value||0))));
  const ex=document.getElementById('extr');if(ex)ex.onclick=extrato;
  main.querySelectorAll('[data-aula]').forEach(b=>b.onclick=()=>verAula(b.dataset.aula));
  const nt=document.getElementById('novatema');if(nt)nt.onclick=novoTema;
  main.querySelectorAll('[data-anamform]').forEach(b=>b.onclick=()=>anamnese(b.dataset.anamform));
  const ncb=document.getElementById('novacli');if(ncb)ncb.onclick=novoCliente;
  const nfb=document.getElementById('novofor');if(nfb)nfb.onclick=novoFornecedor;
  const nqb=document.getElementById('novaconta');if(nqb)nqb.onclick=novaConta;
  const nkb=document.getElementById('novocurso');if(nkb)nkb.onclick=novoCurso;
}
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
</body>
</html>
