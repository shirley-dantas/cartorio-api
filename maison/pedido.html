<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<title>Agendar horário · Tháriga Beauty &amp; Co</title>
<meta property="og:type" content="website">
<meta property="og:site_name" content="Tháriga Beauty &amp; Co">
<meta property="og:title" content="Agende o seu horário · Tháriga Beauty &amp; Co">
<meta property="og:description" content="Escolha o serviço, o dia e o horário. Sem conversa: já fica marcado.">
<meta property="og:image" content="https://thariga-brito.vercel.app/og-banner.jpg">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">

<link href="https://fonts.googleapis.com/css2?family=Cormorant:wght@500;600&family=Figtree:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#FAF7F1;--panel:#fff;--ink:#262220;--muted:#8A7D6E;--line:#E9E1D2;--berry:#9C7A2E;--berry-soft:#F1E9D4;--warn:#A8551C;--warn-soft:#FBEBDD;--ok:#3F7A57;--ok-soft:#E2F1E7;
 --serif:"Cormorant",Georgia,serif;--sans:"Figtree",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 var(--sans);padding:env(safe-area-inset-top,0) 0 env(safe-area-inset-bottom,0)}
.wrap{max-width:640px;margin:0 auto;padding:20px 16px 60px}
.logo{display:block;margin:6px auto 8px;width:150px;max-width:50%;height:auto}
h1{font-family:var(--serif);font-weight:600;font-size:30px;margin:10px 0 4px;text-align:center}
.sub{color:var(--muted);text-align:center;font-size:14px;margin-bottom:18px}
.box{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:14px}
.sec{background:var(--berry-soft);padding:9px 12px;border-radius:8px;font-weight:600;margin:20px 0 12px}
label.f{display:block;margin-bottom:12px;font-size:14px;color:var(--muted)}
label.f input,label.f textarea,label.f select{display:block;width:100%;margin-top:4px;padding:11px 12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);font:inherit;font-size:16px}
.q{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:11px 0;border-top:1px solid var(--line);font-size:15px}
.q .sn{display:flex;gap:18px;flex:none}
.q label,.sv label,.fo label{display:inline-flex;gap:8px;align-items:center;cursor:pointer}
input[type=radio],input[type=checkbox]{width:22px;height:22px;accent-color:var(--berry)}
.sv{display:grid;grid-template-columns:1fr;gap:10px;margin-bottom:10px}
.fo{display:flex;gap:20px;flex-wrap:wrap;margin:6px 0}
[hidden]{display:none!important}
.fgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}
.fgrid figure{margin:0;position:relative}
.fgrid img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:10px;border:1px solid var(--line);display:block}
.fgrid button{position:absolute;top:4px;right:4px;border:0;border-radius:999px;background:rgba(38,34,32,.78);color:#fff;width:28px;height:28px;font-size:16px;line-height:1;cursor:pointer}
.small{font-size:13px;color:var(--muted)}
canvas.sig{width:100%;height:150px;border:1px dashed var(--muted);border-radius:12px;background:#fff;touch-action:none}
.btn{border:1px solid var(--line);background:var(--panel);padding:10px 18px;border-radius:999px;font:inherit;font-weight:500}
.btn.p{background:var(--berry);border-color:var(--berry);color:#fff;width:100%;padding:14px;font-size:17px;margin-top:16px}
.btn:disabled{opacity:.5}
.msg{text-align:center;padding:30px 10px}
.msg h2{font-family:var(--serif);font-size:28px;margin:0 0 8px}
.alert{background:var(--warn-soft);color:var(--warn);border-radius:10px;padding:10px 12px;font-size:14px;margin:10px 0}
.erro{color:var(--warn);font-size:14px;margin-top:8px;min-height:20px}
</style>
<style>
.un{display:grid;gap:10px;margin-bottom:6px}
.un label{position:relative;display:block;border:1.5px solid var(--line);border-radius:14px;padding:14px 16px;background:var(--panel);cursor:pointer}
.un label.on{border-color:var(--berry);background:var(--berry-soft)}
.un input{position:absolute;opacity:0;pointer-events:none}
.un b{display:block;font-size:17px}
.un span{display:block;font-size:13px;color:var(--muted);margin-top:2px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}
.chips label{position:relative;display:inline-flex;align-items:center;gap:6px;border:1.5px solid var(--line);border-radius:999px;padding:9px 16px;background:var(--panel);cursor:pointer;font-size:15px;color:var(--ink)}
.chips label.on{border-color:var(--berry);background:var(--berry-soft);font-weight:600}
.chips input{position:absolute;opacity:0;pointer-events:none}
.hp{position:absolute;left:-9999px;width:1px;height:1px;overflow:hidden}
</style>
<style>
.slots{display:flex;flex-wrap:wrap;gap:8px;margin:6px 0 14px}
.slots button{border:1.5px solid var(--line);background:var(--panel);border-radius:999px;padding:10px 16px;font:inherit;font-size:16px;color:var(--ink);min-width:78px}
.slots button.on{background:var(--berry);border-color:var(--berry);color:#fff;font-weight:600}
.dia{font-weight:600;margin:14px 0 2px}
.resumo{background:var(--berry-soft);border-radius:12px;padding:12px 14px;margin:10px 0;font-size:15px}
</style>
<style>
.hero{background:linear-gradient(170deg,#F6E3DF,#F1E9D4);border-radius:0 0 26px 26px;margin:-20px -16px 6px;padding:22px 16px 18px;text-align:center}
.hero .logo{width:112px;height:112px;border-radius:50%;border:3px solid #fff;box-shadow:0 4px 14px #B2706A33;margin:0 auto}
.hero h1{margin:10px 0 4px;font-size:32px}
.hero p{margin:0;font-size:14px;color:#7a6a5c}
.un{display:flex;gap:8px;justify-content:center;margin:14px 0 0}
.un label{display:block;padding:9px 16px;border-radius:999px;border:1.5px solid #B2706A66;background:transparent;text-align:center}
.un label.on{background:#B2706A;border-color:#B2706A;color:#fff}
.un b{font-size:15px;font-weight:600}.un span{font-size:12px;opacity:.85;margin:0}
.cat{background:var(--panel);border:1px solid var(--line);border-radius:18px;margin:14px 0 0;overflow:hidden;box-shadow:0 2px 10px #0000000d}
.cat h2{margin:0;padding:12px 16px;font:600 13px var(--sans);letter-spacing:.09em;text-transform:uppercase;background:#F6E3DF;color:#7a4540}
.it{display:flex;align-items:center;gap:12px;padding:13px 16px;border-top:1px solid var(--line)}
.it .ph{flex:none;width:62px;height:78px;border-radius:12px;overflow:hidden;background:linear-gradient(155deg,#F6E3DF,#F1E9D4)}
.it .ph svg{width:100%;height:100%;display:block}
.it .t{flex:1;min-width:0}.it .t b{display:block;font:600 19px/1.15 var(--serif)}.it .t i{font-style:normal;font-size:14px;color:var(--muted)}
.it button{flex:none;background:#B2706A;color:#fff;border:0;border-radius:999px;padding:11px 16px;font:600 15px var(--sans);white-space:nowrap}
.fab{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom,0px));background:var(--berry);color:#fff;border:0;border-radius:999px;padding:14px 24px;font:600 15px var(--sans);letter-spacing:.05em;box-shadow:0 6px 18px #0004;white-space:nowrap;z-index:5}
.escolhido{background:var(--berry-soft);border-radius:12px;padding:10px 14px;margin:14px 0 4px;font-size:15px}
</style>
</head>
<body>
<div class="wrap">
  <div id="tela"></div>
</div>

<script type="module">
import { initializeApp } from 'https://www.gstatic.com/firebasejs/12.14.0/firebase-app.js';
import { getDatabase, ref, get, set } from 'https://www.gstatic.com/firebasejs/12.14.0/firebase-database.js';
import { getAuth, signInAnonymously } from 'https://www.gstatic.com/firebasejs/12.14.0/firebase-auth.js';

// Mesmo projeto Firebase do painel. A cliente entra de forma anônima, só para marcar o horário:
// lê os horários ocupados (sem nome de ninguém) e cria UMA reserva. Nada mais.
const firebaseConfig = {
  apiKey: "AIzaSyD0p5Y0HDL2rcDLE6qFNSb4nyPe3yFjXos",
  authDomain: "maison-beauty-2e7da.firebaseapp.com",
  databaseURL: "https://maison-beauty-2e7da-default-rtdb.firebaseio.com",
  projectId: "maison-beauty-2e7da",
  storageBucket: "maison-beauty-2e7da.firebasestorage.app",
  messagingSenderId: "30042816821",
  appId: "1:30042816821:web:e0e5cbcfe596d3a1a40c7c"
};
// Serviços (nome e duração em minutos) de cada unidade: os mesmos do painel.
const UN={
 mai:{n:'Tháriga Beauty & Co',em:'na',de:'da',s:'Itaquera',e:'Rua Fontoura Xavier, 717, sala 3, Itaquera, São Paulo - SP, CEP 08295-300',dias:[[0,'Domingo'],[1,'Segunda'],[2,'Terça'],[3,'Quarta']],base:'maison',serv:[["Design de sobrancelhas", 30], ["Design + henna", 60], ["Buço", 10], ["Depilação facial", 30], ["Micropigmentação", 90], ["Alongamento de cílios", 120], ["Manutenção de cílios", 90], ["Remoção de cílios", 30], ["Mão tradicional", 30], ["Pé tradicional", 40], ["Alongamento de unhas", 120], ["Manutenção de unhas", 90], ["Remoção de alongamento de unhas", 30], ["Remoção de pigmento a laser", 30], ["Laser para tratamento de fungos", 30], ["Depilação a laser", 30], ["Ozonioterapia", 60], ["Aplicação de piercing", 30]]},
 flo:{n:'Estúdio Florença',em:'no',de:'do',s:'Itaim Bibi',e:'Rua Pedroso Alvarenga, 502, Itaim Bibi, São Paulo - SP, CEP 04531-001',dias:[[4,'Quinta'],[5,'Sexta'],[6,'Sábado']],base:'florenca',serv:[["Design de sobrancelhas", 30], ["Design + henna", 60], ["Buço", 10], ["Depilação facial", 30], ["Lash lifting", 60], ["Brow lamination", 60], ["Micropigmentação", 120], ["Alongamento de cílios", 120], ["Manutenção de cílios", 90]]}};
// Quem faz cada serviço (mesmo mapa do painel, PRO_SERV): cada profissional tem a sua vaga e a sua agenda.
const RAF=['Remoção de pigmento a laser','Laser para tratamento de fungos','Depilação a laser','Ozonioterapia','Aplicação de piercing'],
      MAR=['Mão tradicional','Pé tradicional','Alongamento de unhas','Manutenção de unhas','Remoção de alongamento de unhas'];
const proDe=(u,nome)=>u==='flo'?'tha':RAF.includes(nome)?'rafael':MAR.includes(nome)?'mariana':'tha';
const VAGA={tha:1,rafael:2,mariana:3,ana:5};
// Sobrancelhas e cílios, em Itaquera, a Tháriga e a Ana Luiza fazem: a cliente escolhe com quem.
const ANA=['Design de sobrancelhas','Design + henna','Alongamento de cílios','Manutenção de cílios','Remoção de cílios'];
const NOME_PRO={tha:'Tháriga',ana:'Ana Luiza'};
const donosDe=(u,nome)=>u==='mai'&&ANA.includes(nome)?['tha','ana']:[proDe(u,nome)];
const proEscolhida=()=>{const sv0=UN[un].serv[+document.getElementById('s').value],l=donosDe(un,sv0[0]),q=document.getElementById('q');return l.length>1&&q&&l.includes(q.value)?q.value:l[0]};
// Dias de cada profissional: a Tháriga fica em Itaquera de domingo a quarta e no Florença de quinta a sábado; a agenda do Rafael e da Mariana fica aberta todos os dias (eles fecham os dias em que não atendem).
const DIAS_PRO={mai:{tha:[0,1,2,3],rafael:[0,1,2,3,4,5,6],mariana:[0,1,2,3,4,5,6],ana:[0,1,2,3,4,5,6]},flo:{tha:[4,5,6]}};
UN.mai.diasTxt='Todos os dias';UN.flo.diasTxt='Quinta, sexta e sábado';
const NOMES=['Domingo','Segunda','Terça','Quarta','Quinta','Sexta','Sábado'];
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const iso=d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
const minDe=h=>{const [a,b]=h.split(':').map(Number);return a*60+(b||0)};
const hhmm=m=>`${String(Math.floor(m/60)).padStart(2,'0')}:${String(m%60).padStart(2,'0')}`;
const fdata=d=>{const x=new Date(d+'T12:00');return `${NOMES[x.getDay()]}, ${x.toLocaleDateString('pt-BR',{day:'2-digit',month:'2-digit'})}`};
const tela=document.getElementById('tela');
let db=null,un='',pub=null,escolha=null;

async function entrar(){
  if(db)return db;
  const app=initializeApp(firebaseConfig);await signInAnonymously(getAuth(app));db=getDatabase(app);return db}

function formulario(){
  tela.innerHTML=`<div class="hero"><img class="logo" src="/logo.png" alt="Tháriga Beauty &amp; Co"><h1>Tháriga Beauty &amp; Co</h1><p>✨ Sobrancelhas • Cílios • Micropigmentação • Unhas<br>Escolha o serviço e marque o seu horário</p>
   <div class="un" id="uns">${Object.entries(UN).map(([k,u])=>`<label><input type="radio" name="un" value="${k}"><b>${k==='flo'?'Estúdio Florença · Itaim':'Itaquera'}</b></label>`).join('')}</div></div>
  <div class="box" style="margin-top:14px;background:transparent;border:0;padding:0">
   <div id="aviso"></div>
   <div id="resto" hidden>
    <div id="catalogo"></div>
    <div id="fluxo" hidden>
    <div class="sec">Seus dados</div>
    <label class="f">Nome<input id="n" autocomplete="name" maxlength="80"></label>
    <label class="f">WhatsApp com DDD<input id="t" type="tel" autocomplete="tel" placeholder="(11) 9...." maxlength="30"></label>
    <div class="fo"><span class="small" style="width:100%">Já foi atendida por nós?</span><label><input type="radio" name="nova" value="nao" checked>Sim, já sou cliente</label><label><input type="radio" name="nova" value="sim">Primeira vez</label></div>
    <div class="sec">O que você quer fazer?</div>
    <label class="f">Serviço<select id="s"></select></label>
    <label class="f" id="qw" hidden>Com quem você prefere?<select id="q"></select></label>
    <div class="sec">Quando fica bom para você?</div>
    <div class="small" style="margin-bottom:8px">Marque um ou mais dias</div>
    <div class="chips" id="dias"></div>
    <div class="small" style="margin-bottom:8px">Período</div>
    <div class="chips" id="per"><label class="on"><input type="radio" name="per" value="M" checked>Manhã</label><label><input type="radio" name="per" value="T">Tarde</label></div>
    <div class="sec">Horários livres</div>
    <div id="slots"><p class="small">Marque pelo menos um dia para ver os horários.</p></div>
    <div id="conf" hidden>
     <div class="resumo" id="resumo"></div>
     <label class="f">Quer nos contar mais alguma coisa? (opcional)<textarea id="o" rows="2" maxlength="300"></textarea></label>
     <div class="erro" id="erro"></div>
     <button class="btn p" id="enviar">Confirmar agendamento</button>
    </div>
    </div>
   </div>
  </div>
  <button class="fab" id="fab" type="button" hidden>📅 AGENDAR HORÁRIO</button>`;
  const marca=box=>box.querySelectorAll('label').forEach(l=>l.classList.toggle('on',!!l.querySelector('input:checked')));
  const uns=document.getElementById('uns');
  uns.addEventListener('change',e=>{un=e.target.value;marca(uns);escolheUnidade()});
  document.getElementById('per').addEventListener('change',()=>{marca(document.getElementById('per'));desenhaSlots()});
  document.getElementById('s').onchange=()=>{montaQuem();montaDias();desenhaSlots()};
  document.getElementById('q').onchange=()=>{montaDias();desenhaSlots()};
  document.getElementById('enviar').onclick=enviar;
  document.getElementById('fab').onclick=()=>{const f=document.getElementById('fluxo');(f.hidden?document.getElementById('catalogo'):f).scrollIntoView({behavior:'smooth',block:'start'})}}

// Os dias oferecidos dependem de quem faz o serviço escolhido.
function montaQuem(){const sv0=UN[un].serv[+document.getElementById('s').value],l=donosDe(un,sv0[0]),w=document.getElementById('qw'),q=document.getElementById('q'),cur=q.value;
  w.hidden=l.length<2;q.innerHTML=l.map(p=>`<option value="${p}">${NOME_PRO[p]}</option>`).join('');if(l.includes(cur))q.value=cur}
function montaDias(){const d=document.getElementById('dias'),u=UN[un],sv0=u.serv[+document.getElementById('s').value],marcados=new Set([...d.querySelectorAll('input:checked')].map(i=>+i.value));
  d.innerHTML=(DIAS_PRO[un][proEscolhida()]||[]).map(n=>`<label class="${marcados.has(n)?'on':''}"><input type="checkbox" value="${n}" ${marcados.has(n)?'checked':''}>${NOMES[n]}</label>`).join('')}
// Ilustrações dos serviços (desenhadas aqui, no lugar de fotos), nas cores do painel.
const OURO='#9C7A2E',ROSE='#B2706A';
const arco=(d,w,c)=>`<path d="${d}" fill="none" stroke="${c||OURO}" stroke-width="${w||3}" stroke-linecap="round"/>`;
const olho=(c)=>arco('M12 44 Q32 26 52 44 Q32 56 12 44Z',2.2,c)+`<circle cx="32" cy="43" r="5.5" fill="${ROSE}"/>`;
const cilios=(up)=>[...Array(7)].map((_,i)=>{const x=14+i*6,y=up?40-Math.abs(i-3)*-1.5:41+Math.abs(i-3)*1.2;return arco(`M${x} ${y} L${x+(i-3)*1.6} ${y-(up?14:11)}`,1.8,OURO)}).join('');
const ICO={
 sobr:arco('M10 46 Q30 22 54 36',4.5)+arco('M12 54 Q32 36 52 46',2,ROSE),
 henna:arco('M10 40 Q30 16 54 32',4.5)+`<path d="M32 50 q-7 9 0 13 q7 -4 0 -13z" fill="${ROSE}"/>`,
 lamin:arco('M10 46 Q30 22 54 36',4)+[...Array(6)].map((_,i)=>arco(`M${16+i*7} ${42-i*1.6} l3 -9`,1.6,ROSE)).join(''),
 cil:olho()+cilios(false),
 cilrem:olho()+cilios(false)+arco('M46 20 l8 8 M54 20 l-8 8',2.4,ROSE),
 lift:olho()+cilios(true),
 micro:arco('M10 44 Q30 20 54 34',4.5)+`<path d="M44 66 L52 48 L56 50 Z" fill="${ROSE}"/>`+arco('M44 66 l-1 5',1.6,ROSE),
 rosto:`<ellipse cx="32" cy="42" rx="15" ry="19" fill="none" stroke="${OURO}" stroke-width="2.4"/>`+arco('M24 40 h4 M36 40 h4',2.4,ROSE)+arco('M27 52 Q32 56 37 52',2,ROSE)+`<path d="M52 18 l2 5 5 2 -5 2 -2 5 -2 -5 -5 -2 5 -2z" fill="${ROSE}"/>`,
 unha:`<path d="M24 62 V34 a8 8 0 0 1 16 0 V62 Z" fill="${ROSE}" opacity=".85"/><path d="M28 36 v10" stroke="#fff" stroke-width="3" stroke-linecap="round" opacity=".8"/>`+arco('M20 66 h24',2.4),
 laser:`<circle cx="32" cy="40" r="8" fill="${ROSE}"/>`+[0,45,90,135,180,225,270,315].map(a=>`<path d="M32 40 l${Math.cos(a*Math.PI/180)*22} ${Math.sin(a*Math.PI/180)*22}" stroke="${OURO}" stroke-width="2" stroke-linecap="round" opacity=".7"/>`).join('')+`<circle cx="32" cy="40" r="8" fill="${ROSE}"/>`,
 ozonio:`<circle cx="26" cy="48" r="11" fill="none" stroke="${OURO}" stroke-width="2.4"/><circle cx="42" cy="32" r="7" fill="none" stroke="${ROSE}" stroke-width="2.4"/><circle cx="40" cy="54" r="4" fill="${ROSE}"/><circle cx="22" cy="28" r="3" fill="${OURO}"/>`,
 pierc:`<circle cx="32" cy="42" r="14" fill="none" stroke="${OURO}" stroke-width="3.4"/><circle cx="32" cy="28" r="4.5" fill="${ROSE}"/>`
};
const ilustra=n=>{const k=/henna/i.test(n)?'henna':/lamination/i.test(n)?'lamin':/Remoção de cílios/i.test(n)?'cilrem':/Lash lifting/i.test(n)?'lift':/cílios/i.test(n)?'cil':/Micropig/i.test(n)?'micro':/Buço|Depilação facial/i.test(n)?'rosto':/Ozonio/i.test(n)?'ozonio':/piercing/i.test(n)?'pierc':/laser/i.test(n)?'laser':/sobrancelhas/i.test(n)?'sobr':/unha|Mão|Pé/i.test(n)?'unha':'rosto';
  return `<svg viewBox="0 0 64 80" aria-hidden="true">${ICO[k]}</svg>`};
const GRUPOS=[['Sobrancelhas',/sobrancelhas|henna|Brow/i],['Cílios',/cílios|Lash/i],['Micropigmentação',/Micropig/i],['Rosto',/Buço|Depilação facial/i],['Unhas',/unha|Mão|Pé/i],['Laser e bem-estar',/laser|Ozonio|piercing/i]];
const durTxt=m=>m>=60?(Math.floor(m/60)+'h'+(m%60?String(m%60).padStart(2,'0'):'')):m+' min';
function desenhaCatalogo(){
  const u=UN[un],box=document.getElementById('catalogo'),usados=new Set();
  box.innerHTML=GRUPOS.map(([g,re])=>{const its=u.serv.map((s,i)=>[s,i]).filter(([s,i])=>!usados.has(i)&&re.test(s[0]));its.forEach(([s,i])=>usados.add(i));
    return its.length?`<div class="cat"><h2>${g}</h2>${its.map(([s,i])=>`<div class="it"><div class="ph">${ilustra(s[0])}</div><div class="t"><b>${esc(s[0])}</b><i>⏱ ${durTxt(s[1])}</i></div><button type="button" data-i="${i}">+ Agendar</button></div>`).join('')}</div>`:''}).join('');
  box.querySelectorAll('button[data-i]').forEach(b=>b.onclick=()=>escolheServico(+b.dataset.i));
  document.getElementById('fluxo').hidden=true;document.getElementById('fab').hidden=false}
function escolheServico(i){
  const f=document.getElementById('fluxo'),s=document.getElementById('s');s.value=String(i);f.hidden=false;
  montaQuem();montaDias();desenhaSlots();f.scrollIntoView({behavior:'smooth',block:'start'})}
async function escolheUnidade(){
  const u=UN[un],aviso=document.getElementById('aviso'),resto=document.getElementById('resto');
  escolha=null;resto.hidden=true;aviso.innerHTML='<p class="small">Carregando os horários…</p>';
  try{await entrar();pub=(await get(ref(db,'publico/agenda/'+un))).val()||{}}
  catch(e){aviso.innerHTML='<div class="alert">Não foi possível carregar os horários. Confira a internet e tente de novo.</div>';return}
  if(!pub.cfg||pub.cfg.ativo!==true){aviso.innerHTML=`<div class="alert">O agendamento online ${u.de} ${u.n} não está disponível agora. Fale com a gente pelo WhatsApp.</div>`;return}
  aviso.innerHTML='';resto.hidden=false;
  document.getElementById('s').innerHTML=u.serv.map((x,i)=>`<option value="${i}">${esc(x[0])} · ${x[1]} min</option>`).join('');
  montaQuem();const d=document.getElementById('dias');montaDias();
  d.onchange=()=>{d.querySelectorAll('label').forEach(l=>l.classList.toggle('on',!!l.querySelector('input:checked')));desenhaSlots()};
  desenhaSlots();desenhaCatalogo()}

// Horários livres: dentro da abertura, no período, com vaga (menos atendimentos sobrepostos que o limite) e longe o bastante de agora.
function livres(data,dur,periodo,pro){
  const c=pub.cfg,ini=minDe(c.ini),fim=minDe(c.fim),passo=c.passo||30,oc=Object.values((pub.ocup||{})[data]||{}).map(x=>[minDe(x.h),minDe(x.h)+(x.m||30),x.p||'todos']);
  const agora=new Date(),hoje=iso(agora),limite=agora.getHours()*60+agora.getMinutes()+(c.antecH||0)*60,out=[];
  for(let t=ini;t+dur<=fim;t+=passo){
    if((periodo==='M')!==(t<720))continue;
    if(data===hoje&&t<limite)continue;
    if(oc.some(([a,b,p])=>a<t+dur&&b>t&&(p==='todos'||p===pro)))continue;
    out.push(t)}
  return out}
function desenhaSlots(){
  const u=UN[un],c=pub.cfg,box=document.getElementById('slots'),conf=document.getElementById('conf');
  escolha=null;conf.hidden=true;
  const dias=[...document.querySelectorAll('#dias input:checked')].map(i=>+i.value);
  if(!dias.length){box.innerHTML='<p class="small">Marque pelo menos um dia para ver os horários.</p>';return}
  const sv0=u.serv[+document.getElementById('s').value],dur=sv0[1],pro=proEscolhida(),per=document.querySelector('input[name=per]:checked').value,fech=c.fechados||[];
  const hoje=new Date();hoje.setHours(12,0,0,0);let html='',n=0;
  for(let i=0;i<=(c.dias||21);i++){const d=new Date(hoje);d.setDate(d.getDate()+i);const data=iso(d);
    if(!dias.includes(d.getDay())||fech.includes(data))continue;
    const L=livres(data,dur,per,pro);if(!L.length)continue;n+=L.length;
    html+=`<div class="dia">${fdata(data)}</div><div class="slots">${L.map(t=>`<button type="button" data-d="${data}" data-h="${hhmm(t)}">${hhmm(t)}</button>`).join('')}</div>`}
  box.innerHTML=n?html:'<p class="small">Não há horários livres nesses dias e período. Tente outro período ou outros dias.</p>';
  box.querySelectorAll('button').forEach(b=>b.onclick=()=>{box.querySelectorAll('button').forEach(x=>x.classList.remove('on'));b.classList.add('on');
    escolha={data:b.dataset.d,hora:b.dataset.h,dur,pro};
    document.getElementById('resumo').innerHTML=`<b>${fdata(escolha.data)} às ${escolha.hora}</b><br>${esc(u.serv[+document.getElementById('s').value][0])} · ${dur} min<br>${u.n} (${u.s})${donosDe(un,sv0[0]).length>1?'<br>Com '+NOME_PRO[pro]:''}<br>${esc(pub.cfg.endereco||u.e)}`;
    conf.hidden=false;conf.scrollIntoView({behavior:'smooth',block:'nearest'})})}
const erro=m=>{document.getElementById('erro').textContent=m};
// Só avisa a equipe (notificação no celular); se falhar, a reserva já está salva e a equipe a vê ao abrir o painel.
const avisarEquipe=c=>{try{fetch('/api/avisar',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(c),keepalive:true}).catch(()=>{})}catch(e){}};
async function enviar(){
  const v=id=>document.getElementById(id).value.trim(),u=UN[un];
  if(!escolha)return erro('Escolha um horário.');
  if(v('n').length<2)return erro('Falta o seu nome.');
  if(v('t').replace(/\D/g,'').length<10)return erro('Confira o WhatsApp: precisa do DDD.');
  const btn=document.getElementById('enviar');btn.disabled=true;btn.textContent='Marcando…';erro('');
  const sv=u.serv[+v('s')],reg={un,nome:v('n'),tel:v('t'),serv:sv[0],data:escolha.data,hora:escolha.hora,m:escolha.dur,
    nova:document.querySelector('input[name=nova]:checked').value==='sim',em:Date.now()};
  if(v('o'))reg.obs=v('o');
  let feito=false;
  // Cada profissional tem a sua vaga no horário: se alguém marcou com ela um instante antes, o banco recusa e a cliente escolhe outro.
  {const chave=`${escolha.data}_${escolha.hora.replace(':','')}_${VAGA[escolha.pro]||1}`;
    try{await set(ref(db,u.base+'/reservas/'+chave),reg);feito=true;avisarEquipe({tipo:'reserva',unit:un,chave});
      try{await set(ref(db,'publico/agenda/'+un+'/ocup/'+escolha.data+'/'+chave),{h:escolha.hora,m:escolha.dur,p:escolha.pro})}catch(e){}}
    catch(e){}}
  if(!feito){
    try{pub=(await get(ref(db,'publico/agenda/'+un))).val()||pub}catch(e){}
    btn.disabled=false;btn.textContent='Confirmar agendamento';desenhaSlots();
    return erro('Esse horário acabou de ser ocupado por outra pessoa. Escolha outro, por favor.')}
  const q=new URLSearchParams({s:sv[0],d:escolha.data,h:escolha.hora,m:String(escolha.dur),u:un==='flo'?'flo':'mai'});q.set('e',(pub&&pub.cfg&&pub.cfg.endereco)||u.e);if(donosDe(un,sv[0]).length>1)q.set('p',NOME_PRO[escolha.pro]);
  tela.innerHTML=`<div class="msg"><h2>Agendamento confirmado ✓</h2><p>${esc(reg.nome.split(' ')[0])}, você está marcada:</p>
   <div class="resumo" style="text-align:left"><b>${fdata(escolha.data)} às ${escolha.hora}</b><br>${esc(sv[0])}<br>${u.n} (${u.s})<br>${esc((pub&&pub.cfg&&pub.cfg.endereco)||u.e)}</div>
   <p><a class="btn p" style="display:block;text-decoration:none" href="/h?${q}">Salvar na minha agenda</a></p>
   <p class="small">Precisa mudar? É só nos chamar pelo WhatsApp. Se for a sua primeira vez, vamos te enviar uma ficha rápida para preencher antes do atendimento.</p></div>`}
formulario();
</script>
