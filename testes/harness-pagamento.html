function pagCentavos(txt){
  const s=String(txt==null?'':txt).replace(/[^\d,.-]/g,'').trim(); if(!s) return 0;
  // "2.000" é dois mil, não dois reais (o erro que já aconteceu no financeiro): ponto sozinho, em grupos de três, é milhar.
  const n=s.includes(',')?parseFloat(s.replace(/\./g,'').replace(',','.')):/^\d{1,3}(\.\d{3})+$/.test(s)?parseFloat(s.replace(/\./g,'')):parseFloat(s);

}

window.imprimirComprovante=async function(casoId,qual){

  if(!w){ alert('O navegador bloqueou a janela de impressão. Libere os pop-ups deste site e tente de novo.'); return; }
  w.document.write('<p style="font:16px sans-serif;padding:20px">Carregando o comprovante…</p>');
  try{
    const r=await fetch(GAS_URL,{method:'POST',body:JSON.stringify({acao:'pagamento-ver',casoId,qual})});
    const j=await r.json();
    if(!j||!j.ok) throw new Error((j&&j.erro)||'motivo desconhecido');
    const mime=String(j.mime||'');
    if(/pdf/i.test(mime)){
      // PDF: o próprio leitor do navegador imprime melhor (Ctrl+P)
      const bin=atob(j.base64), a=new Uint8Array(bin.length); for(let i=0;i<bin.length;i++) a[i]=bin.charCodeAt(i);
      w.location.href=URL.createObjectURL(new Blob([a],{type:'application/pdf'}));
      return;
    }
    const html=pagFolhaImpressao({src:'data:'+mime+';base64,'+j.base64,cliente:c.nome||'',ato:c.tipo||'',controle:c.controle||'',
      cobranca:qual==='escritura'?'escritura':'registro de imóveis',valor:pagMoeda(qual==='escritura'?p.escrituraCent:p.registroCent),

    w.document.open(); w.document.write(html); w.document.close();
    const img=w.document.querySelector('img');

// ── Os arquivos viram imagem leve para a página do cliente ──
async function pagImagemDe(file,maxLado=1500,q=.85){
  if(file.type==='application/pdf'||/\.pdf$/i.test(file.name||'')){
    if(!window.pdfjsLib) throw new Error('O leitor de PDF não carregou. Recarregue o painel ou anexe uma foto do documento.');
    const doc=await window.pdfjsLib.getDocument({data:await file.arrayBuffer()}).promise;
    const pg=await doc.getPage(1), v0=pg.getViewport({scale:1}), vp=pg.getViewport({scale:Math.min(3,maxLado/v0.width)});
    const cv=document.createElement('canvas'); cv.width=Math.round(vp.width); cv.height=Math.round(vp.height);
    const x=cv.getContext('2d'); x.fillStyle='#fff'; x.fillRect(0,0,cv.width,cv.height);
    await pg.render({canvasContext:x,viewport:vp}).promise;
    return cv.toDataURL('image/jpeg',q);
  }
  return await new Promise((ok,no)=>{
    const img=new Image(), url=URL.createObjectURL(file);
    img.onload=()=>{ const k=Math.min(1,maxLado/Math.max(img.width,img.height)); const cv=document.createElement('canvas'); cv.width=Math.round(img.width*k); cv.height=Math.round(img.height*k);
      const x=cv.getContext('2d'); x.fillStyle='#fff'; x.fillRect(0,0,cv.width,cv.height); x.drawImage(img,0,0,cv.width,cv.height); URL.revokeObjectURL(url); ok(cv.toDataURL('image/jpeg',q)); };
    img.onerror=()=>{ URL.revokeObjectURL(url); no(new Error('Não consegui abrir a imagem '+(file.name||''))); };
    img.src=url;
  });
}
const pagLerComoUrl=file=>new Promise((ok,no)=>{ const r=new FileReader(); r.onload=()=>ok(String(r.result)); r.onerror=no; r.readAsDataURL(file); });
// A imagem do orçamento que o cliente aprovou (a mesma "via do cliente"), se o card tiver um marcado assim.
// Os orçamentos do card que dá para mandar o cliente rever. O status "Aprovado pelo cliente" não é exigido (ela usa os status
// para outras coisas): ela escolhe a versão na janela; o que nasce marcado é o último com esse status, ou o mais recente.
function pagOrcamentosDoCaso(casoId){ return (typeof orcDoCaso==='function'?orcDoCaso(casoId):[]).filter(o=>o&&o.resultado); }
function pagOrcamentoPadrao(casoId){

  const a=l.filter(o=>o.status==='aceito'); return (a.length?a:l).slice(-1)[0]||null;
}
function pagOrcamentoEscolhido(casoId,id){ return id?pagOrcamentosDoCaso(casoId).find(o=>String(o.id)===String(id))||null:null; }
function pagImagemOrcamento(o){
  try{
    const cv=orcDesenharFolha(o,o.resultado), k=Math.min(1,1100/cv.width);
    const out=document.createElement('canvas'); out.width=Math.round(cv.width*k); out.height=Math.round(cv.height*k);
    const x=out.getContext('2d'); x.fillStyle='#fff'; x.fillRect(0,0,out.width,out.height); x.drawImage(cv,0,0,out.width,out.height);
    return out.toDataURL('image/jpeg',.85);
  }catch(_){ return null; }

// ── Ler o recibo e o boleto para preencher a janela ──
// Tudo o que a IA devolve é hipótese: só preenche o que as contas confirmam (o total do recibo contra a soma das
// parcelas; o valor e o vencimento do boleto saem da própria linha digitável, que tem dígitos verificadores).
const pagMod10=n=>{ let soma=0, peso=2; for(let i=n.length-1;i>=0;i--){ let p=(+n[i])*peso; if(p>9) p=Math.floor(p/10)+p%10; soma+=p; peso=peso===2?1:2; } return (10-soma%10)%10; };
function pagVencDeFator(fator,hoje=new Date()){
  const d=(base,n)=>new Date(base+n*864e5), antigo=d(Date.UTC(1997,9,7),fator), novo=d(Date.UTC(2025,1,22),fator-1000);
  const cand=fator>=1000?[antigo,novo]:[antigo];
  return cand.sort((a,b)=>Math.abs(a-hoje)-Math.abs(b-hoje))[0];
}
// A linha digitável de 47 dígitos: confere os três dígitos verificadores e devolve o valor e o vencimento que ela carrega.
function pagLerLinhaDigitavel(txt,hoje=new Date()){
  const n=String(txt||'').replace(/\D/g,''); if(n.length!==47) return null;
  const campos=[n.slice(0,10),n.slice(10,21),n.slice(21,32)];
  for(const c of campos){ if(pagMod10(c.slice(0,-1))!==+c.slice(-1)) return null; }
  const fator=+n.slice(33,37), centavos=+n.slice(37);
  const f=v=>v.replace(/^(\d{5})(\d{5})$/,'$1.$2');
  const formatada=f(n.slice(0,10))+' '+n.slice(10,15)+'.'+n.slice(15,21)+' '+n.slice(21,26)+'.'+n.slice(26,32)+' '+n[32]+' '+n.slice(33);
  let venc=''; if(fator>0){ const d=pagVencDeFator(fator,hoje); venc=String(d.getUTCDate()).padStart(2,'0')+'/'+String(d.getUTCMonth()+1).padStart(2,'0')+'/'+d.getUTCFullYear(); }
  return {linha:formatada,centavos,venc};
}
function pagAcharLinhaNoTexto(txt){
  const m=String(txt||'').match(/\d{5}[.\s]?\d{5}\s+\d{5}[.\s]?\d{6}\s+\d{5}[.\s]?\d{6}\s+\d\s+\d{14}/);
  return m?m[0]:'';
}
const pagCentDeTexto=v=>{ if(v==null||v==='') return null; const c=pagCentavos(String(v)); return c>0?c:null; };
// O recibo só vale se as contas fecham: os dois totais iguais e a soma das parcelas igual ao total.
function pagConferirRecibo(d){
  if(!d) return {ok:false,motivo:'A leitura não devolveu nada.'};
  const t1=pagCentDeTexto(d.total_das_custas), t2=pagCentDeTexto(d.total_recebido);
  const parc=Array.isArray(d.parcelas)?d.parcelas.map(pagCentDeTexto):[];
  if(!t1&&!t2) return {ok:false,motivo:'Não achei o total no recibo.'};
  if(t1&&t2&&t1!==t2) return {ok:false,motivo:'O "total das custas" e o "total recebido" saíram diferentes na leitura.'};
  const total=t1||t2;
  if(!parc.length||parc.some(x=>x==null)) return {ok:false,motivo:'Não consegui ler todas as linhas do recibo para conferir a soma.'};
  const soma=parc.reduce((a,b)=>a+b,0);
  if(soma!==total) return {ok:false,motivo:'A soma das linhas do recibo não bateu com o total.'};
  return {ok:true,centavos:total};
}
async function pagTextoDoPdf(file){
  try{
    if(!window.pdfjsLib||!(file.type==='application/pdf'||/\.pdf$/i.test(file.name||''))) return '';
    const doc=await window.pdfjsLib.getDocument({data:await file.arrayBuffer()}).promise, pg=await doc.getPage(1), tc=await pg.getTextContent();
    return tc.items.map(i=>i.str).join(' ');
  }catch(_){ return ''; }
}
async function pagPerguntarIA(tipo,file){
  const url=file.type==='application/pdf'||/\.pdf$/i.test(file.name||'')?(file.size<=5*1024*1024?await pagLerComoUrl(file):await pagImagemDe(file,1800,.9)):await pagImagemDe(file,1800,.9);
  const m=url.match(/^data:([^;]+);base64,(.*)$/); if(!m) throw new Error('Não consegui preparar o arquivo.');
  const ctl=new AbortController(), cortar=setTimeout(()=>ctl.abort(),45000);
  let j; try{
    const r=await fetch(GAS_URL,{method:'POST',body:JSON.stringify({acao:'pagamento-ler',tipo,mimetype:m[1],base64:m[2]}),signal:ctl.signal});
    j=await r.json();
  }catch(err){ throw new Error(err&&err.name==='AbortError'?'a leitura demorou demais':((err&&err.message)||err)); }
  finally{ clearTimeout(cortar); } if(!j.ok) throw new Error(j.erro||'A leitura falhou.'); return j.dados;
}
// Preenche só o que está em branco (o que ela digitou vale mais) e marca o que veio da leitura para ela conferir.
function pagPreencher(campo,valor){
  const e=pagEst; if(!e||!valor) return false;
  if(String(e[campo]||'').trim()) return false;
  e[campo]=valor; (e.lido=e.lido||{})[campo]=true; return true;
}
async function pagLerArquivo(alvo,f){
  const e=pagEst; if(!e) return;
  (e.lendo=e.lendo||{})[alvo]=true; (e.nota=e.nota||{})[alvo]=''; e.lido=e.lido||{}; if(alvo==='boleto'){ delete e.lido.benef; delete e.lido.cnpj; }
  pagDesenhar();
  let nota='';
  try{
    if(alvo==='recibo'){
      const ia=await pagPerguntarIA('recibo',f), c=pagConferirRecibo(ia);
      if(pagEst!==e||e.recibo!==f) return;
      if(c.ok){ nota=pagPreencher('valE',pagMoeda(c.centavos).replace(/^R\$\s*/,''))?'Valor lido do recibo e conferido (as linhas somam o total). Confira.':'Li o recibo, mas o valor já estava preenchido — não mexi.'; }
      else nota='Li o recibo, mas não preenchi o valor: '+c.motivo+' Digite o valor.';
    }else{
      const txtPdf=await pagTextoDoPdf(f);
      let linha=pagLerLinhaDigitavel(pagAcharLinhaNoTexto(txtPdf)), ia=null, aviso='';
      try{ ia=await pagPerguntarIA('boleto',f); }catch(err){ aviso=(err&&err.message)||''; }
      if(pagEst!==e||e.boleto!==f) return;
      if(!linha&&ia) linha=pagLerLinhaDigitavel(ia.linha_digitavel);
      const feitos=[];
      if(linha){
        if(pagPreencher('codigo',linha.linha)) feitos.push('código de barras');
        if(linha.centavos&&pagPreencher('valR',pagMoeda(linha.centavos).replace(/^R\$\s*/,''))) feitos.push('valor');
        if(linha.venc&&pagPreencher('venc',linha.venc)) feitos.push('vencimento');
      }
      if(!ia||!String(ia.beneficiario||'').trim()){
        const mb=txtPdf.match(/Benefici[aá]rio\s*:?\s*(.{3,80}?)\s*(?:CPF\/CNPJ|CNPJ|CPF|Ag[eê]ncia|Data|Nosso)/i), mc=txtPdf.match(/(\d{2}\.\d{3}\.\d{3}\/\d{4}-\d{2})/);
        if(mb||mc) ia=Object.assign({},ia||{},{beneficiario:(ia&&ia.beneficiario)||(mb&&mb[1])||'',cnpj:(ia&&ia.cnpj)||(mc&&mc[1])||''});
      }
      if(ia){
        const padrao=v=>!String(v||'').trim()||v===PAG_BENEFICIARIO.nome||v===PAG_BENEFICIARIO.cnpj||v===(pagLerMemoria().nome)||v===(pagLerMemoria().cnpj);
        const nb=String(ia.beneficiario||'').trim(), nc=String(ia.cnpj||'').trim();
        if(nb&&padrao(e.benef)&&nb!==e.benef){ e.benef=nb; e.lido.benef=true; feitos.push('beneficiário'); }
        if(nc&&padrao(e.cnpj)&&nc!==e.cnpj){ e.cnpj=nc; e.lido.cnpj=true; feitos.push('CNPJ'); }
      }
      nota=feitos.length?'Lido do boleto: '+feitos.join(', ')+'. Confira.':(linha||ia?'Li o boleto, mas não havia nada em branco para preencher.':'Não consegui ler o boleto'+(aviso?' ('+aviso+')':'')+'. Preencha à mão.');
      if(!e.lido.benef) nota+=' ⚠️ O beneficiário NÃO foi lido do boleto'+(aviso?' ('+aviso+')':'')+': o nome e o CNPJ abaixo são os de sempre. Corrija se este boleto for de outro beneficiário.';
      if(!linha&&ia) nota+=' O código de barras não passou na conferência dos dígitos: digite-o ou cole de novo um print mais nítido.';
    }
  }catch(err){
    if(pagEst!==e||e[alvo]!==f) return;
    nota='Não consegui ler automaticamente ('+((err&&err.message)||err)+'). Preencha à mão.';
  }
  e.lendo[alvo]=false; e.nota[alvo]=nota; pagDesenhar();
}

// ── O link do orçamento: o cliente vê a folha e toca em "Aprovo" ──
const orcLinkDe=tok=>(ENVIO_BASE_URL||location.origin).replace(/\/+$/,'')+'/o/'+tok;
window.orcLinkAprovacao=async function(casoId,orcId){
  const c=casos[casoId]||{}, o=pagOrcamentoEscolhido(casoId,orcId);
  if(!o){ alert('Não achei este orçamento.'); return; }
  const imagem=pagImagemOrcamento(o);
  if(!imagem){ alert('Não consegui desenhar a folha do orçamento. Abra o orçamento, confira os campos e tente de novo.'); return; }
  const token=codigoDeEnvio(), agora=Date.now(), link=orcLinkDe(token);
  try{
    await set(ref(db,'cobrancas/'+token),orcSemUndefined({meta:{tipo:'orcamento',casoId,orcId:String(o.id),versao:String(o.versao||''),criadoEm:agora,expiraEm:agora+15*864e5},dados:{nome:c.nome||'',ato:c.tipo||''},imagens:{orcamento:imagem}}));
    await set(ref(db,'casos/'+casoId+'/orcLink'),orcSemUndefined({token,orcId:String(o.id),versao:String(o.versao||''),criadoEm:agora}));
  }catch(err){
    const negado=/permission|PERMISSION/.test(String(err&&err.message||err));
    alert(negado?'O banco recusou a gravação. As regras do Firebase com o caminho /cobrancas precisam estar publicadas (FIREBASE.md).':'Não consegui gerar o link: '+((err&&err.message)||err)); return;
  }
  const msg=`Olá! Para conferir e aprovar o seu orçamento, abra este link pelo celular:\n${link}\n\n20º Tabelião de Notas`;
  window.__ultimoLinkOrc={link,msg};
  try{ await navigator.clipboard.writeText(msg); finToast('Link do orçamento copiado. É só colar no WhatsApp.'); }catch(_){ prompt('Copie o texto e envie ao cliente:',msg); }
};

// ── A janela de gerar o link ──
let pagEst=null;
function pagLerMemoria(){ try{ return JSON.parse(localStorage.getItem('painel_pag_benef')||'null')||{}; }catch(_){ return {}; } }
window.abrirPagamento=function(id){ try{ pagAbrir(id); }catch(err){ console.error(err); alert('Não consegui abrir a janela de pagamento: '+((err&&err.message)||err)); } };
function pagAbrir(id){
  const c=casos[id]||{}, orc=pagOrcamentoPadrao(id);
  const mem=pagLerMemoria();
  pagEst={id,itens:'ambos',valE:'',valR:'',venc:'',codigo:'',benef:mem.nome||PAG_BENEFICIARIO.nome,cnpj:mem.cnpj||PAG_BENEFICIARIO.cnpj,recibo:null,boleto:null,orcId:orc?String(orc.id):'',erro:'',gerando:false,link:'',msg:''};
  document.getElementById('pag-sub').textContent=(c.nome||'Sem nome')+(c.tipo?' — '+c.tipo:'');
  pagDesenhar();
  document.getElementById('modal-pagamento').classList.add('open');
}
window.fecharPagamento=function(){ document.getElementById('modal-pagamento').classList.remove('open'); pagEst=null; };
function pagDesenhar(){
  const e=pagEst; if(!e) return;
  const esc1=e.itens!=='registro', reg1=e.itens!=='escritura';
  const opt=(v,r)=>`<label class="pag-op"><input type="radio" name="pag-itens" value="${v}"${e.itens===v?' checked':''}> ${r}</label>`;
  const campo=(r,id,val,ph,extra='')=>`<div class="pag-campo"><label class="fin-rot" for="${id}">${r}${e.lido&&e.lido[{'pag-valE':'valE','pag-valR':'valR','pag-venc':'venc','pag-codigo':'codigo','pag-benef':'benef','pag-cnpj':'cnpj'}[id]]?' <small class="pag-lido">· lido do documento — confira</small>':''}</label><input class="fin-input" id="${id}" value="${esc(val)}" placeholder="${esc(ph||'')}" ${extra}></div>`;
  const arq=(r,id,f,obrig)=>{
    const alvo=id==='pag-recibo'?'recibo':'boleto', url=f?pagUrlDe(f):'';
    return `<div class="pag-campo"><label class="fin-rot">${r}${obrig?' <b style="color:#C0392B">*</b>':''}</label>
      <div class="pag-cola${f?' ok':''}${e.alvoPaste===alvo?' ativo':''}" tabindex="0" data-alvo="${alvo}">${f
        ?(f.type&&f.type.startsWith('image/')?`<img src="${esc(url)}" alt="">`:'')+`<div><b>✓ ${esc(f.name)}</b><span>Para trocar, clique aqui e cole outro print (Ctrl+V)</span></div>`
        :`<div><b>Clique aqui e aperte Ctrl+V para colar o print</b><span>Ou arraste o arquivo para cá</span></div>`}</div>
      <label class="pag-ou">ou <u>escolher um arquivo</u> (foto ou PDF)<input type="file" id="${id}" accept="image/*,application/pdf" hidden></label>${e.lendo&&e.lendo[alvo]?'<div class="pag-nota">⏳ Lendo o documento para preencher os campos…</div>':(e.nota&&e.nota[alvo]?`<div class="pag-nota">${esc(e.nota[alvo])}</div>`:'')}</div>`;
  };
  document.getElementById('pag-conteudo').innerHTML=`
    <div class="pag-bloco"><div class="fin-rot" style="margin-bottom:6px">O que vai neste link</div>${opt('ambos','Escritura e registro')} ${opt('escritura','Só a escritura')} ${opt('registro','Só o registro')}</div>
    ${esc1?`<div class="pag-bloco"><div class="pag-tit">1 · Escritura — 20º Tabelião de Notas</div>${campo('Valor a pagar (R$)','pag-valE',e.valE,'3.039,89','inputmode="decimal"')}${arq('Recibo do cartório (PDF ou foto)','pag-recibo',e.recibo,true)}</div>`:''}
    ${reg1?`<div class="pag-bloco"><div class="pag-tit">${esc1?'2':'1'} · Registro de imóveis — boleto</div>${campo('Valor do boleto (R$)','pag-valR',e.valR,'3.868,07','inputmode="decimal"')}${campo('Vencimento (dd/mm/aaaa)','pag-venc',e.venc,'23/10/2026','inputmode="numeric" maxlength="10"')}${campo('Código de barras (linha digitável)','pag-codigo',e.codigo,'26091.90299 37227.373505 …')}${campo('Beneficiário, como aparece no boleto','pag-benef',e.benef,'')}${campo('CNPJ do beneficiário','pag-cnpj',e.cnpj,'')}${arq('Boleto (PDF ou foto)','pag-boleto',e.boleto,true)}</div>`:''}
    <div class="pag-bloco"><div class="fin-rot" style="margin-bottom:6px">Orçamento para o cliente rever</div>${(()=>{ const l=pagOrcamentosDoCaso(e.id); if(!l.length) return '<div style="font-size:13px">Este card ainda não tem orçamento salvo: o botão de rever o orçamento não aparece na página.</div>'; return `<select class="fin-input" id="pag-orc" style="width:100%"><option value="">Nenhum (sem o botão de rever o orçamento)</option>${l.map(o=>`<option value="${esc(String(o.id))}"${String(o.id)===String(e.orcId)?' selected':''}>Versão ${esc(String(o.versao))} — ${esc((typeof orcStatus==='function'?orcStatus(o.status).rot:o.status)||'')}${((casos[e.id]||{}).orcAprovacao||{}).orcId===String(o.id)?' — ✅ aprovada pelo cliente no link':''}</option>`).join('')}</select>`; })()}</div>
    ${e.erro?`<div class="pag-erro">${esc(e.erro)}</div>`:''}
    <div class="pag-acoes"><button type="button" class="cx-btn destaque" id="pag-gerar"${e.gerando?' disabled':''}>${e.gerando?(e.lendo&&(e.lendo.recibo||e.lendo.boleto)?'Lendo os documentos…':'Gerando…'):(e.link?'Atualizar o link':'Gerar link')}</button></div>
    ${e.link?`<div class="pag-bloco"><div class="fin-rot">Link de pagamento (vale por 15 dias)</div><input class="fin-input" readonly value="${esc(e.link)}" onclick="this.select()" style="width:100%">
      <div class="fin-rot" style="margin-top:10px">A mensagem <small>(pode editar antes de enviar)</small></div><textarea id="pag-msg" class="fin-input" style="width:100%;min-height:110px">${escTxt(e.msg)}</textarea>
      <div class="pag-acoes"><button type="button" class="cx-btn destaque" data-pag="copiar">Copiar texto</button><button type="button" class="cx-btn" data-pag="zap">WhatsApp</button></div></div>`:''}`;
}
// Colar o print (Ctrl+V) ou arrastar o arquivo, no lugar de procurá-lo no computador.
const pagUrls=new WeakMap();
function pagUrlDe(f){ let u=pagUrls.get(f); if(!u){ u=URL.createObjectURL(f); pagUrls.set(f,u); } return u; }
function pagProximoAlvo(){
  const e=pagEst; if(!e) return null;
  if(e.alvoPaste&&((e.alvoPaste==='recibo'&&e.itens!=='registro')||(e.alvoPaste==='boleto'&&e.itens!=='escritura'))) return e.alvoPaste;
  if(e.itens!=='registro'&&!e.recibo) return 'recibo';
  if(e.itens!=='escritura'&&!e.boleto) return 'boleto';
  return e.itens==='registro'?'boleto':'recibo';
}
// Depois de guardar, o "onde colar" volta ao automático: o próximo print vai para o que ainda falta, e não por cima do que acabou de entrar.
function pagGuardarArquivo(alvo,f){ if(!pagEst||!f) return; pagEst[alvo]=f; pagEst.alvoPaste=null; pagEst.erro=''; pagDesenhar(); pagLerArquivo(alvo,f); }
document.addEventListener('paste',ev=>{
  if(!pagEst) return;
  const it=[...(ev.clipboardData&&ev.clipboardData.items||[])].find(x=>x.kind==='file'&&/^image\//.test(x.type));
  if(!it) return;
  const blob=it.getAsFile(); if(!blob) return;
  const alvo=pagProximoAlvo(); if(!alvo) return;
  ev.preventDefault();
  const ext=(blob.type.split('/')[1]||'png').replace('jpeg','jpg');
  pagGuardarArquivo(alvo,new File([blob],'print-'+alvo+'-'+new Date().toISOString().slice(0,10)+'.'+ext,{type:blob.type}));
});
document.addEventListener('dragover',ev=>{ if(pagEst&&ev.target.closest&&ev.target.closest('.pag-cola')) ev.preventDefault(); });
document.addEventListener('drop',ev=>{
  const z=pagEst&&ev.target.closest&&ev.target.closest('.pag-cola'); if(!z) return;
  ev.preventDefault(); const f=ev.dataTransfer&&ev.dataTransfer.files&&ev.dataTransfer.files[0];
  if(f&&(/^image\//.test(f.type)||f.type==='application/pdf')) pagGuardarArquivo(z.dataset.alvo,f);
});
document.addEventListener('focusin',ev=>{ const z=pagEst&&ev.target.closest&&ev.target.closest('.pag-cola'); if(z) pagEst.alvoPaste=z.dataset.alvo; });
document.addEventListener('click',ev=>{ const z=pagEst&&ev.target.closest&&ev.target.closest('.pag-cola'); if(z){ pagEst.alvoPaste=z.dataset.alvo; document.querySelectorAll('.pag-cola').forEach(x=>x.classList.toggle('ativo',x===z)); z.focus(); } });
document.addEventListener('input',ev=>{
  if(!pagEst) return; const t=ev.target, m={ 'pag-valE':'valE','pag-valR':'valR','pag-venc':'venc','pag-codigo':'codigo','pag-benef':'benef','pag-cnpj':'cnpj' }[t.id];
  if(m){ pagEst[m]=t.value; return; }
  if(t.id==='pag-msg') pagEst.msg=t.value;
});
document.addEventListener('change',ev=>{
  if(!pagEst) return; const t=ev.target;
  if(t.id==='pag-orc'){ pagEst.orcId=t.value; return; }
  if(t.name==='pag-itens'){ pagEst.itens=t.value; pagEst.erro=''; pagDesenhar(); return; }
  if(t.id==='pag-recibo'||t.id==='pag-boleto'){ const f=t.files&&t.files[0]; if(f){ pagGuardarArquivo(t.id==='pag-recibo'?'recibo':'boleto',f); } }
});
document.addEventListener('click',async ev=>{
  const b=ev.target.closest('button'); if(!b||!pagEst) return;
  if(b.id==='pag-gerar') return pagGerarLink();
  if(b.dataset.pag==='copiar'){ const m=pagEst.msg; try{ await navigator.clipboard.writeText(m); finToast('Texto copiado. É só colar.'); }catch(_){ prompt('Copie o texto:',m); } }
  if(b.dataset.pag==='zap') window.open('https://wa.me/?text='+encodeURIComponent(pagEst.msg),'_blank','noopener');
});
async function pagGerarLink(){
  const e=pagEst; if(!e||e.gerando) return;
  const c=casos[e.id]||{}, comE=e.itens!=='registro', comR=e.itens!=='escritura';
  // Se a leitura ainda corre, espera; se ela anexou e os campos continuam vazios, tenta ler de novo antes de reclamar.
  e.erro=''; e.gerando=true; pagDesenhar();
  for(let i=0;i<300&&pagEst===e&&e.lendo&&(e.lendo.recibo||e.lendo.boleto);i++) await new Promise(r=>setTimeout(r,200));
  if(pagEst!==e) return;
  if(comE&&e.recibo&&!pagCentavos(e.valE)) await pagLerArquivo('recibo',e.recibo);
  if(comR&&e.boleto&&(!pagCentavos(e.valR)||!pagVencOk(e.venc)||!String(e.codigo).replace(/\D/g,''))) await pagLerArquivo('boleto',e.boleto);
  if(pagEst!==e) return;
  e.gerando=false;
  const valE=comE?pagCentavos(e.valE):0, valR=comR?pagCentavos(e.valR):0;
  const falta=[];
  if(comE){ if(!valE) falta.push('o valor da escritura'); if(!e.recibo&&!(c.pagamento&&c.pagamento.itens&&c.pagamento.itens.escritura&&e.link)) falta.push('o recibo do cartório'); }
  if(comR){ if(!valR) falta.push('o valor do boleto'); if(!pagVencOk(e.venc)) falta.push('o vencimento (dd/mm/aaaa)'); if(!String(e.codigo).replace(/\D/g,'')) falta.push('o código de barras'); if(!e.boleto&&!e.link) falta.push('o boleto'); }
  if(falta.length){ e.erro='Falta '+falta.join(', ')+'.'; pagDesenhar(); return; }
  e.erro=''; e.gerando=true; pagDesenhar();
  try{
    const imagens={};
    if(e.recibo) imagens.recibo=await pagImagemDe(e.recibo);
    if(e.boleto){ imagens.boleto=await pagImagemDe(e.boleto); if(e.boleto.size<=700*1024&&(e.boleto.type==='application/pdf'||/\.pdf$/i.test(e.boleto.name))) imagens.boletoPdf=await pagLerComoUrl(e.boleto); }
    const orc=pagOrcamentoEscolhido(e.id,e.orcId); if(orc){ const im=pagImagemOrcamento(orc); if(im) imagens.orcamento=im; }
    const agora=Date.now(), anterior=c.pagamento, reaproveita=!!(anterior&&anterior.token&&anterior.status!=='recebido'&&e.link);
    const token=reaproveita?anterior.token:codigoDeEnvio();
    const itens={escritura:comE,registro:comR};
    const dados=orcSemUndefined({nome:c.nome||'',ato:c.tipo||'',escritura:comE?{valorCent:valE}:null,registro:comR?{valorCent:valR,venc:e.venc,codigo:String(e.codigo).trim(),beneficiario:String(e.benef).trim(),cnpj:String(e.cnpj).trim()}:null});
    try{
      if(reaproveita) await update(ref(db,'cobrancas/'+token),{'meta/itens':itens,'meta/expiraEm':agora+15*864e5,'dados':dados,...Object.fromEntries(Object.entries(imagens).map(([k,v])=>['imagens/'+k,v]))});
      else await set(ref(db,'cobrancas/'+token),{meta:{casoId:e.id,criadoEm:agora,expiraEm:agora+15*864e5,itens},dados,imagens});
      await set(ref(db,'casos/'+e.id+'/pagamento'),orcSemUndefined({token,criadoEm:reaproveita&&anterior.criadoEm||agora,itens,escrituraCent:valE||null,registroCent:valR||null,venc:comR?e.venc:null,status:'aguardando'}));
    }catch(err){
      const negado=/permission|PERMISSION/.test(String(err&&err.message||err));
      throw new Error(negado?'O banco recusou a gravação. As regras novas do Firebase (com o caminho /cobrancas) ainda não foram publicadas: o passo está no FIREBASE.md.':'Não consegui gravar a cobrança: '+((err&&err.message)||err));
    }
    if(comR){ try{ localStorage.setItem('painel_pag_benef',JSON.stringify({nome:e.benef,cnpj:e.cnpj})); }catch(_){} }
    e.link=pagLinkDe(token); e.msg=pagMensagem(e.itens,e.link);
  }catch(err){ e.erro=(err&&err.message)||String(err); }
  e.gerando=false; pagDesenhar();
}


window.__casos=()=>casos; window.__setCasos=c=>{casos=c;};
