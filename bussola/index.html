<!doctype html>
<html lang="pt-BR" data-palette="rose">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Bússola — seu planner</title>
<!-- Aplicativo próprio, separado do painel. Caminhos relativos: servem em
     /bussola/ no domínio do painel e na raiz do projeto próprio da Vercel. -->
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#FBF3F4">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Bússola">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500&family=Quicksand:wght@400;500;600;700&family=Parisienne&family=Dancing+Script:wght@500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --radius-lg: 22px;
    --radius-md: 16px;
    --radius-sm: 10px;
    --font-display: 'Cormorant Garamond', Georgia, serif;
    --font-script: 'Parisienne', cursive;
    --font-body: 'Quicksand', -apple-system, BlinkMacSystemFont, sans-serif;
  }

  /* ---------- ROSÉ ---------- */
  [data-palette="rose"] {
    --bg: #FBF3F4; --surface: #FFFFFF; --surface-2: #FDF6F7;
    --ink: #3B2A2E; --muted: #8B6B70; --muted-2: #D3B7BC; --line: #F0DEE1;
    --personal: #C6567A; --personal-soft: #F8E1E7;
    --professional: #8B6FB0; --professional-soft: #EDE5F5;
    --accent: #C98A34; --accent-soft: #FBEFD9;
    --done: #8CAE86; --done-soft: #E7F0E3;
    --shadow: 0 1px 2px rgba(198,86,122,0.07), 0 10px 26px rgba(198,86,122,0.09);
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    [data-palette="rose"]:not([data-theme="light"]) {
      --bg: #241A1D; --surface: #2E2126; --surface-2: #34252B;
      --ink: #F3E6E9; --muted: #C6A3AA; --muted-2: #7A5A60; --line: #43323A;
      --personal: #E58AA8; --personal-soft: #3F2530;
      --professional: #B79EDB; --professional-soft: #39304C;
      --accent: #E8C173; --accent-soft: #4A3B24;
      --done: #A9CC9E; --done-soft: #2C3B27;
      --shadow: 0 1px 2px rgba(0,0,0,0.25), 0 10px 26px rgba(0,0,0,0.28);
      color-scheme: dark;
    }
  }
  [data-palette="rose"][data-theme="dark"] {
    --bg: #241A1D; --surface: #2E2126; --surface-2: #34252B;
    --ink: #F3E6E9; --muted: #C6A3AA; --muted-2: #7A5A60; --line: #43323A;
    --personal: #E58AA8; --personal-soft: #3F2530;
    --professional: #B79EDB; --professional-soft: #39304C;
    --accent: #E8C173; --accent-soft: #4A3B24;
    --done: #A9CC9E; --done-soft: #2C3B27;
    --shadow: 0 1px 2px rgba(0,0,0,0.25), 0 10px 26px rgba(0,0,0,0.28);
    color-scheme: dark;
  }

  /* ---------- LAVANDA ---------- */
  [data-palette="lavanda"] {
    --bg: #F5F3FA; --surface: #FFFFFF; --surface-2: #FAF8FD;
    --ink: #332E3D; --muted: #7D7590; --muted-2: #CFC5E5; --line: #E4DFF1;
    --personal: #9C6FB8; --personal-soft: #EEE1F5;
    --professional: #5E7FA3; --professional-soft: #E1EAF3;
    --accent: #C99A50; --accent-soft: #F5E9D3;
    --done: #7FA88A; --done-soft: #E4F0E6;
    --shadow: 0 1px 2px rgba(92,72,138,0.07), 0 10px 26px rgba(92,72,138,0.09);
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    [data-palette="lavanda"]:not([data-theme="light"]) {
      --bg: #1E1B27; --surface: #282433; --surface-2: #2E293B;
      --ink: #EDE9F5; --muted: #B3A9C9; --muted-2: #665D7E; --line: #3B354B;
      --personal: #C79FDE; --personal-soft: #3A2E48;
      --professional: #8FADCF; --professional-soft: #2A3947;
      --accent: #E0B872; --accent-soft: #463823;
      --done: #9FC7A9; --done-soft: #253A2B;
      --shadow: 0 1px 2px rgba(0,0,0,0.25), 0 10px 26px rgba(0,0,0,0.28);
      color-scheme: dark;
    }
  }
  [data-palette="lavanda"][data-theme="dark"] {
    --bg: #1E1B27; --surface: #282433; --surface-2: #2E293B;
    --ink: #EDE9F5; --muted: #B3A9C9; --muted-2: #665D7E; --line: #3B354B;
    --personal: #C79FDE; --personal-soft: #3A2E48;
    --professional: #8FADCF; --professional-soft: #2A3947;
    --accent: #E0B872; --accent-soft: #463823;
    --done: #9FC7A9; --done-soft: #253A2B;
    --shadow: 0 1px 2px rgba(0,0,0,0.25), 0 10px 26px rgba(0,0,0,0.28);
    color-scheme: dark;
  }

  /* ---------- PÊSSEGO ---------- */
  [data-palette="pessego"] {
    --bg: #FDF4EE; --surface: #FFFFFF; --surface-2: #FCF0E7;
    --ink: #3E2E28; --muted: #93705F; --muted-2: #E3C4B3; --line: #F2DFD1;
    --personal: #D97A5C; --personal-soft: #FBE5DB;
    --professional: #4F8583; --professional-soft: #E1EDEA;
    --accent: #CE9A3A; --accent-soft: #F7EAD1;
    --done: #8FAE7C; --done-soft: #E9F1E3;
    --shadow: 0 1px 2px rgba(217,122,92,0.08), 0 10px 26px rgba(217,122,92,0.10);
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    [data-palette="pessego"]:not([data-theme="light"]) {
      --bg: #241C17; --surface: #2E241D; --surface-2: #332920;
      --ink: #F5E7DE; --muted: #CBA895; --muted-2: #7A5F4F; --line: #42342A;
      --personal: #E89A7D; --personal-soft: #3F2A20;
      --professional: #7FB0AD; --professional-soft: #243B39;
      --accent: #E0B860; --accent-soft: #463521;
      --done: #A9CC9E; --done-soft: #2C3B27;
      --shadow: 0 1px 2px rgba(0,0,0,0.25), 0 10px 26px rgba(0,0,0,0.28);
      color-scheme: dark;
    }
  }
  [data-palette="pessego"][data-theme="dark"] {
    --bg: #241C17; --surface: #2E241D; --surface-2: #332920;
    --ink: #F5E7DE; --muted: #CBA895; --muted-2: #7A5F4F; --line: #42342A;
    --personal: #E89A7D; --personal-soft: #3F2A20;
    --professional: #7FB0AD; --professional-soft: #243B39;
    --accent: #E0B860; --accent-soft: #463521;
    --done: #A9CC9E; --done-soft: #2C3B27;
    --shadow: 0 1px 2px rgba(0,0,0,0.25), 0 10px 26px rgba(0,0,0,0.28);
    color-scheme: dark;
  }

  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg);
    color: var(--ink);
    font-family: var(--font-body);
    font-weight: 500;
    -webkit-font-smoothing: antialiased;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
    padding-left: env(safe-area-inset-left, 0px);
    padding-right: env(safe-area-inset-right, 0px);
    transition: background .25s ease, color .25s ease;
  }
  html { scroll-padding-top: env(safe-area-inset-top, 0px); }
  a { color: inherit; }

  h1, h2, h3, .range-label, .month-title, .week-day-num, .day-label-text {
    font-family: var(--font-display);
    font-weight: 600;
  }

  .shell { max-width: 1180px; margin: 0 auto; padding: 18px 20px 64px; }

  /* ---------- Header ---------- */
  header.topbar {
    position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20;
    background: var(--bg); padding: 8px 0 16px;
    display: flex; align-items: center; justify-content: space-between; gap: 16px; flex-wrap: wrap;
  }
  .brand-block { display: flex; align-items: center; gap: 10px; }
  .brand-sprig { width: 30px; height: 30px; flex-shrink: 0; color: var(--personal); opacity: 0.85; }
  .brand-text { display: flex; flex-direction: column; line-height: 1; }
  .brand { font-family: var(--font-script); font-size: 34px; font-weight: 400; color: var(--personal); line-height: 1; }
  .today-date { color: var(--muted); font-size: 13px; text-transform: capitalize; font-weight: 600; margin-top: 2px; }

  .header-right { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }

  .palette-picker { display: inline-flex; gap: 7px; align-items: center; background: var(--surface); border: 1px solid var(--line); border-radius: 999px; padding: 6px 8px; box-shadow: var(--shadow); }
  .palette-swatch {
    width: 22px; height: 22px; border-radius: 50%; border: 2px solid transparent; cursor: pointer; padding: 0;
    position: relative; flex-shrink: 0;
  }
  .palette-swatch[data-p="rose"] { background: linear-gradient(135deg,#C6567A,#F8E1E7); }
  .palette-swatch[data-p="lavanda"] { background: linear-gradient(135deg,#9C6FB8,#EEE1F5); }
  .palette-swatch[data-p="pessego"] { background: linear-gradient(135deg,#D97A5C,#FBE5DB); }
  .palette-swatch[aria-pressed="true"] { border-color: var(--ink); }

  .view-switch {
    display: inline-flex; background: var(--surface); border: 1px solid var(--line);
    border-radius: 999px; padding: 4px; gap: 2px; box-shadow: var(--shadow);
  }
  .view-switch button {
    border: none; background: transparent; color: var(--muted); font-family: var(--font-body);
    font-size: 14px; font-weight: 600; padding: 8px 16px; border-radius: 999px; cursor: pointer;
    transition: background .15s ease, color .15s ease;
  }
  .view-switch button[aria-pressed="true"] { background: var(--personal); color: var(--surface); }

  /* ---------- Quick capture ---------- */
  .quickcapture {
    background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius-lg);
    box-shadow: var(--shadow); padding: 11px 12px; display: flex; align-items: center; gap: 8px;
    margin-bottom: 22px; flex-wrap: wrap;
  }
  .quickcapture input[type="text"] {
    flex: 1 1 220px; min-width: 0; border: none; background: transparent; font-size: 16px;
    font-family: var(--font-body); font-weight: 500; color: var(--ink); padding: 10px 8px; outline: none;
  }
  .quickcapture input::placeholder { color: var(--muted-2); }

  .cat-toggle { display: inline-flex; border: 1px solid var(--line); border-radius: 999px; padding: 3px; gap: 2px; }
  .cat-toggle button {
    border: none; cursor: pointer; font-size: 13px; font-weight: 600; font-family: var(--font-body);
    padding: 7px 13px; border-radius: 999px; background: transparent; color: var(--muted);
  }
  .cat-toggle button[data-active="true"][data-cat="pessoal"] { background: var(--personal-soft); color: var(--personal); }
  .cat-toggle button[data-active="true"][data-cat="profissional"] { background: var(--professional-soft); color: var(--professional); }

  .btn-add {
    border: none; background: var(--personal); color: var(--surface); font-weight: 700; font-size: 14px;
    font-family: var(--font-body); padding: 11px 20px; border-radius: 999px; cursor: pointer; white-space: nowrap;
    transition: transform .1s ease;
  }
  .btn-add:active { transform: scale(0.96); }

  /* ---------- Panels ---------- */
  .panel {
    background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius-lg);
    box-shadow: var(--shadow); padding: 20px 20px 18px;
  }
  .panel h2 {
    margin: 0 0 14px; font-size: 19px; font-weight: 600; letter-spacing: .01em;
    display: flex; align-items: center; justify-content: space-between; color: var(--ink);
  }
  .panel h2 .hint { font-size: 12px; color: var(--muted); font-weight: 600; font-family: var(--font-body); }

  .empty { color: var(--muted); font-size: 13.5px; padding: 14px 4px; line-height: 1.55; font-style: italic; font-family: var(--font-display); font-size: 16px; }

  /* ---------- Day view grid ---------- */
  .day-grid { display: grid; grid-template-columns: 1.3fr 1fr; gap: 16px; align-items: start; }
  .day-left, .day-right { display: flex; flex-direction: column; gap: 16px; }

  .focus-list { display: flex; flex-direction: column; gap: 9px; }
  .focus-slot {
    display: flex; align-items: center; gap: 12px; border: 1.5px dashed var(--line);
    border-radius: var(--radius-md); padding: 12px 14px; min-height: 52px;
  }
  .focus-slot.filled { border-style: solid; border-color: var(--line); background: var(--surface-2); }
  .focus-num { font-family: var(--font-display); font-weight: 700; font-size: 19px; color: var(--muted-2); width: 22px; text-align: center; flex-shrink: 0; }
  .focus-slot.filled .focus-num { color: var(--accent); }
  .focus-text { flex: 1; font-size: 14.5px; font-weight: 500; }
  .focus-text.done { text-decoration: line-through; color: var(--muted); }
  .focus-empty-label { color: var(--muted-2); font-size: 13.5px; font-style: italic; font-family: var(--font-display); }

  .timeline { display: flex; flex-direction: column; gap: 10px; }
  .appt-row { display: flex; align-items: flex-start; gap: 12px; padding: 10px 4px; border-bottom: 1px solid var(--line); }
  .appt-row:last-child { border-bottom: none; }
  .appt-time { font-weight: 700; font-size: 13.5px; color: var(--muted); width: 48px; flex-shrink: 0; padding-top: 1px; font-family: var(--font-body); }
  .appt-dot { width: 9px; height: 9px; border-radius: 50%; margin-top: 5px; flex-shrink: 0; }
  .appt-dot.pessoal { background: var(--personal); }
  .appt-dot.profissional { background: var(--professional); }
  .appt-body { flex: 1; min-width: 0; }
  .appt-title { font-size: 14.5px; font-weight: 600; }
  .appt-meta { font-size: 12px; color: var(--muted); margin-top: 2px; display: flex; gap: 6px; align-items: center; font-weight: 600; }
  .painel-sync { display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--muted); font-weight: 600; margin: -4px 0 8px; flex-wrap: wrap; }
  .painel-sync.falhou { color: var(--personal); }
  .painel-sync button { background: none; border: 1px solid var(--professional-soft); color: var(--professional); border-radius: 999px; padding: 2px 10px; font: inherit; cursor: pointer; }
  .painel-sync button:disabled { opacity: .5; cursor: default; }
  .src-chip { font-size: 10.5px; font-weight: 700; color: var(--professional); background: var(--professional-soft); padding: 1px 7px; border-radius: 999px; }
  .row-del { border: none; background: transparent; color: var(--muted-2); cursor: pointer; font-size: 13px; padding: 4px 6px; border-radius: 6px; flex-shrink: 0; }
  .row-del:hover { color: var(--personal); }

  .mini-form { display: none; flex-wrap: wrap; gap: 8px; margin-top: 12px; padding-top: 12px; border-top: 1px solid var(--line); }
  .mini-form.open { display: flex; }
  .mini-form input, .mini-form select {
    font-family: var(--font-body); font-weight: 500; font-size: 13.5px; padding: 8px 10px;
    border: 1px solid var(--line); border-radius: var(--radius-sm); background: var(--surface-2); color: var(--ink);
  }
  .mini-form input[type="text"] { flex: 1 1 160px; }
  .mini-form input[type="date"] { flex: 1 1 130px; }
  .mini-form input[type="time"] { flex: 0 1 100px; }
  .ghost-btn {
    border: 1px solid var(--line); background: transparent; color: var(--personal); font-size: 12.5px; font-weight: 700;
    font-family: var(--font-body); padding: 7px 14px; border-radius: 999px; cursor: pointer;
  }
  .ghost-btn:hover { background: var(--personal-soft); }

  .filter-chips { display: flex; gap: 6px; }
  .filter-chips button {
    border: 1px solid var(--line); background: transparent; color: var(--muted); font-size: 12px; font-weight: 700;
    font-family: var(--font-body); padding: 5px 12px; border-radius: 999px; cursor: pointer;
  }
  .filter-chips button[aria-pressed="true"] { background: var(--surface-2); color: var(--ink); border-color: var(--muted-2); }

  .task-list { display: flex; flex-direction: column; }
  .task-row { display: flex; align-items: center; gap: 10px; padding: 10px 2px; border-bottom: 1px solid var(--line); }
  .task-row:last-child { border-bottom: none; }
  .task-check {
    width: 22px; height: 22px; border-radius: 8px; border: 1.5px solid var(--muted-2); flex-shrink: 0; cursor: pointer;
    display: flex; align-items: center; justify-content: center; background: var(--surface); transition: transform .12s ease;
    font-size: 13px; color: var(--surface);
  }
  .task-check:active { transform: scale(0.88); }
  .task-check.done { background: var(--done); border-color: var(--done); }
  .task-text { flex: 1; font-size: 14px; font-weight: 500; min-width: 0; overflow-wrap: anywhere; }
  .task-text.done { text-decoration: line-through; color: var(--muted); }
  .task-cat-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
  .task-cat-dot.pessoal { background: var(--personal); }
  .task-cat-dot.profissional { background: var(--professional); }
  .star-btn { border: none; background: transparent; cursor: pointer; font-size: 15px; color: var(--line); flex-shrink: 0; padding: 2px; }
  .star-btn.active { color: var(--accent); }

  .overdue-banner { font-size: 12.5px; font-weight: 600; color: var(--accent); background: var(--accent-soft); padding: 9px 13px; border-radius: var(--radius-sm); margin-bottom: 10px; }

  .notes-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 10px; }
  .note-card {
    background: var(--accent-soft); border-radius: var(--radius-md); padding: 13px;
    font-size: 13px; font-weight: 500; line-height: 1.5; position: relative; min-height: 72px;
    display: flex; flex-direction: column; justify-content: space-between; gap: 8px;
    transform: rotate(-0.4deg);
  }
  .note-card:nth-child(even) { transform: rotate(0.5deg); }
  .note-card.pinned { outline: 1.5px solid var(--accent); }
  .note-top { display: flex; justify-content: flex-end; gap: 4px; }
  .note-top button { border: none; background: transparent; cursor: pointer; font-size: 12px; color: var(--muted); padding: 2px; }
  .note-add { display: flex; gap: 8px; margin-top: 12px; }
  .note-add input { flex: 1; font-family: var(--font-body); font-weight: 500; font-size: 13.5px; padding: 9px 11px; border: 1px solid var(--line); border-radius: var(--radius-sm); background: var(--surface-2); color: var(--ink); }

  .note-mode-toggle { display: inline-flex; border: 1px solid var(--line); border-radius: 999px; padding: 3px; gap: 2px; margin-bottom: 10px; }
  .note-mode-toggle button {
    border: none; cursor: pointer; font-size: 12.5px; font-weight: 700; font-family: var(--font-body);
    padding: 6px 13px; border-radius: 999px; background: transparent; color: var(--muted);
  }
  .note-mode-toggle button[data-active="true"] { background: var(--personal-soft); color: var(--personal); }
  .note-canvas-block { display: none; }
  .note-canvas-block.open { display: block; }
  .note-sketch-thumb { width: 100%; height: 76px; display: block; border-radius: var(--radius-sm); }

  .sketch-toolbar { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-bottom: 8px; }
  .sketch-colors { display: inline-flex; gap: 6px; }
  .sketch-color {
    width: 22px; height: 22px; border-radius: 50%; border: 2px solid transparent; cursor: pointer; padding: 0; flex-shrink: 0;
  }
  .sketch-color[aria-pressed="true"] { border-color: var(--ink); }
  .sketch-widths { display: inline-flex; border: 1px solid var(--line); border-radius: 999px; padding: 3px; gap: 2px; }
  .sketch-widths button {
    border: none; background: transparent; cursor: pointer; width: 26px; height: 26px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center; color: var(--muted);
  }
  .sketch-widths button[aria-pressed="true"] { background: var(--surface-2); color: var(--ink); }
  .sketch-widths button span { border-radius: 50%; background: currentColor; display: block; }
  .sketch-tool-btn {
    border: 1px solid var(--line); background: transparent; color: var(--muted); font-size: 12px; font-weight: 700;
    font-family: var(--font-body); padding: 6px 12px; border-radius: 999px; cursor: pointer;
  }
  .sketch-tool-btn[aria-pressed="true"] { background: var(--accent-soft); color: var(--accent); border-color: var(--accent); }
  .sketch-tool-btn:hover { background: var(--surface-2); }
  .sketch-canvas-wrap {
    border: 1px solid var(--line); border-radius: var(--radius-md); background: var(--surface-2); overflow: hidden;
  }
  canvas.sketch-canvas { width: 100%; display: block; touch-action: none; cursor: crosshair; }
  .page-panel .sketch-canvas-wrap { height: 260px; }
  .note-canvas-block .sketch-canvas-wrap { height: 150px; }


  .week-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 10px; }
  .week-day {
    background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius-md);
    padding: 11px; min-height: 150px; cursor: pointer; display: flex; flex-direction: column; gap: 6px;
    box-shadow: var(--shadow);
  }
  .week-day.is-today { border-color: var(--accent); border-width: 1.5px; }
  .week-day-head { display: flex; justify-content: space-between; align-items: baseline; }
  .week-day-dow { font-size: 11px; color: var(--muted); text-transform: capitalize; font-weight: 700; }
  .week-day-num { font-size: 20px; }
  .week-item { font-size: 11.5px; font-weight: 500; color: var(--ink); display: flex; gap: 5px; align-items: flex-start; }
  .week-item .dot { width: 6px; height: 6px; border-radius: 50%; margin-top: 4px; flex-shrink: 0; }
  .week-more { font-size: 11px; color: var(--muted); font-weight: 600; }
  .week-counts { display: flex; gap: 6px; margin-top: auto; padding-top: 4px; }
  .week-count { font-size: 10.5px; font-weight: 700; padding: 1px 7px; border-radius: 999px; }
  .week-count.pessoal { background: var(--personal-soft); color: var(--personal); }
  .week-count.profissional { background: var(--professional-soft); color: var(--professional); }
  .week-focus-star { font-size: 12px; color: var(--accent); }

  .month-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px; }
  .month-nav { display: flex; gap: 6px; align-items: center; }
  .month-nav button { border: 1px solid var(--line); background: var(--surface); width: 32px; height: 32px; border-radius: 999px; cursor: pointer; font-size: 15px; color: var(--ink); font-family: var(--font-body); }
  .month-nav button#monthToday, .month-nav button#diarioHoje { width: auto; padding: 0 12px; font-size: 12px; font-weight: 700; }
  .month-title { font-size: 21px; text-transform: capitalize; }
  .month-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; }
  .month-dow { font-size: 11px; color: var(--muted); text-align: center; padding-bottom: 4px; text-transform: capitalize; font-weight: 700; }
  .month-cell {
    aspect-ratio: 1 / 0.85; border-radius: var(--radius-sm); border: 1px solid var(--line);
    background: var(--surface); padding: 7px; cursor: pointer; display: flex; flex-direction: column; justify-content: space-between;
  }
  .month-cell.outside { opacity: 0.35; }
  .month-cell.is-today { border-color: var(--accent); border-width: 1.5px; }
  .month-cell-num { font-size: 13px; font-weight: 700; font-family: var(--font-body); }
  .month-dots { display: flex; gap: 3px; flex-wrap: wrap; }
  .month-dots span { width: 5.5px; height: 5.5px; border-radius: 50%; }

  .range-nav { display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px; }
  .range-label { font-size: 20px; }
  .range-arrows { display: flex; gap: 6px; }
  .range-arrows button { border: 1px solid var(--line); background: var(--surface); width: 32px; height: 32px; border-radius: 999px; cursor: pointer; font-size: 15px; color: var(--ink); }

  .view-panel { display: none; }
  .view-panel.active { display: block; }

  @media (max-width: 760px) {
    .day-grid { grid-template-columns: 1fr; }
    .week-grid { grid-template-columns: repeat(7, minmax(90px,1fr)); overflow-x: auto; padding-bottom: 6px; }
    .month-cell { aspect-ratio: 1/1; }
  }
  @media (max-width: 480px) {
    .brand { font-size: 28px; }
    .shell { padding: 14px 12px 48px; }
  }


  /* ---------- Contas pedindo atenção (faixa do Dia) ---------- */
  .contas-banner { background: var(--accent-soft); border-radius: var(--radius-lg); padding: 14px 16px; margin-bottom: 16px; }
  .contas-banner h3 { margin: 0 0 8px; font-size: 17px; color: var(--ink); display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
  .contas-banner h3 button { border: none; background: none; color: var(--accent); font: 700 12.5px var(--font-body); cursor: pointer; padding: 0; }
  .conta-linha { display: flex; align-items: center; gap: 10px; padding: 7px 0; border-top: 1px solid rgba(0,0,0,0.06); flex-wrap: wrap; }
  .conta-linha:first-of-type { border-top: none; }
  .conta-nome { font-weight: 700; font-size: 14px; }
  .conta-quando { font-size: 12.5px; font-weight: 600; color: var(--muted); }
  .conta-quando.venceu { color: var(--personal); }
  .conta-valor { font-size: 13px; font-weight: 700; margin-left: auto; }
  .conta-tarefa { background: var(--accent-soft); border-radius: var(--radius-sm); padding-left: 8px; padding-right: 8px; margin-bottom: 4px; }
  .conta-tarefa .task-text { display: flex; flex-wrap: wrap; gap: 4px 8px; align-items: baseline; }
  .conta-tarefa .conta-valor { margin-left: 0; font-size: 13px; }
  .conta-tarefa-icone { font-size: 15px; flex-shrink: 0; }
  .btn-paguei { border: none; background: var(--done); color: #fff; font: 700 12.5px var(--font-body); padding: 6px 13px; border-radius: 999px; cursor: pointer; }
  .btn-paguei:active { transform: scale(0.96); }

  /* ---------- Página livre + bloco, lado a lado ---------- */
  .page-row { display: grid; grid-template-columns: 1.45fr 1fr; gap: 16px; margin-top: 16px; align-items: start; }
  .page-panel .sketch-canvas-wrap { height: 300px; }
  .page-acoes { display: flex; gap: 8px; margin-top: 8px; flex-wrap: wrap; }
  .page-acoes .btn-add { margin-left: auto; padding: 8px 16px; font-size: 13px; }
  .note-top { justify-content: flex-end; }
  .note-top .note-amanha { font: 700 11px var(--font-body); color: var(--accent); margin-right: auto; }
  .note-data { font-size: 10.5px; font-weight: 700; color: var(--muted); }

  /* ---------- Tarefa que foi para o painel ---------- */
  .painel-chip { font-size: 10.5px; font-weight: 700; padding: 1px 7px; border-radius: 999px; white-space: nowrap; background: var(--professional-soft); color: var(--professional); }
  .painel-chip.espera { background: var(--accent-soft); color: var(--accent); }
  .painel-chip.fora { background: var(--surface-2); color: var(--muted); }

  /* ---------- Diário ---------- */
  .diario-veu { position: relative; border-radius: var(--radius-md); overflow: hidden; min-height: 170px; }
  .diario-borrao { filter: blur(7px); opacity: .55; padding: 12px 6px; pointer-events: none; user-select: none; }
  .diario-borrao span { display: block; height: 11px; border-radius: 6px; background: var(--muted-2); margin: 11px 0; }
  .diario-trava { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; padding: 14px; text-align: center; }
  .diario-trava .cadeado { font-size: 26px; }
  .diario-trava p { margin: 0; font-size: 13px; color: var(--muted); font-weight: 600; max-width: 320px; line-height: 1.5; }
  .diario-form { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; width: 100%; }
  .diario-form input { flex: 1 1 160px; max-width: 240px; font: 500 14px var(--font-body); padding: 9px 12px; border: 1px solid var(--line); border-radius: var(--radius-sm); background: var(--surface); color: var(--ink); }
  .diario-link { border: none; background: none; color: var(--muted); font: 700 12px var(--font-body); cursor: pointer; text-decoration: underline; padding: 2px; }
  .diario-erro { color: var(--personal); font-size: 12.5px; font-weight: 700; }
  .diario-codigo { font: 700 20px ui-monospace, Menlo, monospace; letter-spacing: 2px; background: var(--surface); border: 1.5px dashed var(--accent); border-radius: var(--radius-sm); padding: 10px 14px; color: var(--ink); user-select: all; }
  .diario-tipos { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 8px; }
  .diario-tipos button { border: 1px solid var(--line); background: transparent; color: var(--muted); font: 700 12px var(--font-body); padding: 6px 11px; border-radius: 999px; cursor: pointer; }
  .diario-tipos button[aria-pressed="true"] { background: var(--personal-soft); color: var(--personal); border-color: transparent; }
  .diario-texto { width: 100%; min-height: 84px; resize: vertical; font: 500 14.5px/1.55 var(--font-body); padding: 10px 12px; border: 1px solid var(--line); border-radius: var(--radius-sm); background: var(--surface-2); color: var(--ink); }
  .diario-rodape { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-top: 8px; }
  .diario-rodape .btn-add { margin-left: auto; padding: 8px 16px; font-size: 13px; }
  .diario-entrada { padding: 10px 2px; border-bottom: 1px solid var(--line); }
  .diario-entrada:last-child { border-bottom: none; }
  .diario-entrada-topo { display: flex; align-items: center; gap: 8px; font-size: 11.5px; font-weight: 700; color: var(--muted); }
  .diario-entrada-topo .row-del { margin-left: auto; }
  .diario-entrada-texto { font-size: 14.5px; line-height: 1.6; white-space: pre-wrap; overflow-wrap: anywhere; margin-top: 3px; }
  .diario-entrada-texto mark { background: var(--accent-soft); color: inherit; border-radius: 3px; padding: 0 2px; }
  .diario-layout { display: grid; grid-template-columns: 1fr 1.2fr; gap: 16px; align-items: start; }
  .diario-busca { width: 100%; font: 500 14.5px var(--font-body); padding: 10px 13px; border: 1px solid var(--line); border-radius: 999px; background: var(--surface-2); color: var(--ink); margin-bottom: 12px; }
  .diario-dia-titulo { font: 600 17px var(--font-display); margin: 12px 0 2px; text-transform: capitalize; }
  .month-cell.tem-diario { background: var(--personal-soft); }
  .month-cell.sel { outline: 2px solid var(--personal); outline-offset: -2px; }
  .diario-conta { font-size: 10.5px; font-weight: 700; color: var(--personal); }

  /* ---------- Finanças ---------- */
  .fin-layout { display: grid; grid-template-columns: 1.55fr 1fr; gap: 16px; align-items: start; }
  .fin-resumo { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 14px; }
  .fin-card { background: var(--surface-2); border: 1px solid var(--line); border-radius: var(--radius-md); padding: 11px 13px; }
  .fin-card small { display: block; font-size: 11.5px; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; }
  .fin-card strong { display: block; font-size: 19px; font-weight: 700; margin-top: 3px; font-variant-numeric: tabular-nums; }
  .fin-card.entrada strong { color: var(--done); }
  .fin-card.saida strong { color: var(--personal); }
  .fin-card.nota { grid-column: 1 / -1; font-size: 12px; color: var(--muted); font-weight: 600; background: none; border-style: dashed; }
  .planilha-wrap { overflow-x: auto; border: 1px solid var(--line); border-radius: var(--radius-md); }
  table.planilha { width: 100%; border-collapse: collapse; font-size: 13.5px; min-width: 520px; }
  .planilha th { text-align: left; font-size: 11px; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); font-weight: 700; padding: 9px 10px; background: var(--surface-2); border-bottom: 1px solid var(--line); }
  .planilha td { padding: 9px 10px; border-bottom: 1px solid var(--line); vertical-align: middle; }
  .planilha tr:last-child td { border-bottom: none; }
  .planilha .valor { text-align: right; font-variant-numeric: tabular-nums; font-weight: 700; white-space: nowrap; }
  .planilha .valor.entrada { color: var(--done); }
  .planilha .valor.saida { color: var(--personal); }
  .planilha tr.salario td { background: var(--professional-soft); }
  .planilha .sub { display: block; font-size: 11.5px; color: var(--muted); font-weight: 600; margin-top: 2px; }
  .fin-add { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
  .fin-add input, .fin-add select { font: 500 13.5px var(--font-body); padding: 8px 10px; border: 1px solid var(--line); border-radius: var(--radius-sm); background: var(--surface-2); color: var(--ink); }
  .fin-add input[type="text"] { flex: 2 1 150px; }
  .fin-add input.dinheiro { flex: 1 1 90px; max-width: 130px; }
  .fin-add input[type="date"] { flex: 1 1 130px; }
  .fin-add .btn-add { padding: 8px 16px; font-size: 13px; }
  .fin-login { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  .fin-login input { font: 500 13px var(--font-body); padding: 7px 10px; border: 1px solid var(--line); border-radius: var(--radius-sm); background: var(--surface); color: var(--ink); flex: 1 1 140px; }
  .fin-login button { padding: 7px 14px; font-size: 12.5px; }
  .fin-cats { margin-top: 14px; display: flex; flex-direction: column; gap: 6px; }
  .fin-cat { display: grid; grid-template-columns: 110px 1fr auto; gap: 10px; align-items: center; font-size: 12.5px; font-weight: 600; }
  .fin-cat-barra { height: 8px; border-radius: 999px; background: var(--personal-soft); overflow: hidden; }
  .fin-cat-barra span { display: block; height: 100%; background: var(--personal); border-radius: 999px; }
  .conta-card { border: 1px solid var(--line); border-radius: var(--radius-md); padding: 11px 13px; margin-bottom: 8px; background: var(--surface-2); }
  .conta-card.venceu { border-color: var(--personal); }
  .conta-card .conta-linha { border-top: none; padding: 0; }
  .conta-rep { font-size: 11.5px; color: var(--muted); font-weight: 600; margin-top: 3px; }
  .contas-pagas { margin-top: 14px; font-size: 12.5px; color: var(--muted); font-weight: 600; }
  .contas-pagas div { padding: 3px 0; }

  /* Item de grade não encolhe abaixo do conteúdo sem isto — e a planilha,
     que rola de lado dentro da moldura dela, empurrava a tela inteira. */
  .page-row > *, .diario-layout > *, .fin-layout > * { min-width: 0; }
  @media (max-width: 760px) {
    .page-row, .diario-layout, .fin-layout { grid-template-columns: 1fr; }
    .fin-resumo { grid-template-columns: 1fr 1fr; }
    .fin-card.saldo { grid-column: 1 / -1; }
    .view-switch button { padding: 8px 11px; font-size: 13px; }
  }

  /* ---------- Escrita à mão ---------- */
  /* O que veio da caneta aparece em cursiva — só isso, o digitado fica na
     letra de sempre, e dá para saber de relance o que foi escrito à mão. */
  .cursiva { font-family: 'Dancing Script', var(--font-script); font-weight: 600; font-size: 1.22em; line-height: 1.25; letter-spacing: .01em; }
  /* Já no campo, logo que a letra volta — e não só depois de salvar. */
  input[data-a-mao="1"], textarea[data-a-mao="1"] { font-family: 'Dancing Script', var(--font-script) !important; font-weight: 600 !important; font-size: 18px !important; }
  .caneta-btn { border: 1px solid var(--line); background: var(--surface); color: var(--personal); border-radius: 999px; width: 36px; height: 36px; flex-shrink: 0; cursor: pointer; font-size: 16px; display: inline-flex; align-items: center; justify-content: center; padding: 0; }
  .caneta-btn:active { transform: scale(.94); }
  .caneta-fundo { position: fixed; inset: 0; background: rgba(40,20,28,.45); z-index: 100; display: flex; align-items: flex-end; justify-content: center; padding: 16px; }
  .caneta-fundo[hidden] { display: none; }
  .caneta-janela { background: var(--surface); border-radius: var(--radius-lg); box-shadow: var(--shadow); width: 100%; max-width: 760px; padding: 16px; margin-bottom: env(safe-area-inset-bottom, 0px); }
  .caneta-janela h3 { margin: 0 0 4px; font-size: 18px; }
  .caneta-janela p { margin: 0 0 10px; font-size: 12.5px; color: var(--muted); font-weight: 600; }
  .caneta-janela .sketch-canvas-wrap { height: 220px; background: var(--surface-2); }
  .caneta-acoes { display: flex; gap: 8px; margin-top: 10px; align-items: center; flex-wrap: wrap; }
  .caneta-msg { font-size: 12.5px; font-weight: 700; color: var(--muted); }
  .caneta-msg.erro { color: var(--personal); }
  .diario-rodape .caneta-btn, form[data-form="diario-escrever"] > .caneta-btn { margin-top: 6px; }

  /* ---------- Mercado ---------- */
  .mercado-add { display: flex; gap: 8px; align-items: center; }
  .mercado-add input { flex: 1; min-width: 0; font: 500 14px var(--font-body); padding: 9px 12px; border: 1px solid var(--line); border-radius: var(--radius-sm); background: var(--surface-2); color: var(--ink); }
  .mercado-lista { margin-top: 8px; }
  .mercado-item { display: flex; align-items: center; gap: 10px; padding: 8px 2px; border-bottom: 1px solid var(--line); }
  .mercado-item:last-child { border-bottom: none; }
  .mercado-nome { flex: 1; min-width: 0; font-size: 14.5px; font-weight: 500; overflow-wrap: anywhere; }
  .mercado-item.pego .mercado-nome { text-decoration: line-through; color: var(--muted); }
  .mercado-nome.cursiva { font-size: 17.5px; }
  .mercado-chips { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 10px; align-items: center; }
  .mercado-chips small { font-size: 11.5px; font-weight: 700; color: var(--muted); margin-right: 2px; }
  .mercado-chips button { border: 1px dashed var(--muted-2); background: transparent; color: var(--ink); font: 600 12px var(--font-body); padding: 5px 10px; border-radius: 999px; cursor: pointer; }
  .mercado-rodape { display: flex; gap: 8px; margin-top: 10px; flex-wrap: wrap; align-items: center; }

  *:focus-visible { outline: 2px solid var(--professional); outline-offset: 2px; }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
</style>
</head>
<body>
<div class="shell">
  <header class="topbar">
    <div class="brand-block">
      <svg class="brand-sprig" viewBox="0 0 40 40" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
        <path d="M20 34C20 34 20 22 20 16C20 10 16 6 11 6" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/>
        <path d="M20 20C20 20 24 16 29 17" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/>
        <path d="M20 26C20 26 15 23 13 18" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/>
        <ellipse cx="11" cy="6" rx="3.4" ry="2.2" transform="rotate(-40 11 6)" stroke="currentColor" stroke-width="1.2"/>
        <ellipse cx="29" cy="17" rx="3.4" ry="2.2" transform="rotate(20 29 17)" stroke="currentColor" stroke-width="1.2"/>
        <ellipse cx="13" cy="18" rx="3" ry="2" transform="rotate(-15 13 18)" stroke="currentColor" stroke-width="1.2"/>
      </svg>
      <div class="brand-text">
        <span class="brand">Bússola</span>
        <span class="today-date" id="todayLabel"></span>
      </div>
    </div>
    <div class="header-right">
      <div class="palette-picker" role="group" aria-label="Tema de cor">
        <button class="palette-swatch" data-p="rose" aria-pressed="true" title="Rosé" aria-label="Tema Rosé"></button>
        <button class="palette-swatch" data-p="lavanda" aria-pressed="false" title="Lavanda" aria-label="Tema Lavanda"></button>
        <button class="palette-swatch" data-p="pessego" aria-pressed="false" title="Pêssego" aria-label="Tema Pêssego"></button>
      </div>
      <div class="view-switch" role="tablist" aria-label="Visualização">
        <button data-view="dia" aria-pressed="true">Dia</button>
        <button data-view="semana" aria-pressed="false">Semana</button>
        <button data-view="mes" aria-pressed="false">Mês</button>
        <button data-view="diario" aria-pressed="false">Diário</button>
        <button data-view="financas" aria-pressed="false">Finanças</button>
      </div>
    </div>
  </header>

  <form class="quickcapture" id="quickForm">
    <input type="text" id="quickInput" placeholder="Adicionar uma tarefa rápida…" autocomplete="off" data-caneta>
    <div class="cat-toggle" id="quickCat">
      <button type="button" data-cat="pessoal" data-active="true">♡ Pessoal</button>
      <button type="button" data-cat="profissional" data-active="false">✦ Profissional</button>
    </div>
    <button type="submit" class="btn-add">Adicionar</button>
  </form>

  <!-- DIA -->
  <section class="view-panel active" id="view-dia">
    <div class="range-nav">
      <div class="range-arrows"><button id="dayPrev" aria-label="Dia anterior">‹</button></div>
      <div class="range-label" id="dayLabel"></div>
      <div class="range-arrows"><button id="dayNext" aria-label="Próximo dia">›</button></div>
    </div>
    <div id="contasBanner"></div>
    <div class="day-grid">
      <div class="day-left">
        <div class="panel">
          <h2>Foco de hoje <span class="hint">até 3 prioridades</span></h2>
          <div class="focus-list" id="focusList"></div>
        </div>
        <div class="panel">
          <h2>Agenda</h2>
          <div class="painel-sync" id="painelSync" aria-live="polite"><span id="painelSyncTxt">Painel: ainda não conferido</span><button type="button" id="painelSyncBtn" title="Buscar de novo as assinaturas marcadas no painel do cartório">↻ Atualizar</button></div>
          <div id="overdueBanner"></div>
          <div class="timeline" id="timeline"></div>
          <button type="button" class="ghost-btn" id="toggleApptForm" style="margin-top:12px;">+ Compromisso</button>
          <form class="mini-form" id="apptForm">
            <input type="text" id="apptTitle" placeholder="Título" required data-caneta>
            <input type="date" id="apptDate" required>
            <input type="time" id="apptTime">
            <select id="apptCat">
              <option value="pessoal">Pessoal</option>
              <option value="profissional">Profissional</option>
            </select>
            <div id="agendaLigacao" style="flex:1 1 100%"></div>
            <input type="text" id="apptConvidados" placeholder="Convidar por e-mail (opcional)" inputmode="email" autocomplete="off" list="apptConvidadosLista" style="flex:1 1 100%">
            <datalist id="apptConvidadosLista"></datalist>
            <button type="submit" class="btn-add" style="padding:8px 16px;font-size:13px;">Salvar</button>
          </form>
        </div>
      </div>
      <div class="day-right">
        <div class="panel">
          <h2>Tarefas
            <span class="filter-chips" id="taskFilter">
              <button data-f="todas" aria-pressed="true">Todas</button>
              <button data-f="pessoal" aria-pressed="false">♡ Pessoal</button>
              <button data-f="profissional" aria-pressed="false">✦ Profissional</button>
            </span>
          </h2>
          <div class="task-list" id="taskList"></div>
        </div>
        <div class="panel">
          <h2>Mercado <span class="hint" id="mercadoHint">o que acabou</span></h2>
          <form class="mercado-add" id="mercadoForm">
            <input type="text" id="mercadoInput" placeholder="Acabou o quê?" autocomplete="off" data-caneta>
            <button type="submit" class="btn-add" style="padding:9px 16px;font-size:13px;">+</button>
          </form>

<script src="fin-motor.js"></script>
<script>
(function(){
  "use strict";

  var STORE_KEY = "bussola-planner-v1";
  var state = { tasks: [], appointments: [], notes: [], habits: [], pages: {}, lastCategory: "pessoal", palette: "rose", painelHidden: {}, painelSync: null,
               diario: null, financas: { lancamentos: [] }, contas: [], mercado: { itens: [], historico: {} } };

  function load(){
    try {
      var raw = localStorage.getItem(STORE_KEY);
      if (raw) { var parsed = JSON.parse(raw); state = Object.assign(state, parsed); }
    } catch(e) { /* storage unavailable — continue with in-memory defaults */ }
  }
  function save(){ try { localStorage.setItem(STORE_KEY, JSON.stringify(state)); } catch(e) { /* ignore */ } }
  load();

  document.documentElement.setAttribute("data-palette", state.palette || "rose");
  document.querySelectorAll(".palette-swatch").forEach(function(btn){
    btn.setAttribute("aria-pressed", btn.getAttribute("data-p") === state.palette ? "true" : "false");
    btn.addEventListener("click", function(){
      state.palette = btn.getAttribute("data-p");
      document.documentElement.setAttribute("data-palette", state.palette);
      document.querySelectorAll(".palette-swatch").forEach(function(b){
        b.setAttribute("aria-pressed", b === btn ? "true" : "false");
      });
      save();
    });
  });

  function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,8); }

  /* ---------- Sketchpad: pen/touch/mouse freehand drawing ---------- */
  function cloneStrokes(strokes){
    return (strokes || []).map(function(s){ return { color: s.color, width: s.width, erase: !!s.erase, points: s.points.map(function(p){ return [p[0], p[1]]; }) }; });
  }
  function paintStroke(ctx, s, cssW, cssH){
    if (!s.points.length) return;
    ctx.save();
    ctx.lineJoin = "round"; ctx.lineCap = "round";
    ctx.globalCompositeOperation = s.erase ? "destination-out" : "source-over";
    ctx.strokeStyle = s.erase ? "rgba(0,0,0,1)" : s.color;
    ctx.lineWidth = s.width;
    ctx.beginPath();
    s.points.forEach(function(p, i){
      var x = p[0] * cssW, y = p[1] * cssH;
      if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
    });
    ctx.stroke();
    ctx.restore();
  }
  function renderStaticSketch(canvas, strokes){
    var rect = canvas.getBoundingClientRect();
    if (rect.width < 1 || rect.height < 1) return;
    var dpr = window.devicePixelRatio || 1;
    canvas.width = Math.max(1, Math.round(rect.width * dpr));
    canvas.height = Math.max(1, Math.round(rect.height * dpr));
    var ctx = canvas.getContext("2d");
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.clearRect(0, 0, rect.width, rect.height);
    (strokes || []).forEach(function(s){ paintStroke(ctx, s, rect.width, rect.height); });
  }

  function Sketchpad(canvas, initialStrokes, onChange){
    var strokes = cloneStrokes(initialStrokes);
    var ctx = null, cssW = 0, cssH = 0;
    var currentColor = "#22271E";
    var currentWidth = 3;
    var erasing = false;
    var drawingStroke = null;

    function resize(){
      var rect = canvas.getBoundingClientRect();
      if (rect.width < 1 || rect.height < 1) return;
      var dpr = window.devicePixelRatio || 1;
      cssW = rect.width; cssH = rect.height;
      canvas.width = Math.max(1, Math.round(cssW * dpr));
      canvas.height = Math.max(1, Math.round(cssH * dpr));
      ctx = canvas.getContext("2d");
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      redraw();
    }
    function redraw(){
      if (!ctx) return;
      ctx.clearRect(0, 0, cssW, cssH);
      strokes.forEach(function(s){ paintStroke(ctx, s, cssW, cssH); });
    }
    function posFromEvent(e){
      var rect = canvas.getBoundingClientRect();
      var x = e.clientX - rect.left, y = e.clientY - rect.top;
      return [ Math.max(0, Math.min(1, x / rect.width)), Math.max(0, Math.min(1, y / rect.height)) ];
    }
    function pointerDown(e){
      if (e.button !== undefined && e.button !== 0) return;
      e.preventDefault();
      try { canvas.setPointerCapture(e.pointerId); } catch(err) {}
      var w = currentWidth;
      if (e.pointerType === "pen" && e.pressure) w = currentWidth * (0.6 + e.pressure * 0.8);
      drawingStroke = { color: currentColor, width: w, erase: erasing, points: [posFromEvent(e)] };
    }
    function pointerMove(e){
      if (!drawingStroke) return;
      e.preventDefault();
      drawingStroke.points.push(posFromEvent(e));
      redraw();
      if (ctx) paintStroke(ctx, drawingStroke, cssW, cssH);
    }
    function pointerUp(e){
      if (!drawingStroke) return;
      if (drawingStroke.points.length > 1) strokes.push(drawingStroke);
      drawingStroke = null;
      redraw();
      if (onChange) onChange(cloneStrokes(strokes));
    }

    canvas.addEventListener("pointerdown", pointerDown);
    canvas.addEventListener("pointermove", pointerMove);
    canvas.addEventListener("pointerup", pointerUp);
    canvas.addEventListener("pointercancel", pointerUp);
    canvas.addEventListener("pointerleave", pointerUp);
    window.addEventListener("resize", resize);

    resize();

    return {
      setColor: function(c){ currentColor = c; },
      setWidth: function(w){ currentWidth = w; },
      setErasing: function(v){ erasing = v; },
      isErasing: function(){ return erasing; },
      undo: function(){ strokes.pop(); redraw(); if (onChange) onChange(cloneStrokes(strokes)); },
      clear: function(){ strokes = []; redraw(); if (onChange) onChange(cloneStrokes(strokes)); },
      getStrokes: function(){ return cloneStrokes(strokes); },
      setStrokes: function(s){ strokes = cloneStrokes(s); redraw(); },
      resize: resize
    };
  }

  var SKETCH_COLORS = [
    { key: "ink", label: "Tinta" }, { key: "personal", label: "Pessoal" },
    { key: "professional", label: "Profissional" }, { key: "accent", label: "Destaque" }
  ];
  var SKETCH_WIDTHS = [ { w: 2, d: 6 }, { w: 4, d: 9 }, { w: 7, d: 13 } ];

  function buildSketchToolbar(container, pad){
    var rootStyle = getComputedStyle(document.documentElement);
    var colorsHtml = SKETCH_COLORS.map(function(c, i){
      var hex = rootStyle.getPropertyValue("--" + c.key).trim();
      return '<button type="button" class="sketch-color" data-color="'+hex+'" aria-pressed="'+(i===0?'true':'false')+'" title="'+c.label+'" style="background:'+hex+';"></button>';
    }).join("");
    var widthsHtml = SKETCH_WIDTHS.map(function(w, i){
      return '<button type="button" class="sketch-width-btn" data-w="'+w.w+'" aria-pressed="'+(i===0?'true':'false')+'"><span style="width:'+w.d+'px;height:'+w.d+'px;"></span></button>';
    }).join("");
    container.innerHTML =
      '<div class="sketch-colors">'+colorsHtml+'</div>' +
      '<div class="sketch-widths">'+widthsHtml+'</div>' +
      '<button type="button" class="sketch-tool-btn" data-erase="1" aria-pressed="false">Borracha</button>';

    var initialColor = rootStyle.getPropertyValue("--" + SKETCH_COLORS[0].key).trim();
    pad.setColor(initialColor);
    pad.setWidth(SKETCH_WIDTHS[0].w);

    container.querySelectorAll(".sketch-color").forEach(function(btn){
      btn.addEventListener("click", function(){
        container.querySelectorAll(".sketch-color").forEach(function(b){ b.setAttribute("aria-pressed", b===btn ? "true":"false"); });
        pad.setColor(btn.getAttribute("data-color"));
        pad.setErasing(false);
        container.querySelector('[data-erase="1"]').setAttribute("aria-pressed", "false");
      });
    });
    container.querySelectorAll(".sketch-width-btn").forEach(function(btn){
      btn.addEventListener("click", function(){
        container.querySelectorAll(".sketch-width-btn").forEach(function(b){ b.setAttribute("aria-pressed", b===btn ? "true":"false"); });
        pad.setWidth(parseFloat(btn.getAttribute("data-w")));
      });
    });
    container.querySelector('[data-erase="1"]').addEventListener("click", function(){
      var next = !pad.isErasing();
      pad.setErasing(next);
      this.setAttribute("aria-pressed", next ? "true" : "false");
    });
  }


  function pad(n){ return n < 10 ? "0"+n : ""+n; }
  function iso(d){ return d.getFullYear() + "-" + pad(d.getMonth()+1) + "-" + pad(d.getDate()); }
  function fromIso(s){ var p = s.split("-"); return new Date(+p[0], +p[1]-1, +p[2]); }
  function today(){ var d = new Date(); d.setHours(0,0,0,0); return d; }
  var TODAY_ISO = iso(today());

  function fmtLong(d){ return d.toLocaleDateString("pt-BR", { weekday: "long", day: "numeric", month: "long" }); }
  function fmtShort(d){ return d.toLocaleDateString("pt-BR", { day: "2-digit", month: "2-digit" }); }
  function startOfWeek(d){
    var wd = d.getDay();
    var diff = (wd === 0 ? -6 : 1 - wd);
    var res = new Date(d); res.setDate(d.getDate() + diff); res.setHours(0,0,0,0);
    return res;
  }
  function addDays(d, n){ var r = new Date(d); r.setDate(d.getDate()+n); return r; }

  var view = "dia";
  var dayCursor = today();
  var weekCursor = startOfWeek(today());
  var monthCursor = new Date(today().getFullYear(), today().getMonth(), 1);

  var $ = function(id){ return document.getElementById(id); };
  $("todayLabel").textContent = fmtLong(today());

  document.querySelectorAll(".view-switch button").forEach(function(btn){
    btn.addEventListener("click", function(){
      view = btn.getAttribute("data-view");
      document.querySelectorAll(".view-switch button").forEach(function(b){
        b.setAttribute("aria-pressed", b === btn ? "true" : "false");
      });
      document.querySelectorAll(".view-panel").forEach(function(p){ p.classList.remove("active"); });
      $("view-" + view).classList.add("active");
      renderAll();
    });
  });

  var quickCatWrap = $("quickCat");
  quickCatWrap.querySelectorAll("button").forEach(function(btn){
    btn.addEventListener("click", function(){
      state.lastCategory = btn.getAttribute("data-cat");
      quickCatWrap.querySelectorAll("button").forEach(function(b){
        b.setAttribute("data-active", b === btn ? "true" : "false");
      });
      save();
    });
  });
  (function initCat(){
    quickCatWrap.querySelectorAll("button").forEach(function(b){
      b.setAttribute("data-active", b.getAttribute("data-cat") === state.lastCategory ? "true" : "false");
    });
  })();

  $("quickForm").addEventListener("submit", function(e){
    e.preventDefault();
    var input = $("quickInput");
    var text = input.value.trim();
    if (!text) return;
    var nova = { id: uid(), text: text, category: state.lastCategory, done: false, date: TODAY_ISO, focus: false, createdAt: Date.now() };
    if (foiAMao(input)) nova.aMao = true;
    // Profissional vai também para o Bloco de Notas do painel (aba Shirley).
    if (nova.category === "profissional") nova.painel = { id: "bussola-" + nova.id, estado: "enviando", ultimoDone: false };
    state.tasks.push(nova);
    input.value = "";
    save(); renderAll();
    if (nova.painel) tarefaNoPainel(nova, tarefaEnviar);
  });

  $("dayPrev").addEventListener("click", function(){ dayCursor = addDays(dayCursor, -1); renderDay(); loadPagePad(); });
  $("dayNext").addEventListener("click", function(){ dayCursor = addDays(dayCursor, 1); renderDay(); loadPagePad(); });

  $("toggleApptForm").addEventListener("click", function(){
    var f = $("apptForm");
    f.classList.toggle("open");
    if (f.classList.contains("open")) $("apptDate").value = iso(dayCursor);
  });
  $("apptForm").addEventListener("submit", function(e){
    e.preventDefault();
    var title = $("apptTitle").value.trim();
    if (!title) return;
    var novoAppt = {
      id: uid(), title: title, date: $("apptDate").value || iso(dayCursor),
      time: $("apptTime").value || null, category: $("apptCat").value,
      source: "manual", aMao: foiAMao($("apptTitle")) || undefined, createdAt: Date.now()
    };
    var emails = conviteEmails(state.agendaUrl ? $("apptConvidados").value : "");
    if (emails.invalidos.length) { alert("Estes e-mails não parecem certos: " + emails.invalidos.join(", ")); return; }
    if (emails.validos.length) novoAppt.convite = { emails: emails.validos, estado: "enviando" };
    state.appointments.push(novoAppt);
    $("apptConvidados").value = "";
    $("apptTitle").value = ""; $("apptTime").value = "";
    $("apptForm").classList.remove("open");
    save(); renderAll();
    if (novoAppt.convite) conviteEnviar(novoAppt);
  });

  var taskFilterVal = "todas";
  $("taskFilter").querySelectorAll("button").forEach(function(btn){
    btn.addEventListener("click", function(){
      taskFilterVal = btn.getAttribute("data-f");
      $("taskFilter").querySelectorAll("button").forEach(function(b){
        b.setAttribute("aria-pressed", b === btn ? "true" : "false");
      });
      renderDay();
    });
  });

  $("noteForm").addEventListener("submit", function(e){
    e.preventDefault();
    var input = $("noteInput");
    var text = input.value.trim();
    if (!text) return;
    state.notes.push({ id: uid(), text: text, pinned: false, date: iso(dayCursor), aMao: foiAMao(input) || undefined, createdAt: Date.now() });
    input.value = "";
    save(); renderNotes();
  });


  /* ---------- daily free page ---------- */
  var pagePad = Sketchpad($("pageSketchCanvas"), [], function(strokes){
    state.pages[iso(dayCursor)] = { strokes: strokes };
    save();
  });
  buildSketchToolbar($("pageSketchToolbar"), pagePad);
  $("pageSketchUndo").addEventListener("click", function(){ pagePad.undo(); });
  (function(){
    var clearBtn = $("pageSketchClear");
    var armed = false, armTimer = null;
    clearBtn.addEventListener("click", function(){
      if (!armed) {
        armed = true;
        clearBtn.textContent = "Toque de novo para confirmar";
        armTimer = setTimeout(function(){ armed = false; clearBtn.textContent = "Limpar página"; }, 2500);
      } else {
        clearTimeout(armTimer);
        armed = false;
        clearBtn.textContent = "Limpar página";
        pagePad.clear();
      }
    });
  })();
  // "Guardar no bloco": a escrita da página vai para a mesma leitura da
  // caneta e vira um cartão de TEXTO em cursiva no Bloco de notas (pedido
  // dela, 22/09/2026). Desenho, letra que a IA não leu ou falta de internet:
  // o cartão guarda o desenho como sempre guardou — nada se perde por não ter
  // sido lido. A página só é limpa depois que o cartão existe.
  var pageLendo = false;
  $("pageToBloco").addEventListener("click", function(){
    var strokes = pagePad.getStrokes();
    if (!strokes.length || pageLendo) return;
    var dia = iso(dayCursor), btn = $("pageToBloco");
    pageLendo = true; btn.disabled = true; $("pageMsg").textContent = "Lendo sua letra…";
    lerEscrita(strokes, $("pageSketchCanvas")).then(function(texto){
      state.notes.push({ id: uid(), text: texto, aMao: true, pinned: false, date: dia, createdAt: Date.now() });
      $("pageMsg").textContent = "";
    }, function(motivo){
      state.notes.push({ id: uid(), type: "drawing", strokes: strokes, pinned: false, date: dia, createdAt: Date.now() });
      $("pageMsg").textContent = (motivo && motivo.ilegivel ? "Não deu para ler" : "Sem leitura agora") + " — guardei como desenho.";
    }).then(function(){
      pageLendo = false; btn.disabled = false;
      pagePad.clear();
      save(); renderNotes();
    });
  });
  function loadPagePad(){
    var entry = state.pages[iso(dayCursor)];
    pagePad.setStrokes(entry ? entry.strokes : []);
  }

  $("monthPrev").addEventListener("click", function(){ monthCursor = new Date(monthCursor.getFullYear(), monthCursor.getMonth()-1, 1); renderMonth(); });
  $("monthNext").addEventListener("click", function(){ monthCursor = new Date(monthCursor.getFullYear(), monthCursor.getMonth()+1, 1); renderMonth(); });
  $("monthToday").addEventListener("click", function(){ monthCursor = new Date(today().getFullYear(), today().getMonth(), 1); renderMonth(); });
  $("weekPrev").addEventListener("click", function(){ weekCursor = addDays(weekCursor, -7); renderWeek(); });
  $("weekNext").addEventListener("click", function(){ weekCursor = addDays(weekCursor, 7); renderWeek(); });

  function renderDay(){
    var d = dayCursor, dISO = iso(d);
    $("dayLabel").textContent = (dISO === TODAY_ISO ? "Hoje, " : "") + fmtLong(d);

    var focusTasks = state.tasks.filter(function(t){ return t.date === dISO && t.focus; });
    var focusHtml = "";
    for (var i = 0; i < 3; i++) {
      var t = focusTasks[i];
      if (t) {
        focusHtml += '<div class="focus-slot filled"><span class="focus-num">'+(i+1)+'</span>' +
          '<span class="task-cat-dot '+t.category+'"></span>' +
          '<span class="focus-text'+(t.done?' done':'')+(t.aMao?' cursiva':'')+'" data-id="'+t.id+'" data-role="focus-toggle-text">'+escapeHtml(t.text)+'</span>' +
          '<button class="star-btn active" data-role="unfocus" data-id="'+t.id+'" title="Tirar do foco">★</button></div>';
      } else {
        focusHtml += '<div class="focus-slot"><span class="focus-num">'+(i+1)+'</span><span class="focus-empty-label">vazio — marque uma tarefa com ★</span></div>';
      }
    }
    $("focusList").innerHTML = focusHtml;

    var overdue = state.tasks.filter(function(t){ return t.date && t.date < TODAY_ISO && !t.done; });
    if (dISO === TODAY_ISO && overdue.length) {
      $("overdueBanner").innerHTML = '<div class="overdue-banner">' + overdue.length + ' tarefa' + (overdue.length>1?'s':'') + ' de dias anteriores ainda ' + (overdue.length>1?'pendentes':'pendente') + ' — dá uma olhada quando puder.</div>';
    } else { $("overdueBanner").innerHTML = ""; }

    var appts = state.appointments.filter(function(a){ return a.date === dISO; })
      .sort(function(a,b){ return (a.time||"99:99").localeCompare(b.time||"99:99"); });
    if (!appts.length) {
      $("timeline").innerHTML = '<div class="empty">Nenhum compromisso neste dia. Use "+ Compromisso" para marcar algo.</div>';
    } else {
      $("timeline").innerHTML = appts.map(function(a){
        return '<div class="appt-row">' +
          '<div class="appt-time">'+(a.time || "—")+'</div>' +
          '<div class="appt-dot '+a.category+'"></div>' +
          '<div class="appt-body"><div class="appt-title'+(a.aMao?' cursiva':'')+'">'+escapeHtml(a.title)+'</div>' +
          '<div class="appt-meta">'+(a.category==="pessoal"?"♡ Pessoal":"✦ Profissional")+(a.source==="painel"?'<span class="src-chip">do painel</span>':'')+conviteChipHtml(a)+'</div></div>' +
          '<button class="row-del" data-role="del-appt" data-id="'+a.id+'">✕</button></div>';
      }).join("");
    }

    var tasks = state.tasks.filter(function(t){ return t.date === dISO; });
    if (dISO === TODAY_ISO) {
      tasks = tasks.concat(state.tasks.filter(function(t){ return !t.date; }));
      tasks = tasks.concat(overdue);
    }
    if (taskFilterVal !== "todas") tasks = tasks.filter(function(t){ return t.category === taskFilterVal; });
    // A conta que vence no dia entra como tarefa (pedido dela, 23/09/2026:
    // "está lançado gás no dia 27.09, nesse dia deverá haver uma nota nas
    // tarefas do dia"). Hoje entram também as que já venceram, até serem
    // pagas. Marcar o quadradinho é o "Paguei": lança na planilha e empurra
    // o vencimento. Conta é da vida pessoal, então some no filtro Profissional.
    var contasHoje = taskFilterVal === "profissional" ? [] : contasAtivas().filter(function(c){
      return dISO === TODAY_ISO ? c.venc <= dISO : c.venc === dISO;
    });
    var contasHtml = contasHoje.map(function(c){
      var n = contaDias(c);
      var quando = n < 0 ? (n === -1 ? "venceu ontem" : "venceu há " + (-n) + " dias") : "vence hoje";
      return '<div class="task-row conta-tarefa">' +
        '<div class="task-check" data-role="conta-paguei" data-id="'+c.id+'" title="Paguei"></div>' +
        '<span class="conta-tarefa-icone" aria-hidden="true">💸</span>' +
        '<span class="task-text"><span'+(c.aMao?' class="cursiva"':'')+'>'+escapeHtml(c.nome)+'</span> ' +
        '<span class="conta-quando'+(n<0?' venceu':'')+'">'+quando+'</span></span>' +
        (c.valor ? '<span class="conta-valor">'+moeda(c.valor)+'</span>' : '') + '</div>';
    }).join("");
    if (!tasks.length && contasHtml) {
      $("taskList").innerHTML = contasHtml;
    } else if (!tasks.length) {
      $("taskList").innerHTML = '<div class="empty">Nada por aqui ainda. Use a barra no topo para adicionar sua primeira tarefa.</div>';
    } else {
      $("taskList").innerHTML = contasHtml + tasks.map(function(t){
        var isFocus = !!t.focus;
        return '<div class="task-row">' +
          '<div class="task-check'+(t.done?' done':'')+'" data-role="toggle-task" data-id="'+t.id+'">'+(t.done?'✓':'')+'</div>' +
          '<span class="task-cat-dot '+t.category+'"></span>' +
          '<span class="task-text'+(t.done?' done':'')+(t.aMao?' cursiva':'')+'">'+escapeHtml(t.text)+'</span>' + tarefaChipHtml(t) +
          '<button class="star-btn'+(isFocus?' active':'')+'" data-role="toggle-focus" data-id="'+t.id+'" title="Colocar no foco de hoje">★</button>' +
          '<button class="row-del" data-role="del-task" data-id="'+t.id+'">✕</button></div>';
      }).join("");
    }
    renderNotes();
    renderContasBanner();
    renderMercado();
    renderDiarioPainel();
  }

  function renderWeek(){
    var days = [];
    for (var i = 0; i < 7; i++) days.push(addDays(weekCursor, i));

      var dISO = iso(d);
      var appts = state.appointments.filter(function(a){ return a.date === dISO; })

      var focus = tasks.some(function(t){ return t.focus; });
      var pCount = tasks.filter(function(t){ return t.category==="pessoal" && !t.done; }).length;
      var fCount = tasks.filter(function(t){ return t.category==="profissional" && !t.done; }).length;

      }).join("");

        '<div class="week-day-head"><div><div class="week-day-dow">'+d.toLocaleDateString("pt-BR",{weekday:"short"})+'</div>' +
        '<div class="week-day-num">'+d.getDate()+'</div></div>' + (focus?'<span class="week-focus-star">★</span>':'') + '</div>' +
        items + more +
        '<div class="week-counts">' + (pCount?'<span class="week-count pessoal">'+pCount+'</span>':'') + (fCount?'<span class="week-count profissional">'+fCount+'</span>':'') + '</div>' +
        '</div>';
    }).join("");
  }

  var DOW_LABELS = ["seg","ter","qua","qui","sex","sáb","dom"];
  function renderMonth(){
    $("monthLabel").textContent = monthCursor.toLocaleDateString("pt-BR", { month: "long", year: "numeric" });
    $("monthDow").innerHTML = DOW_LABELS.map(function(l){ return '<div class="month-dow">'+l+'</div>'; }).join("");

    var firstOfMonth = new Date(monthCursor.getFullYear(), monthCursor.getMonth(), 1);
    var gridStart = startOfWeek(firstOfMonth);
    var cells = [];
    for (var i = 0; i < 42; i++) cells.push(addDays(gridStart, i));
    var lastOfMonth = new Date(monthCursor.getFullYear(), monthCursor.getMonth()+1, 0);
    while (cells.length > 35 && cells[cells.length-1] > lastOfMonth && cells[cells.length-1].getMonth() !== monthCursor.getMonth()) {
      var lastRowStart = cells.length - 7;
      var rowOutside = cells.slice(lastRowStart).every(function(d){ return d.getMonth() !== monthCursor.getMonth(); });
      if (rowOutside) cells.splice(lastRowStart, 7); else break;
    }

    $("monthGrid").innerHTML = cells.map(function(d){
      var dISO = iso(d);
      var outside = d.getMonth() !== monthCursor.getMonth();
      var dots = [];
      var hasPersonal = state.tasks.some(function(t){ return t.date===dISO && t.category==="pessoal"; }) ||
                         state.appointments.some(function(a){ return a.date===dISO && a.category==="pessoal"; });
      var hasProf = state.tasks.some(function(t){ return t.date===dISO && t.category==="profissional"; }) ||
                    state.appointments.some(function(a){ return a.date===dISO && a.category==="profissional"; });
      if (hasPersonal) dots.push('<span style="background:var(--personal)"></span>');
      if (hasProf) dots.push('<span style="background:var(--professional)"></span>');
      return '<div class="month-cell'+(outside?' outside':'')+(dISO===TODAY_ISO?' is-today':'')+'" data-role="goto-day" data-date="'+dISO+'">' +
        '<div class="month-cell-num">'+d.getDate()+'</div>' +
        '<div class="month-dots">'+dots.join("")+'</div></div>';
    }).join("");
  }

  document.addEventListener("click", function(e){
    var el = e.target.closest("[data-role]");
    if (!el) return;
    var role = el.getAttribute("data-role");
    var id = el.getAttribute("data-id");

    if (role === "toggle-task") {
      var t = state.tasks.find(function(x){ return x.id===id; });
      if (t) {
        t.done = !t.done; save(); renderDay();
        if (t.painel && t.painel.estado === "ok") tarefaNoPainel(t, tarefaConcluirNoPainel);
      }
    } else if (role === "del-task") {
      var td = state.tasks.find(function(x){ return x.id===id; });
      if (td && td.painel && td.painel.estado !== "removida") {
        if (!confirm("Esta tarefa também está no Bloco de Notas do painel. Apagar lá também?")) return;
        tarefaApagarNoPainel(td).catch(function(){
          alert("O painel não respondeu — apaguei só aqui. Lá, apague pelo próprio painel.");
        });
      }
      state.tasks = state.tasks.filter(function(x){ return x.id!==id; });
      save(); renderDay();
    } else if (role === "toggle-focus") {
      var tk = state.tasks.find(function(x){ return x.id===id; });
      if (tk) {
        if (!tk.focus) {
          var count = state.tasks.filter(function(x){ return x.date===tk.date && x.focus; }).length;
          if (count >= 3) { flashLimit(); return; }
        }
        tk.focus = !tk.focus; save(); renderDay();
      }
    } else if (role === "unfocus" || role === "focus-toggle-text") {
      var tf = state.tasks.find(function(x){ return x.id===id; });
      if (tf) {
        if (role === "unfocus") { tf.focus = false; } else { tf.done = !tf.done; }
        save(); renderDay();
      }
    } else if (role === "del-appt") {
      var ap = state.appointments.find(function(x){ return x.id===id; });
      if (ap && ap.painelKey) {
        if (!confirm("Esta assinatura veio do painel do cartório. Tirar só daqui do Bússola? (No painel ela continua.) Se a data mudar lá, ela volta a aparecer.")) return;
        state.painelHidden[ap.painelKey] = true;
      }
      if (ap && ap.convite && ap.convite.eventId) {
        if (!confirm("Este compromisso tem convite na sua agenda do Google. Apagar lá também?")) return;
        conviteDesfazer(ap.convite.eventId);
      }
      state.appointments = state.appointments.filter(function(x){ return x.id!==id; });
      save(); renderDay(); renderWeek();
    } else if (role === "pin-note") {
      var n = state.notes.find(function(x){ return x.id===id; });
      if (n) { n.pinned = !n.pinned; save(); renderNotes(); }
    } else if (role === "del-note") {
      state.notes = state.notes.filter(function(x){ return x.id!==id; });
      save(); renderNotes();
    } else if (role === "goto-day") {
      dayCursor = fromIso(el.getAttribute("data-date"));
      view = "dia";
      document.querySelectorAll(".view-switch button").forEach(function(b){
        b.setAttribute("aria-pressed", b.getAttribute("data-view")==="dia" ? "true":"false");
      });
      document.querySelectorAll(".view-panel").forEach(function(p){ p.classList.remove("active"); });
      $("view-dia").classList.add("active");
      renderDay();
      loadPagePad();
    }
  });

  var limitFlashTimer = null;
  function flashLimit(){
    var h2 = document.querySelector('#view-dia .day-left h2');
    if (!h2) return;
    var prev = h2.innerHTML;
    h2.innerHTML = 'Foco de hoje <span class="hint" style="color:var(--personal);">só até 3 — tire uma antes de adicionar outra</span>';
    clearTimeout(limitFlashTimer);
    limitFlashTimer = setTimeout(function(){ h2.innerHTML = prev; }, 2400);

  function escapeHtml(s){
    return String(s).replace(/[&<>"']/g, function(c){ return { "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;" }[c]; });
  }

  // ════════════════════════════════════════════════════════════════════
  // TAREFAS PROFISSIONAIS → BLOCO DE NOTAS DO PAINEL
  // Tarefa marcada ✦ Profissional vira um lembrete na aba Shirley do Bloco de
  // Notas do painel (/focos, o mesmo nó que o formulário do painel grava).
  // Concluir vale nos dois lados, a pedido dela. O painel grava /focos como
  // uma lista inteira; aqui se escreve só no item — acrescentar no fim, marcar
  // `done` no índice, apagar o índice —, para nunca regravar a lista dela.
  // Se o banco não responder, a tarefa fica marcada "a caminho" e a próxima
  // conferência tenta de novo: nada some em silêncio.
  // ════════════════════════════════════════════════════════════════════
  var PAINEL_RESP = "shirley";

  function painelPedir(caminho, opt){
    return fetch(PAINEL_DB + "/" + caminho + ".json", Object.assign({ cache: "no-store" }, opt || {})).then(function(r){
      if (!r.ok) throw new Error("HTTP " + r.status);
      return r.json();
    });
  }
  function focosLista(v){
    var out = [];
    if (!v) return out;
    Object.keys(v).forEach(function(k){ if (v[k] && typeof v[k] === "object") out.push({ key: k, f: v[k] }); });
    return out;
  }
  function focoAchar(v, id){
    return focosLista(v).filter(function(x){ return x.f.id === id; })[0] || null;
  }
  function focoDaTarefa(t){
    return { id: t.painel.id, text: t.text, done: !!t.done, casoNome: null, resp: PAINEL_RESP,
             urgente: false, quando: null, origem: "bussola" };
  }
  function tarefaEnviar(t){
    return painelPedir("focos").then(function(v){
      if (focoAchar(v, t.painel.id)) return;
      var prox = 0;
      focosLista(v).forEach(function(x){ var n = parseInt(x.key, 10); if (!isNaN(n) && n >= prox) prox = n + 1; });
      return painelPedir("focos/" + prox, { method: "PUT", body: JSON.stringify(focoDaTarefa(t)) });
    }).then(function(){ t.painel.estado = "ok"; t.painel.ultimoDone = !!t.done; });
  }
  function tarefaConcluirNoPainel(t){
    return painelPedir("focos").then(function(v){
      var x = focoAchar(v, t.painel.id);
      if (!x) { t.painel.estado = "removida"; return; }
      return painelPedir("focos/" + x.key, { method: "PATCH", body: JSON.stringify({ done: !!t.done }) })
        .then(function(){ t.painel.ultimoDone = !!t.done; });
    });
  }
  function tarefaApagarNoPainel(t){
    return painelPedir("focos").then(function(v){
      var x = focoAchar(v, t.painel.id);
      if (x) return painelPedir("focos/" + x.key, { method: "DELETE" });
    });
  }
  // Roda uma ida ao painel e guarda o resultado na tarefa — deu errado, fica
  // o aviso na linha dela até a próxima conferência conseguir.
  function tarefaNoPainel(t, acao){
    t.painel.erro = false;
    return acao(t).catch(function(){ t.painel.erro = true; })
      .then(function(){ save(); renderDay(); });
  }
  // Compara o que o painel diz com o que o Bússola sabe. `ultimoDone` é o
  // último estado em que os dois concordaram: se o painel mudou desde então,
  // vale o painel; se foi aqui que mudou, a mudança ainda precisa subir.
  function painelConciliarTarefas(v){
    var pendentes = [];
    state.tasks.forEach(function(t){
      if (!t.painel) return;
      var x = focoAchar(v, t.painel.id);
      if (t.painel.estado === "enviando") {
        if (!x) { pendentes.push({ t: t, acao: tarefaEnviar }); return; }
        t.painel.estado = "ok"; t.painel.ultimoDone = !!x.f.done;
      }
      if (t.painel.estado !== "ok") return;
      if (!x) { t.painel.estado = "removida"; return; }
      var la = !!x.f.done;
      if (la !== !!t.painel.ultimoDone) { t.done = la; t.painel.ultimoDone = la; t.painel.erro = false; }
      else if (!!t.done !== la) pendentes.push({ t: t, acao: tarefaConcluirNoPainel });
    });
    return pendentes;
  }
  function tarefaChipHtml(t){
    if (!t.painel) return "";
    if (t.painel.estado === "removida") return '<span class="painel-chip fora" title="Apagaram este lembrete no painel. Aqui ele continua.">tirada do painel</span>';
    if (t.painel.erro) return '<span class="painel-chip espera" title="O painel não respondeu. Tento de novo na próxima conferência.">ainda não chegou ao painel</span>';
    if (t.painel.estado === "enviando") return '<span class="painel-chip espera">indo pro painel…</span>';
    return '<span class="painel-chip" title="Está no Bloco de Notas do painel, na aba Shirley">no painel</span>';
  }

  // ════════════════════════════════════════════════════════════════════
  // CONTAS A PAGAR
  // A conta que se esquece de pagar: a faxina, o IPTU. Cada conta tem o
  // próximo vencimento; "Paguei" registra o pagamento, lança a saída na
  // planilha do mês e empurra o vencimento para a próxima vez (ou encerra a
  // conta, se era de uma vez só). Conta atrasada aparece no topo do Dia até
  // ser paga — com o tanto de dias, sem bronca.
  // ════════════════════════════════════════════════════════════════════
  var CONTA_REPETE = { nao: "uma vez só", semana: "toda semana", quinzena: "a cada 15 dias", mes: "todo mês", ano: "todo ano" };
  function contaProxima(c){
    var d = fromIso(c.venc);
    if (c.repete === "semana") d = addDays(d, 7);
    else if (c.repete === "quinzena") d = addDays(d, 15);
    else if (c.repete === "mes") {
      // Dia 31 num mês de 30 cai no último dia — e volta ao 31 quando der.
      var dia = c.dia || d.getDate();
      var ult = new Date(d.getFullYear(), d.getMonth() + 2, 0).getDate();
      d = new Date(d.getFullYear(), d.getMonth() + 1, Math.min(dia, ult));
    }
    else if (c.repete === "ano") d = new Date(d.getFullYear() + 1, d.getMonth(), d.getDate());
    return iso(d);
  }
  function contaDias(c){ return Math.round((fromIso(c.venc) - today()) / 86400000); }
  function contaQuando(c){
    var n = contaDias(c);
    if (n < -1) return "venceu há " + (-n) + " dias";
    if (n === -1) return "venceu ontem";
    if (n === 0) return "vence hoje";
    if (n === 1) return "vence amanhã";
    return "vence em " + n + " dias · " + fmtShort(fromIso(c.venc));
  }
  function contasAtivas(){
    return (state.contas || []).filter(function(c){ return c.ativa; })
      .sort(function(a, b){ return a.venc < b.venc ? -1 : a.venc > b.venc ? 1 : 0; });
  }
  // Hoje e atrasadas já estão nas Tarefas do dia; o aviso do topo fica com
  // o que vem nos próximos três dias, para dar tempo de se preparar.
  function contasChegando(){ return contasAtivas().filter(function(c){ var n = contaDias(c); return n >= 1 && n <= 3; }); }
  function moeda(v){ return FIN ? FIN.moeda(v) : "R$ " + Number(v || 0).toFixed(2).replace(".", ","); }
  function lerDinheiro(s){ return FIN ? FIN.num(s) : parseFloat(String(s).replace(/\./g, "").replace(",", ".")) || 0; }

  function contaLinhaHtml(c, comRepete){
    var venceu = contaDias(c) < 0;
    return '<div class="conta-linha">' +
      '<span class="conta-nome' + (c.aMao ? ' cursiva' : '') + '">' + escapeHtml(c.nome) + '</span>' +
      '<span class="conta-quando' + (venceu ? ' venceu' : '') + '">' + contaQuando(c) + '</span>' +
      '<span class="conta-valor">' + (c.valor ? moeda(c.valor) : '') + '</span>' +
      '<button type="button" class="btn-paguei" data-role="conta-paguei" data-id="' + c.id + '">Paguei</button>' +
      '</div>' + (comRepete ? '<div class="conta-rep">' + CONTA_REPETE[c.repete || "nao"] + '</div>' : '');
  }
  function renderContasBanner(){
    var el = $("contasBanner");
    var lista = iso(dayCursor) === TODAY_ISO ? contasChegando() : [];
    if (!lista.length) { el.innerHTML = ""; return; }
    el.innerHTML = '<div class="contas-banner"><h3>Contas dos próximos dias' +
      '<button type="button" data-role="ir-financas">ver todas →</button></h3>' +
      lista.map(function(c){ return contaLinhaHtml(c, false); }).join("") + '</div>';
  }
  function contaPagar(id){
    var c = (state.contas || []).filter(function(x){ return x.id === id; })[0];
    if (!c) return;
    var valor = c.valor || null;
    if (!valor) {
      var r = prompt("Quanto foi \"" + c.nome + "\"? (pode deixar em branco)", "");
      if (r === null) return;
      valor = r.trim() ? lerDinheiro(r) : null;
    }
    c.pagamentos = c.pagamentos || [];
    c.pagamentos.push({ venc: c.venc, pagoEm: TODAY_ISO, valor: valor });
    if (valor) {
      state.financas.lancamentos.push({ id: uid(), data: TODAY_ISO, descricao: c.nome, categoria: "Contas",
        tipo: "saida", valor: valor, contaId: c.id, aMao: c.aMao || undefined });
    }
    if (!c.repete || c.repete === "nao") c.ativa = false;
    else c.venc = contaProxima(c);
    save(); renderAll();
  }

  // ════════════════════════════════════════════════════════════════════
  // FINANÇAS DO MÊS
  // A planilha é do mês do calendário. O salário do cartório NÃO se digita:
  // vem do Financeiro do painel, calculado pela mesma conta que o "Meu
